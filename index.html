          wireSummary(view, () => app.go('speakRun'));
          return;
        }
        view.innerHTML =
          '<div class="run-wrap">' +
          UI.dots(v.idx, v.total) +
          '<div class="word-hero"><span class="w-img">' + U.esc(v.item.img || '💬') + '</span></div>' +
          '<div class="say-line"><button class="round-btn" id="sp-play" aria-label="' + U.esc(T('common.listen')) + '">🔊</button>' +
          '<span class="say-text" dir="' + app.targetDir() + '">' + U.esc(v.item.t) + (v.romaji ? ' <span class="roma">(' + U.esc(v.item.r) + ')</span>' : '') + '</span></div>' +
          (v.asr
            ? '<div class="mic-zone"><button class="mic-btn" id="mic" aria-label="' + U.esc(T('speak.mic')) + '">🎤</button><p class="mic-hint">' + U.esc(T('speak.micHint')) + '</p></div>'
            : '') +
          '<div class="self-fallback"><p class="mic-hint">' + U.esc(T('speak.selfHint')) + '</p>' +
            '<button class="btn" data-self="easy">😄 ' + U.esc(T('speak.self.easy')) + '</button>' +
            '<button class="btn" data-self="ok">🙂 ' + U.esc(T('speak.self.ok')) + '</button>' +
            '<button class="btn ghost" data-self="hard">😵 ' + U.esc(T('speak.self.hard')) + '</button></div>' +
          '</div>';

        UI.qs('#sp-play', view).addEventListener('click', () => app.say(v.item.t, { rate: 0.85 }));
        app.say(v.item.t, { rate: 0.85 });

        const mic = UI.qs('#mic', view);
        if (mic) mic.addEventListener('click', async () => {
          mic.classList.add('listening'); mic.textContent = '👂';
          const res = await app.listenOnce();
          mic.classList.remove('listening'); mic.textContent = '🎤';
          if (res.error) { UI.toast(T('speak.micError')); return; }
          const before = { idx: st.trialIdx };
          PG.eng.speaking.respond(st, profile, { said: res.transcript });
          app.save();
          const moved = st.done || st.trialIdx !== before.idx;
          UI.flash(moved ? 'ok' : 'no', moved ? U.choice([L('speak.fb.great'), L('speak.fb.close')]) : L('speak.fb.practice'));
          setTimeout(draw, moved ? 700 : 1100);
        });
        UI.qsa('[data-self]', view).forEach((b) => b.addEventListener('click', () => {
          PG.eng.speaking.respond(st, profile, { self: b.getAttribute('data-self') });
          app.save();
          draw();
        }));
      };
      draw();
    });
  };

  /* ============================ REVIEW RUN ============================ */
  app.screens.reviewRun = function (view) {
    const profile = app.profile, code = profile.target;
    const st = PG.eng.review.start(profile, code);
    const draw = () => {
      const v = PG.eng.review.present(st, profile);
      if (v.type === 'summary') {
        app.top(T('tab.review'), { back: true });
        const body = '<div class="word-grid">' + v.summary.items.map((it) =>
          '<div class="word-card"><span class="w-img">' + U.esc(it.img || '💬') + '</span><span class="w-t">' + U.esc(it.t) + '</span></div>').join('') + '</div>';
        view.innerHTML = summaryView(v.summary, body);
        wireSummary(view, () => app.go('review', null, { root: true }));
        return;
      }
      app.top(T('tab.review'), { back: true });
      view.innerHTML =
        '<div class="run-wrap">' +
        UI.dots(v.idx, v.total) +
        (v.kind === 'sentence'
          ? '<p class="check-prompt">🔁 ' + U.esc(T('review.inContext')) + '</p>' +
          '<div class="read-line"><button class="round-btn" id="rv-play" aria-label="' + U.esc(T('common.listen')) + '">🔊</button><p class="read-text" dir="' + app.targetDir() + '">' + U.esc(v.text) + '</p></div>'
          : '<p class="check-prompt">🔁 ' + U.esc(T('review.meaning')) + '</p>' +
          '<div class="say-line"><button class="round-btn" id="rv-play" aria-label="' + U.esc(T('common.listen')) + '">🔊</button><span class="say-text" dir="' + app.targetDir() + '">' + U.esc(v.item.t) + '</span></div>') +
        (v.kind === 'pic' || v.kind === 'sentence'
          ? '<div class="opt-grid" id="opts">' + (v.options || []).map((o, i) => UI.optBtn(optItem(code, o), i)).join('') + '</div>'
          : (PG.providers.asr.supported
            ? '<div class="mic-zone"><button class="mic-btn" id="mic" aria-label="' + U.esc(T('speak.mic')) + '">🎤</button><p class="mic-hint">' + U.esc(T('speak.micHint')) + '</p></div>'
            : '') +
          '<div class="self-fallback"><p class="mic-hint">' + U.esc(T('speak.selfHint')) + '</p>' +
            '<button class="btn" data-self="easy">😄 ' + U.esc(T('speak.self.easy')) + '</button>' +
            '<button class="btn" data-self="ok">🙂 ' + U.esc(T('speak.self.ok')) + '</button>' +
            '<button class="btn ghost" data-self="hard">😵 ' + U.esc(T('speak.self.hard')) + '</button></div>') +
        '</div>';

      const play = () => app.say(v.kind === 'sentence' ? v.text : v.item.t, { rate: 0.9 });
      const p = UI.qs('#rv-play', view);
      if (p) p.addEventListener('click', play);
      play();

      UI.qsa('#opts .opt', view).forEach((b) => b.addEventListener('click', () => {
        lockOptions(view);
        PG.eng.review.respond(st, profile, { idx: parseInt(b.getAttribute('data-idx'), 10) });
        app.save();
        const kind = st.lastOutcome === 'ok' ? 'ok' : st.lastOutcome === 'support' ? 'ok-support' : 'no';
        flashFeedback(kind);
        setTimeout(draw, kind === 'no' ? 900 : 650);
      }));
      const mic = UI.qs('#mic', view);
      if (mic) mic.addEventListener('click', async () => {
        mic.classList.add('listening'); mic.textContent = '👂';
        const res = await app.listenOnce();
        mic.classList.remove('listening'); mic.textContent = '🎤';
        if (res.error) { UI.toast(T('speak.micError')); return; }
        PG.eng.review.respond(st, profile, { said: res.transcript });
        app.save();
        draw();
      });
      UI.qsa('[data-self]', view).forEach((b) => b.addEventListener('click', () => {
        PG.eng.review.respond(st, profile, { self: b.getAttribute('data-self') });
        app.save();
        draw();
      }));
    };
    if (st.done || !st.trials.length) {
      app.top(T('tab.review'), { back: true });
      view.innerHTML = '<div class="run-wrap summary"><div class="sum-emoji">✅</div>' +
        '<h2 class="onb-h">' + U.esc(T('review.none')) + '</h2>' +
        '<p class="onb-sub">' + U.esc(T('review.noneSub')) + '</p>' +
        '<div class="onb-actions"><button class="btn" id="rv-home">🏠 ' + U.esc(T('summary.home')) + '</button></div></div>';
      UI.qs('#rv-home', view).addEventListener('click', () => app.go('home', null, { root: true }));
      return;
    }
    draw();
  };

  /* ============================ FLASHCARDS RUN ============================ */
  app.screens.flashRun = function (view) {
    const profile = app.profile, code = profile.target;
    if (!profile.settings.flashcards) {
      app.top(T('rev.flashcards'), { back: true });
      view.innerHTML =
        '<div class="run-wrap summary"><div class="sum-emoji">🃏</div>' +
        '<h2 class="onb-h">' + U.esc(T('rev.flashOff')) + '</h2>' +
        '<p class="onb-sub">' + U.esc(T('rev.flashOffHint')) + '</p>' +
        '<div class="onb-actions"><button class="btn" id="fl-on">🃏 ' + U.esc(T('rev.flashOn')) + '</button></div></div>';
      UI.qs('#fl-on', view).addEventListener('click', () => {
        profile.settings.flashcards = true;
        app.save();
        app.go('flashRun');
      });
      return;
    }
    const st = PG.eng.flashcards.start(profile, code);
    const draw = () => {
      const v = PG.eng.flashcards.present(st, profile);
      if (v.type === 'summary') {
        app.top(T('rev.flashcards'), { back: true });
        view.innerHTML =
          '<div class="run-wrap summary">' +
          '<div class="sum-emoji">' + (v.summary.accuracy >= 0.7 ? '🎉' : '🌱') + '</div>' +
          '<h2 class="onb-h">' + U.esc(T('rev.flashcards')) + '</h2>' +
          '<div class="sum-stats">' +
          '<div class="stat"><span class="stat-v">' + v.summary.got + '</span><span class="stat-l">' + U.esc(T('rev.known')) + '</span></div>' +
          '<div class="stat"><span class="stat-v">' + v.summary.missed + '</span><span class="stat-l">' + U.esc(T('rev.missed')) + '</span></div>' +
          '</div>' +
          '<div class="onb-actions"><button class="btn" data-again>🔁 ' + U.esc(T('summary.again')) + '</button>' +
          '<button class="btn ghost" data-home>🏠 ' + U.esc(T('summary.home')) + '</button></div></div>';
        UI.qs('[data-again]', view).addEventListener('click', () => app.go('flashRun'));
        UI.qs('[data-home]', view).addEventListener('click', () => app.go('home', null, { root: true }));
        return;
      }
      app.top(T('rev.flashcards'), { back: true });
      const front = v.phase === 'front';
      view.innerHTML =
        '<div class="run-wrap">' +
        UI.dots(v.idx, v.total) +
        '<button class="flash-card' + (front ? '' : ' flipped') + '" id="fl-card" dir="' + app.targetDir() + '">' +
        (front
          ? '<span class="expose-img" aria-hidden="true">' + U.esc(v.item.img) + '</span>' +
          '<span class="mic-hint">' + U.esc(T('rev.tapFlip')) + '</span>'
          : '<span class="expose-word">' + U.esc(v.item.t) + '</span>' +
          (v.romaji && v.item.r ? '<span class="roma">' + U.esc(v.item.r) + '</span>' : '') +
          '<span class="expose-img sm" aria-hidden="true">' + U.esc(v.item.img) + '</span>') +
        '</button>' +
        (front
          ? '<div class="onb-actions"><button class="btn xl" id="fl-flip">🔄 ' + U.esc(T('rev.flip')) + '</button></div>'
          : '<div class="onb-actions">' +
          '<button class="btn" id="fl-got">✅ ' + U.esc(T('rev.knewIt')) + '</button>' +
          '<button class="btn ghost" id="fl-miss">❌ ' + U.esc(T('rev.missedIt')) + '</button></div>') +
        '</div>';
      const card = UI.qs('#fl-card', view);
      if (front) {
        app.say(v.item.t, { rate: v.rate });
        const flip = () => { PG.eng.flashcards.respond(st, profile, { flip: true }); app.save(); draw(); };
        card.addEventListener('click', flip);
        UI.qs('#fl-flip', view).addEventListener('click', flip);
      } else {
        app.say(v.item.t, { rate: v.rate });
        UI.qs('#fl-got', view).addEventListener('click', () => {
          PG.eng.flashcards.respond(st, profile, { grade: 'got' });
          app.save(); draw();
        });
        UI.qs('#fl-miss', view).addEventListener('click', () => {
          PG.eng.flashcards.respond(st, profile, { grade: 'missed' });
          app.save(); draw();
        });
      }
    };
    draw();
  };
})();

/* ==== ui/screens-review.js ==== */
/* ============================================================
   POLYGLOT AI — Review tab (v1.1)
   Spaced retrieval in several formats. Flashcards are a separate,
   opt-in format: off by default, with a clear "Flashcards are off"
   panel explaining how to turn them on (here or in Settings).
   ============================================================ */
(function () {
  'use strict';
  const PG = (globalThis.PG = globalThis.PG || {});
  const U = PG.util;
  const UI = PG.ui;
  const app = PG.app;
  const T = (k, v) => PG.i18n.T(k, v);

  app.screens.review = function (view) {
    const profile = app.profile, pack = app.targetPack();
    const due = PG.progression.dueCount(profile);
    app.top(T('tab.review'), { back: false });

    const flashOn = !!profile.settings.flashcards;

    const formatRow = (icon, label) =>
      '<div class="notif-row"><span>' + icon + '</span><span>' + U.esc(label) + '</span></div>';

    view.innerHTML = '<div class="pad list">' +
      '<section class="panel">' +
      '<h3>🔁 ' + U.esc(T('rev.title')) + '</h3>' +
      '<p class="panel-note">' + U.esc(due ? T('review.dueCount', { n: due }) : T('review.noneSub')) + '</p>' +
      '<h3 class="sum-h" style="margin-top:14px">' + U.esc(T('rev.formats')) + '</h3>' +
      formatRow('🖼️', T('rev.fmtContext')) +
      formatRow('👂', T('rev.fmtListen')) +
      formatRow('🎤', T('rev.fmtSay')) +
      (flashOn ? formatRow('🃏', T('rev.fmtFlash')) : '') +
      '<div class="onb-actions"><button class="btn xl" id="rv-start">▶ ' + U.esc(T('common.start')) + '</button></div>' +
      '</section>' +

      (flashOn
        ? '<section class="panel">' +
        '<h3>🃏 ' + U.esc(T('rev.flashcards')) + '</h3>' +
        '<p class="panel-note">' + U.esc(T('rev.flashOnHint')) + '</p>' +
        '<div class="onb-actions">' +
        '<button class="btn" id="rv-flash">🃏 ' + U.esc(T('rev.startFlash')) + '</button>' +
        '<button class="btn ghost" id="rv-fl-off">' + U.esc(T('rev.turnOff')) + '</button></div>' +
        '</section>'
        : '<section class="panel flash-off-panel">' +
        '<h3>🃏 ' + U.esc(T('rev.flashcards')) + '</h3>' +
        '<div class="flash-off-box">🃏<div>' + U.esc(T('rev.flashOff')) + '</div></div>' +
        '<p class="panel-note">' + U.esc(T('rev.flashOffHint')) + '</p>' +
        '<div class="onb-actions"><button class="btn" id="rv-fl-on">🃏 ' + U.esc(T('rev.flashOn')) + '</button></div>' +
        '</section>') +
      '</div>';

    UI.qs('#rv-start', view).addEventListener('click', () => app.go('reviewRun'));
    /* #rv-flash only renders when flashcards are on; wiring it unconditionally
       threw here with flashcards off (the default) and left every button on the
       tab dead — guard it like the on/off buttons below */
    const flash = UI.qs('#rv-flash', view);
    if (flash) flash.addEventListener('click', () => app.go('flashRun'));
    const on = UI.qs('#rv-fl-on', view);
    if (on) on.addEventListener('click', () => {
      profile.settings.flashcards = true;
      app.save();
      app.screens.review(view);
      UI.toast(T('rev.flashOnToast'));
    });
    const off = UI.qs('#rv-fl-off', view);
    if (off) off.addEventListener('click', () => {
      profile.settings.flashcards = false;
      app.save();
      app.screens.review(view);
    });
  };
})();

/* ==== ui/screens-you.js ==== */
/* ============================================================
   POLYGLOT AI — You tab (v1.1)
   Profile (avatar, name), learning-language status sheet with
   cultural notes, the 10-dimension dashboard, history, and
   settings: interface language, learning language, captions, Help
   toggle, flashcards, speed, privacy, export and delete.
   ============================================================ */
(function () {
  'use strict';
  const PG = (globalThis.PG = globalThis.PG || {});
  const U = PG.util;
  const UI = PG.ui;
  const app = PG.app;
  const T = (k, v) => PG.i18n.T(k, v);

  const AVATARS = ['🙂', '😀', '😎', '🤓', '🧑', '👩', '🧔', '👨', '🦊', '🐼', '🐱', '🦉'];

  const INTERFACE_LOCALES = [
    { code: 'en', name: 'English' }, { code: 'es', name: 'Español' }, { code: 'fr', name: 'Français' },
    { code: 'de', name: 'Deutsch' }, { code: 'pt', name: 'Português' }, { code: 'it', name: 'Italiano' },
    { code: 'ru', name: 'Русский' }, { code: 'ar', name: 'العربية' }, { code: 'zh', name: '中文' }, { code: 'ja', name: '日本語' },
  ];

  function langSheet(profile) {
    const pack = app.targetPack();
    const statusText = pack.status === 'verified' ? T('you.verifiedLong') : T('you.draftLong');
    app.openSheet(
      '<h3 class="sheet-title">' + pack.flag + ' ' + U.esc(pack.nativeName || pack.name) + '</h3>' +
      '<p class="sheet-status">' + (pack.status === 'verified' ? '✓ ' : '◐ ') + U.esc(statusText) + '</p>' +
      (pack.culture && pack.culture.length
        ? '<h4 class="sheet-h">' + U.esc(T('you.culture')) + '</h4>' +
        pack.culture.map((c) => '<p class="sheet-p">• ' + U.esc(c) + '</p>').join('')
        : '') +
      '<h4 class="sheet-h">' + U.esc(T('you.interfaceLang')) + '</h4>' +
      '<p class="sheet-p">' + U.esc(INTERFACE_LOCALES.find((l) => l.code === profile.native).name) + '</p>' +
      '<div class="onb-actions"><button class="btn" id="sh-close">' + U.esc(T('common.close')) + '</button></div>',
      (body) => {
        UI.qs('#sh-close', body).addEventListener('click', () => app.closeSheet());
      }
    );
  }

  app.screens.you = function (view) {
    const profile = app.profile;
    const prog = PG.progression.compute(profile);
    const counts = PG.learner.stateCounts(profile);
    const pack = app.targetPack();
    app.top(T('tab.you'), { back: false });

    const dims = PG.learner.DIMS.map((d) => {
      const s = PG.learner.dimScore(profile, d);
      return { key: d, label: T('dims.' + d), score: s.score, conf: s.conf, n: s.n };
    });
    const maxState = Math.max(1, ...counts.slice(1));
    const stateLabels = [null, T('states.1'), T('states.2'), T('states.3'), T('states.4'), T('states.5'), T('states.6')];
    const statusBadge = pack.status === 'verified'
      ? '<span class="badge verified">✓ ' + U.esc(T('you.verified')) + '</span>'
      : '<span class="badge draft">◐ ' + U.esc(T('you.draft')) + '</span>';

    view.innerHTML =
      '<div class="pad dashboard">' +

      '<section class="panel you-head">' +
      '<button class="you-avatar" id="you-avatar" aria-label="' + U.esc(T('you.avatar')) + '">' + U.esc(profile.avatar || '🙂') + '</button>' +
      '<div class="you-id"><input class="you-name" id="you-name" type="text" maxlength="40" value="' + U.esc(profile.name || '') + '" placeholder="' + U.esc(T('onb.namePlaceholder')) + '" aria-label="' + U.esc(T('you.name')) + '">' +
      '<button class="lang-line" id="you-lang">🎓 ' + U.esc(pack.nativeName || pack.name) + ' ' + statusBadge + '</button>' +
      '<button class="sync-chip" id="you-sync" data-sync-chip hidden></button></div>' +
      '</section>' +

      '<section class="stats-row">' +
      '<div class="stat"><span class="stat-v">🔥 ' + (profile.streak || 0) + '</span><span class="stat-l">' + U.esc(T('home.streak')) + '</span></div>' +
      '<div class="stat"><span class="stat-v">✨ ' + (profile.xp || 0) + '</span><span class="stat-l">' + U.esc(T('home.xp')) + '</span></div>' +
      '<div class="stat"><span class="stat-v">' + PG.learner.knownCount(profile, PG.learner.ST.RECOGNIZED) + '</span><span class="stat-l">' + U.esc(T('home.words')) + '</span></div>' +
      '</section>' +

      '<section class="panel"><h3>' + U.esc(T('profile.dims')) + '</h3>' +
      UI.radar(dims) +
      '<div class="dim-legend">' +
      dims.map((d) =>
        '<div class="dim-row' + (d.conf < 0.3 ? ' weak' : '') + '"><span class="dim-name">' + U.esc(d.label) + '</span>' +
        '<span class="dim-bar"><span class="dim-fill" style="width:' + d.score + '%"></span></span>' +
        '<span class="dim-val">' + d.score + (d.conf < 0.3 ? ' <span class="low">(' + U.esc(T('profile.lowEvidence')) + ')</span>' : '') + '</span></div>'
      ).join('') + '</div></section>' +

      '<section class="panel"><h3>🔤 ' + U.esc(T('profile.words')) + '</h3>' +
      stateLabels.map((lbl, i) => i >= 1 ? UI.bar(lbl, counts[i], maxState, 'st' + i) : '').join('') +
      '<p class="panel-note">' + U.esc(T('profile.funnelNote')) + '</p></section>' +

      '<section class="panel"><h3>🧠 ' + U.esc(T('profile.decisions')) + '</h3>' +
      '<div class="decision"><span class="d-k">' + U.esc(T('profile.d.tier')) + '</span><span class="d-v">' + U.esc(T('profile.tier.' + prog.tier)) + '</span></div>' +
      '<div class="decision"><span class="d-k">' + U.esc(T('profile.d.rate')) + '</span><span class="d-v">' + (Math.round(prog.rate * 100) / 100) + '×</span></div>' +
      '<div class="decision"><span class="d-k">' + U.esc(T('profile.d.new')) + '</span><span class="d-v">' + prog.newPerAct + '</span></div>' +
      (prog.accRecent != null ? '<div class="decision"><span class="d-k">' + U.esc(T('profile.d.acc')) + '</span><span class="d-v">' + Math.round(prog.accRecent * 100) + '%</span></div>' : '') +
      '<ul class="why-list">' + (prog.reasons || []).map((r) => '<li>💡 ' + U.esc(T(r.key, r.data)) + '</li>').join('') +
      '<li>🎯 ' + U.esc(T('why.' + prog.focusDim, { dim: T('dims.' + prog.focusDim) })) + '</li></ul></section>' +

      '<section class="panel"><h3>🕘 ' + U.esc(T('profile.history')) + '</h3>' +
      '<div class="history">' +
      /* evidence of the current language's path only (v3 per-language state) */
      (profile.history.filter((h) => h.lg === profile.target && h.kind !== 'trialItem').length ?
        U.last(profile.history.filter((h) => h.lg === profile.target && h.kind !== 'trialItem'), 12).reverse().map((h) =>
          '<div class="h-row"><span class="h-ico">' + (h.ok ? '✅' : '🔁') + '</span>' +
          '<span class="h-what">' + U.esc(histLabel(h)) + '</span>' +
          '<span class="h-when">' + new Date(h.t).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) + '</span></div>').join('')
        : '<p class="panel-note">' + U.esc(T('profile.noHistory')) + '</p>') +
      '</div></section>' +

      '<div class="onb-actions"><button class="btn" id="go-settings">⚙️ ' + U.esc(T('settings.title')) + '</button></div>' +
      '</div>';

    function histLabel(h) {
      const dimMap = { listening: T('dims.listening'), reading: T('dims.reading'), vocab: T('dims.vocab'), expressions: T('dims.expressions'), comprehension: T('dims.comprehension'), retention: T('dims.retention'), transfer: T('dims.transfer'), speaking: T('dims.speaking'), pronunciation: T('dims.pronunciation'), fluency: T('dims.fluency') };
      if (h.kind === 'exposure') return T('profile.h.exposure');
      if (h.kind === 'production') return T('profile.h.production');
      if (h.kind === 'review') return T('profile.h.review');
      return dimMap[h.dim] || T('profile.h.check');
    }

    UI.qs('#you-name', view).addEventListener('change', (e) => {
      profile.name = e.target.value.slice(0, 40);
      app.save();
    });
    UI.qs('#you-lang', view).addEventListener('click', () => langSheet(profile));
    const syncChip = UI.qs('#you-sync', view);
    if (syncChip) {
      syncChip.addEventListener('click', () => app.go('settings'));
      app.renderSyncChips();   /* populate the synced/offline chip immediately */
    }
    UI.qs('#you-avatar', view).addEventListener('click', () => {
      app.openSheet(
        '<h3 class="sheet-title">' + U.esc(T('you.avatar')) + '</h3>' +
        '<div class="avatar-grid sheet-avatars">' + AVATARS.map((a) =>
          '<button class="avatar-btn' + (profile.avatar === a ? ' picked' : '') + '" data-av="' + a + '" aria-label="' + a + '">' + a + '</button>').join('') + '</div>',
        (body) => {
          UI.qsa('[data-av]', body).forEach((b) => b.addEventListener('click', () => {
            profile.avatar = b.getAttribute('data-av');
            app.save();
            app.closeSheet();
            app.screens.you(view);
          }));
        }
      );
    });
    UI.qs('#go-settings', view).addEventListener('click', () => app.go('settings'));
  };

  /* ============================ SETTINGS ============================ */
  app.screens.settings = function (view) {
    const profile = app.profile;
    const pack = app.targetPack();
    app.top(T('settings.title'), { back: true });

    const voices = PG.providers.tts.voicesFor(pack.langPrefixes);
    const s = profile.settings;

    function toggle(id, label, hint, on, onChange) {
      return '<label class="toggle-row" for="' + id + '"><span class="t-label">' + U.esc(label) +
        (hint ? '<span class="t-hint">' + U.esc(hint) + '</span>' : '') + '</span>' +
        '<input type="checkbox" id="' + id + '"' + (on ? ' checked' : '') + '><span class="t-switch" aria-hidden="true"></span></label>';
    }

    /* ---- optional account sync (v1.2): three states ---- */
    function syncSection() {
      if (!PG.sync) return '';
      const info = PG.sync.info();
      if (!info.configured) {
        return '<section class="panel" id="sync-panel"><h3>☁️ ' + U.esc(T('sync.title')) + '</h3>' +
          '<p class="panel-note">' + U.esc(T('sync.hint')) + '</p>' +
          '<label class="field"><span>' + U.esc(T('sync.cfgUrl')) + '</span>' +
          '<input type="url" id="sync-url" placeholder="https://xxxx.supabase.co" spellcheck="false"></label>' +
          '<label class="field"><span>' + U.esc(T('sync.cfgKey')) + '</span>' +
          '<input type="text" id="sync-key" autocomplete="off" spellcheck="false"></label>' +
          '<div class="onb-actions"><button class="btn ghost" id="sync-connect">' + U.esc(T('sync.cfgConnect')) + '</button></div>' +
          '<p class="panel-note">' + U.esc(T('sync.cfgHint')) + '</p></section>';
      }
      if (!info.email) {
        return '<section class="panel" id="sync-panel"><h3>☁️ ' + U.esc(T('sync.title')) + '</h3>' +
          '<p class="panel-note">' + U.esc(T('sync.hint')) + '</p>' +
          '<label class="field"><span>' + U.esc(T('sync.email')) + '</span>' +
          '<input type="email" id="sync-email" autocomplete="username"></label>' +
          '<label class="field"><span>' + U.esc(T('sync.password')) + '</span>' +
          '<input type="password" id="sync-pass" autocomplete="current-password"></label>' +
          '<div class="onb-actions"><button class="btn" id="sync-signin">' + U.esc(T('sync.signIn')) + '</button>' +
          '<button class="btn ghost" id="sync-signup">' + U.esc(T('sync.signUp')) + '</button></div>' +
          '<p class="panel-note" id="sync-msg"></p></section>';
      }
      return '<section class="panel" id="sync-panel"><h3>☁️ ' + U.esc(T('sync.title')) + '</h3>' +
        '<p class="panel-note"><b>' + U.esc(T('sync.signedInAs', { email: info.email })) + '</b></p>' +
        '<p class="panel-note"><span class="sync-chip static" data-sync-chip hidden></span></p>' +
        '<div class="onb-actions"><button class="btn ghost" id="sync-now">🔄 ' + U.esc(T('sync.syncNow')) + '</button>' +
        '<button class="btn danger" id="sync-signout">' + U.esc(T('sync.signOut')) + '</button></div>' +
        '<p class="panel-note" id="sync-msg">' + U.esc(T('sync.hint')) + '</p></section>';
    }

    function wireSync(view) {
      if (!PG.sync) return;
      const q = (id) => UI.qs('#' + id, view);
      const msg = q('sync-msg');
      const fail = (e) => {
        const m = String((e && e.message) || e);
        if (msg) msg.textContent = /credential|password|email/i.test(m) && /invalid|wrong|bad|weak/i.test(m)
          ? T('sync.err.credentials') : (/network|unreachable/i.test(m) ? T('sync.err.network') : m);
      };
      const connect = q('sync-connect');
      if (connect) connect.addEventListener('click', () => {
        try { PG.sync.setConfig(q('sync-url').value, q('sync-key').value); app.go('settings'); }
        catch (e) { fail(e); }
      });
      const doAuth = (fn) => {
        fn(q('sync-email').value, q('sync-pass').value)
          .then((r) => {
            if (r && r.needsConfirmation) { if (msg) msg.textContent = T('sync.confirmEmail'); return; }
            /* preferRemoteIfEmpty: signing in on a fresh device RESTORES the
               cloud profile instead of letting the empty local one win LWW */
            return PG.sync.syncNow(app._syncDeps(), { preferRemoteIfEmpty: true })
              .then(() => { app.go('settings'); });
          })
          .catch(fail);
      };
      const si = q('sync-signin'); if (si) si.addEventListener('click', () => doAuth((e2, p2) => PG.sync.signIn(e2, p2)));
      const su = q('sync-signup'); if (su) su.addEventListener('click', () => doAuth((e2, p2) => PG.sync.signUp(e2, p2)));
      const so = q('sync-signout'); if (so) so.addEventListener('click', () => {
        PG.sync.signOut().then(() => app.go('settings'));
      });
      const nowBtn = q('sync-now');
      if (nowBtn) nowBtn.addEventListener('click', () => {
        PG.sync.syncNow(app._syncDeps()).then((r) => { app.renderSyncChips(); if (r && !r.ok && r.error) fail(new Error(r.error)); });
      });
      app.renderSyncChips();
    }

    view.innerHTML =
      '<div class="pad settings">' +

      '<section class="panel"><h3>🌐 ' + U.esc(T('settings.languages')) + '</h3>' +
      '<label class="field"><span>' + U.esc(T('settings.interfaceLang')) + '</span>' +
      '<select id="set-native">' + INTERFACE_LOCALES.map((l) =>
        '<option value="' + l.code + '"' + (profile.native === l.code ? ' selected' : '') + '>' + U.esc(l.name) + '</option>').join('') + '</select></label>' +
      '<label class="field"><span>' + U.esc(T('settings.learningLang')) + '</span>' +
      '<select id="set-target">' + PG.content.packs().map((p) =>
        '<option value="' + p.code + '"' + (profile.target === p.code ? ' selected' : '') + '>' + U.esc(p.nativeName || p.name) + (p.status === 'draft' ? ' — ' + T('you.draft') : '') + '</option>').join('') + '</select></label>' +
      '</section>' +

      '<section class="panel"><h3>🔊 ' + U.esc(T('settings.audio')) + '</h3>' +
      '<label class="field"><span>' + U.esc(T('settings.voice')) + '</span>' +
      (voices.length
        ? '<select id="set-voice">' + voices.map((v) =>
          '<option value="' + U.esc(v.voiceURI) + '"' + (s.voice === v.voiceURI ? ' selected' : '') + '>' + U.esc(v.name + ' (' + v.lang + ')') + '</option>').join('') + '</select>'
        : '<p class="warn">⚠️ ' + U.esc(T('settings.voiceNone', { lang: pack.name })) + '</p>') + '</label>' +
      '<label class="field"><span>' + U.esc(T('settings.rate')) + ' <b id="rate-val">' + s.rate + '×</b></span>' +
      '<input type="range" id="set-rate" min="0.6" max="1.2" step="0.05" value="' + s.rate + '"></label>' +
      '<button class="btn ghost" id="set-test">▶ ' + U.esc(T('settings.rateTest')) + '</button></section>' +

      '<section class="panel"><h3>🎓 ' + U.esc(T('settings.learning')) + '</h3>' +
      toggle('set-captions', T('settings.captions'), T('settings.captionsHint'), s.captions) +
      (pack.romaji ? toggle('set-romaji', T('settings.romaji'), T('settings.romajiHint'), s.romaji) : '') +
      toggle('set-spoken', T('settings.spokenResp'), T('settings.spokenRespHint'), s.spokenResp) +
      toggle('set-assist', T('settings.assist'), T('settings.assistHint'), s.assist) +
      toggle('set-flash', T('rev.flashcards'), T('rev.flashOffHint'), s.flashcards) + '</section>' +

      '<section class="panel"><h3>🎨 ' + U.esc(T('settings.appearance')) + '</h3>' +
      toggle('set-dark', T('settings.dark'), '', s.dark) + '</section>' +

      '<section class="panel"><h3>💾 ' + U.esc(T('settings.data')) + '</h3>' +
      '<div class="onb-actions">' +
      '<button class="btn" id="set-export">📤 ' + U.esc(T('settings.exportBtn')) + '</button>' +
      '<button class="btn" id="set-import">📥 ' + U.esc(T('settings.importBtn')) + '</button>' +
      '<button class="btn danger" id="set-delete">🗑️ ' + U.esc(T('settings.deleteBtn')) + '</button></div>' +
      '<input type="file" id="set-file" accept="application/json" hidden>' +
      '<p class="panel-note">' + U.esc(T('settings.privacy')) + '</p></section>' +

      syncSection() +

      '<section class="panel"><h3>🦜 Polyglot AI</h3>' +
      '<p class="panel-note">' + U.esc(T('settings.about')) + '</p>' +
      '<p class="panel-note">' + U.esc(T('settings.version', { v: PG.config.version })) + '</p></section>' +
      '</div>';

    const nativeSel = UI.qs('#set-native', view);
    nativeSel.addEventListener('change', () => {
      profile.native = nativeSel.value;
      app.save();
      app.applyLang();
      app.go('settings');
    });
    const targetSel = UI.qs('#set-target', view);
    targetSel.addEventListener('change', () => {
      const next = targetSel.value;
      if (PG.content.pack(next) && PG.content.pack(next).status === 'draft') {
        UI.toast(T('you.draft'));
      }
      profile.target = next;
      app.save();
      app.applyLang();
      app.go('settings');
    });
    const voiceSel = UI.qs('#set-voice', view);
    if (voiceSel) voiceSel.addEventListener('change', () => { s.voice = voiceSel.value; app.save(); });
    const rate = UI.qs('#set-rate', view);
    rate.addEventListener('input', () => { s.rate = parseFloat(rate.value); UI.qs('#rate-val', view).textContent = s.rate + '×'; app.save(); });
    UI.qs('#set-test', view).addEventListener('click', () => {
      const it = PG.content.itemsByTag(profile.target, 'drink')[0] || PG.content.pack(profile.target).items[0];
      app.say(it.t);
    });

    const bindToggle = (id, key, extra) => {
      const el = UI.qs('#' + id, view);
      if (el) el.addEventListener('change', () => {
        s[key] = el.checked;
        app.save();
        if (extra) extra();
        UI.toast(T('toast.saved'));
      });
    };
    bindToggle('set-captions', 'captions');
    bindToggle('set-romaji', 'romaji');
    bindToggle('set-spoken', 'spokenResp');
    bindToggle('set-assist', 'assist');
    bindToggle('set-flash', 'flashcards');
    bindToggle('set-dark', 'dark', () => document.body.classList.toggle('dark', s.dark));

    UI.qs('#set-export', view).addEventListener('click', () => {
      const blob = new Blob([PG.learner.serialize(profile)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'polyglot-ai-backup-' + profile.target + '.json';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
      UI.toast(T('toast.exported'));
    });
    const fileIn = UI.qs('#set-file', view);
    UI.qs('#set-import', view).addEventListener('click', () => fileIn.click());
    fileIn.addEventListener('change', () => {
      const f = fileIn.files && fileIn.files[0];
      if (!f) return;
      const r = new FileReader();
      r.onload = () => {
        const res = PG.learner.deserialize(String(r.result));
        if (res.error) { UI.toast(T('onb.importFail')); return; }
        app.profile = res.profile;
        app.applyLang();
        app.save();
        app.go('settings');
        UI.toast(T('onb.restored'));
      };
      r.readAsText(f);
    });
    UI.qs('#set-delete', view).addEventListener('click', () => {
      app.openSheet(
        '<h3 class="sheet-title">🗑️ ' + U.esc(T('settings.deleteBtn')) + '</h3>' +
        '<p class="sheet-p">' + U.esc(T('settings.deleteConfirm')) + '</p>' +
        '<div class="onb-actions">' +
        '<button class="btn danger" id="del-yes">' + U.esc(T('settings.deleteBtn')) + '</button>' +
        '<button class="btn ghost" id="del-no">' + U.esc(T('common.close')) + '</button></div>',
        (body) => {
          UI.qs('#del-yes', body).addEventListener('click', () => {
            /* deleting local data must never silently overwrite the cloud
               copy with the fresh onboarding profile → sign out first */
            if (PG.sync && PG.sync.session()) PG.sync.signOut().catch(() => {});
            U.store.remove('polyglot-ai-v1');
            app.profile = null;
            app.closeSheet();
            app.go('onboarding', null, { root: true });
          });
          UI.qs('#del-no', body).addEventListener('click', () => app.closeSheet());
        }
      );
    });

    wireSync(view);
  };
})();

})();
</script>
</body>
</html>
