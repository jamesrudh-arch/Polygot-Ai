<body>
<noscript><div style="padding:40px;font-family:system-ui;text-align:center">Polyglot AI needs JavaScript. / Polyglot AI necesita JavaScript. / Polyglot AI benötigt JavaScript. / Polyglot AIはJavaScriptが必要です。</div></noscript>
<script>
"use strict";
(function(){
/* ==== core/util.js ==== */
/* ============================================================
   POLYGLOT AI — core utilities (DOM-free, unit-testable)
   All engine modules attach to the global PG namespace.
   ============================================================ */
(function () {
  'use strict';
  const PG = (globalThis.PG = globalThis.PG || {});
  if (PG.util) return; // idempotent

  const MIN = 60 * 1000;
  const HOUR = 60 * MIN;
  const DAY = 24 * HOUR;

  const util = {
    MIN, HOUR, DAY,
    clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); },
    round(v, d = 0) { const m = Math.pow(10, d); return Math.round(v * m) / m; },
    choice(arr) { return arr[Math.floor(Math.random() * arr.length)]; },
    shuffle(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const t = a[i]; a[i] = a[j]; a[j] = t;
      }
      return a;
    },
    sample(arr, n) { return util.shuffle(arr).slice(0, Math.max(0, n)); },
    uniq(arr) { return Array.from(new Set(arr)); },
    last(arr, n) { return arr.slice(Math.max(0, arr.length - n)); },

    /* Normalise text for pronunciation/answer comparison: lowercase, NFC,
       strip punctuation (Western + CJK), collapse whitespace. */
    norm(s) {
      return String(s == null ? '' : s)
        .toLowerCase()
        .normalize('NFC')
        .replace(/[.,!?;:'"“”«»„…()\[\]{}¡¿。、！？・「」『』〜~·–—-]/g, ' ')
        .replace(/\s+/g, ' ')
        .trim();
    },

    levenshtein(a, b) {
      if (a === b) return 0;
      if (!a.length) return b.length;
      if (!b.length) return a.length;
      let prev = new Array(b.length + 1);
      let cur = new Array(b.length + 1);
      for (let j = 0; j <= b.length; j++) prev[j] = j;
      for (let i = 1; i <= a.length; i++) {
        cur[0] = i;
        for (let j = 1; j <= b.length; j++) {
          const cost = a.charCodeAt(i - 1) === b.charCodeAt(j - 1) ? 0 : 1;
          cur[j] = Math.min(cur[j - 1] + 1, prev[j] + 1, prev[j - 1] + cost);
        }
        const t = prev; prev = cur; cur = t;
      }
      return prev[b.length];
    },

    /* Similarity in [0,1] between two strings after normalisation. */
    similarity(a, b) {
      const x = util.norm(a), y = util.norm(b);
      if (!x && !y) return 1;
      if (!x || !y) return 0;
      return 1 - util.levenshtein(x, y) / Math.max(x.length, y.length);
    },

    /* Escape text before inserting into innerHTML (defence in depth:
       all content is authored, but imported data must never inject markup). */
    esc(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    },

    now() { return Date.now(); },
    dayKey(ts) { const d = new Date(ts); return d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate(); },

    /* Local, privacy-preserving storage. Falls back to memory when
       localStorage is unavailable (private mode / test environment). */
    store: (function () {
      let ok = false;
      try {
        const ls = globalThis.localStorage;
        if (ls) { ls.setItem('__pg_t', '1'); ls.removeItem('__pg_t'); ok = true; }
      } catch (e) { ok = false; }
      const mem = {};
      return {
        available: ok,
        get(key) {
          try { const raw = ok ? globalThis.localStorage.getItem(key) : mem[key]; return raw == null ? null : JSON.parse(raw); }
          catch (e) { return null; }
        },
        set(key, val) {
          try { const raw = JSON.stringify(val); if (ok) globalThis.localStorage.setItem(key, raw); else mem[key] = raw; return true; }
          catch (e) { return false; }
        },
        remove(key) {
          try { if (ok) globalThis.localStorage.removeItem(key); else delete mem[key]; } catch (e) { /* noop */ }
        },
      };
    })(),
  };

  PG.util = util;
})();

/* ==== core/config.js ==== */
/* ============================================================
   POLYGLOT AI — configuration flags (v1.1)
   Subscription gating is a config flag, OFF by default: every
   activity is free. Flip subscriptionEnabled and list premium
   activity ids to gate them behind a "premium" lock state.
   ============================================================ */
(function () {
  'use strict';
  const PG = (globalThis.PG = globalThis.PG || {});
  PG.config = {
    version: '1.1.0',
    subscriptionEnabled: false,   // OFF by default — nothing is gated
    premiumActivities: [],        // e.g. ['stories', 'reading'] when enabled
    dailyGoalCount: 3,            // insight · lesson · activity
    draftLanguagesVisible: true,  // draft languages selectable (clearly labelled)
  };
})();

/* ==== core/content.js ==== */
/* ============================================================
   POLYGLOT AI — content store & validation (v1.1, data-driven)
   Languages register through PG.registerLanguage with ONE shared
   concept inventory (PG.inventory). Two item shapes are accepted:
     · rich (verified): items as id→{t, r?, gl?, tags2?, lv2?}
       plus authored templates/scenarios/story/listening/reading
     · map (draft): items as conceptId→"text" (+ optional romaji map)
   Every language carries a visible status: verified | draft.
   Planned languages are listed, never selectable. Adding a
   language requires zero engine-code changes.
   ============================================================ */
(function () {
  'use strict';
  const PG = (globalThis.PG = globalThis.PG || {});

  const packs = {};
  const order = [];

  const POS = ['n', 'v', 'adj', 'expr', 'num', 'feel', 'dir'];

  /* Languages on the roadmap that are NOT implemented. Visible in
     the picker with status "Planned", not selectable. Never label
     anything Verified unless it was reviewed and tested. */
  const PLANNED = [
    { code: 'pa', name: 'پنجابی (Punjabi)', flag: '🇵🇰' },
    { code: 'te', name: 'తెలుగు (Telugu)', flag: '🇮🇳' },
    { code: 'mr', name: 'मराठी (Marathi)', flag: '🇮🇳' },
    { code: 'jv', name: 'Basa Jawa (Javanese)', flag: '🇮🇩' },
    { code: 'yo', name: 'Yorùbá', flag: '🇳🇬' },
    { code: 'my', name: 'မြန်မာ (Burmese)', flag: '🇲🇲' },
  ];

  const FEEDBACK_KEYS = ['fb.perfect1', 'fb.perfect2', 'fb.perfect3', 'fb.good1', 'fb.good2', 'fb.tryAgain1', 'fb.tryAgain2', 'speak.fb.great', 'speak.fb.close', 'speak.fb.practice'];

  /* build a full item list for a language from the shared inventory
     + language-specific translations */
  function buildItems(spec) {
    const inv = PG.inventory;
    const out = [];
    inv.list.forEach((c) => {
      let t = null, r = null, gl = null, tags2 = null, lv2 = null;
      const it = spec.items ? spec.items[c.id] : undefined;
      if (it == null) { t = null; }
      else if (typeof it === 'string') { t = it; r = spec.romajiMap ? (spec.romajiMap[c.id] || null) : null; }
      else { t = it.t; r = it.r != null ? it.r : (spec.romajiMap ? (spec.romajiMap[c.id] || null) : null); gl = it.gl || null; tags2 = it.tags2 || null; lv2 = it.lv2 != null ? it.lv2 : null; }
      if (t == null) return; // coverage gaps are reported by validate()
      out.push({
        id: c.id, t,
        pos: c.pos, img: c.img, lv: lv2 != null ? lv2 : c.lv,
        tags: tags2 ? c.tags + ',' + tags2 : c.tags,
        r: r || null, gl: gl || undefined,
      });
    });
    /* language-specific EXTRA concepts beyond the inventory (e.g. days of
       the week for verified languages) are allowed as rich entries */
    if (spec.extraItems && spec.extraItems.length) {
      spec.extraItems.forEach((e) => {
        if (out.some((o) => o.id === e.id)) return;
        out.push({ id: e.id, t: e.t, r: e.r || null, pos: e.pos, img: e.img || '', lv: e.lv || 2, tags: e.tags || '', gl: e.gl });
      });
    }
    return out;
  }

  function registerLanguage(spec) {
    if (!spec || !spec.code || !spec.name) throw new Error('registerLanguage: missing code/name');
    const pack = {
      code: spec.code,
      name: spec.name,
      nativeName: spec.nativeName || spec.name,
      flag: spec.flag || '🏳️',
      bcp47: spec.bcp47 || spec.code,
      langPrefixes: spec.prefixes || [spec.code],
      script: spec.script || 'latin',
      rtl: !!spec.rtl,
      romaji: !!(spec.romajiMap || (spec.items && Object.values(spec.items).some((v) => v && typeof v === 'object' && v.r))),
      romanisation: spec.romanisation || null, // 'pinyin' | 'romaji' | 'transliteration' | null
      status: spec.status === 'verified' ? 'verified' : 'draft',
      culture: spec.culture || [],
      sounds: spec.sounds || null,
      numbers: spec.numbers || null,
      lessonFeedback: spec.lessonFeedback || null,
      glossLangs: spec.glossLangs || [],
      accent: spec.accent, accent2: spec.accent2,
      contract: spec.contract || null,
      items: buildItems(spec),
      templates: spec.templates || null,
      scenarios: spec.scenarios || null,
      story: spec.story || null,
      listening: spec.listening || null,
      reading: spec.reading || null,
    };
    packs[pack.code] = pack;
    order.push(pack.code);
  }

  const content = {
    POS,
    PLANNED,
    FEEDBACK_KEYS,
    registerLanguage,

    /* legacy alias (rich pre-built packs) — kept so old sources keep working */
    register(pack) {
      registerLanguage({
        code: pack.code, name: pack.name, nativeName: pack.nativeName || pack.name, flag: pack.flag,
        bcp47: pack.bcp47, prefixes: pack.langPrefixes, script: pack.script || 'latin', rtl: !!pack.rtl,
        status: pack.status || 'verified', accent: pack.accent, accent2: pack.accent2,
        glossLangs: pack.glossLangs, contract: pack.contract,
        items: {}, /* replaced below — legacy packs carry a full item array */
        templates: pack.templates, scenarios: pack.scenarios, story: pack.story,
        listening: pack.listening, reading: pack.reading,
        sounds: pack.sounds, numbers: pack.numbers, lessonFeedback: pack.lessonFeedback,
        culture: pack.culture, romanisation: pack.romanisation,
      });
      packs[pack.code].items = pack.items; // already complete
    },

    codes() { return order.slice(); },
    pack(code) { return packs[code] || null; },
    packs() { return order.map((c) => packs[c]); },

    /* status helpers */
    statuses() {
      const out = { verified: [], draft: [], planned: PLANNED.slice() };
      order.forEach((c) => out[packs[c].status].push(packs[c]));
      return out;
    },
    isSelectable(code) { return !!packs[code]; },

    item(code, id) {
      const p = packs[code];
      if (!p) return null;
      if (!p._byId) content.index();
      return p._byId[id] || null;
    },
    items(code) { const p = packs[code]; return p ? p.items : []; },
    itemsByTag(code, tag, opts) {
      const p = packs[code]; if (!p) return [];
      opts = opts || {};
      let out = p.items.filter((it) => (it.tags || '').split(',').indexOf(tag) >= 0);
      if (opts.lv) out = out.filter((it) => (it.lv || 1) <= opts.lv);
      if (opts.maxLv) out = out.filter((it) => (it.lv || 1) <= opts.maxLv);
      return out;
    },
    index() {
      order.forEach((c) => {
        const p = packs[c];
        if (!p._byId) {
          p._byId = {};
          p.items.forEach((it) => { p._byId[it.id] = it; });
        }
      });
    },

    /* ---- validation: returns array of error strings (empty = valid) ---- */
    validate(pack) {
      const errs = [];
      const E = (m) => errs.push(m);
      const code = pack.code;
      if (!code) return ['pack missing code'];
      if (!pack.name || !pack.flag) E(code + ': missing name/flag');
      if (!pack.bcp47) E(code + ': missing bcp47');
      if (pack.status !== 'verified' && pack.status !== 'draft') E(code + ': bad status ' + pack.status);

      const ids = new Set();
      const glossLangs = pack.glossLangs || [];
      pack.items.forEach((it, i) => {
        const pre = code + ' item[' + i + '] ' + (it.id || '?');
        if (!it.id) { E(pre + ': missing id'); return; }
        if (ids.has(it.id)) E(pre + ': duplicate id');
        ids.add(it.id);
        if (!it.t || !String(it.t).trim()) E(pre + ': missing text');
        if (POS.indexOf(it.pos) < 0) E(pre + ': bad pos ' + it.pos);
        if (!it.tags || !it.tags.trim()) E(pre + ': missing tags');
        if (it.img && String(it.img).length > 8) E(pre + ': img too long');
        if (it.lv !== 1 && it.lv !== 2 && it.lv !== 3) E(pre + ': bad level ' + it.lv);
        if (it.pos === 'num' && !/^\d+$/.test(String(it.img || ''))) E(pre + ': num item needs numeral img');
        if (glossLangs.length) {
          glossLangs.forEach((l) => { if (!it.gl || !it.gl[l]) E(pre + ': missing ' + l + ' gloss'); });
        }
      });

      /* inventory coverage — every concept must be translated */
      PG.inventory.ids.forEach((id) => {
        if (!ids.has(id)) E(code + ': missing inventory concept "' + id + '"');
      });

      if (pack.status === 'draft') {
        /* draft contract: complete inventory + in-lesson feedback strings.
           No authored blocks (scenarios/story/…) are required — activity
           cards explain what is unavailable. */
        FEEDBACK_KEYS.forEach((k) => {
          if (!pack.lessonFeedback || !pack.lessonFeedback[k]) E(code + ': draft missing lesson feedback "' + k + '"');
        });
        if (pack.numbers) {
          ['price', 'time'].forEach((k) => {
            if (pack.numbers[k] && String(pack.numbers[k]).indexOf('{n}') < 0) E(code + ': numbers.' + k + ' needs {n}');
          });
          if (pack.numbers.days && pack.numbers.days.length !== 7) E(code + ': numbers.days needs exactly 7');
        }
        return errs;
      }

      /* ---------- verified: the full schema from v1 ---------- */
      if (!Array.isArray(pack.items) || pack.items.length < PG.inventory.count) E(code + ': too few items');
      const tagCount = {};
      pack.items.forEach((it) => (it.tags || '').split(',').forEach((t) => { tagCount[t] = (tagCount[t] || 0) + 1; }));
      (pack.templates || []).forEach((tp, i) => {
        const pre = code + ' template[' + i + '] ' + (tp.id || '?');
        if (!tp.id) E(pre + ': missing id');
        if (!tp.text || tp.text.indexOf('{') < 0) E(pre + ': no slot');
        const slots = String(tp.text).match(/\{(\w+)\}/g) || [];
        slots.forEach((s) => {
          const tag = s.slice(1, -1);
          if (!tagCount[tag]) E(pre + ': slot tag "' + tag + '" has no items');
          else if (tagCount[tag] < 3) E(pre + ': slot tag "' + tag + '" has <3 items');
        });
      });
      if (!pack.templates || !pack.templates.length) E(code + ' (verified): missing templates');

      (pack.scenarios || []).forEach((sc, si) => {
        const pre = code + ' scenario[' + si + '] ' + (sc.id || '?');
        if (!sc.id || !sc.title || !sc.icon) E(pre + ': missing id/title/icon');
        if (!Array.isArray(sc.stages) || sc.stages.length < 6) E(pre + ': too few stages');
        (sc.stages || []).forEach((st, i) => {
          const spre = pre + ' stage ' + i;
          if (!st.say || !st.say['1']) E(spre + ': missing tier-1 say text');
          const r = st.resp;
          if (!r || !r.k) E(spre + ': missing resp');
          else {
            if (!r.flex) {
              if (!Array.isArray(r.opts) || r.opts.length < 2) E(spre + ': resp needs >=2 opts');
              if (r.k !== 'dir' && !r.free && r.ok == null) E(spre + ': resp missing ok');
              if (Array.isArray(r.opts) && r.ok != null && r.opts.indexOf(r.ok) < 0) E(spre + ': ok not in opts');
              if (Array.isArray(r.opts)) r.opts.forEach((oid) => { if (!ids.has(oid)) E(spre + ': unknown opt item ' + oid); });
            } else if (!r.poolTag) E(spre + ': flex stage needs poolTag');
            if (r.free && !st.after) E(spre + ': free stage needs after consequence');
          }
          if (st.teach) st.teach.forEach((tid) => { if (!ids.has(tid)) E(spre + ': unknown teach item ' + tid); });
        });
      });
      if (!pack.scenarios || !pack.scenarios.length) E(code + ' (verified): missing scenarios');

      const st = pack.story;
      if (!st || !st.title || !st.hero || !Array.isArray(st.chapters)) { E(code + ' (verified): missing story'); }
      else {
        (st.chapters || []).forEach((ch, ci) => {
          const pre = code + ' story ch' + ci;
          if (!ch.id || !ch.title) E(pre + ': missing id/title');
          if (!Array.isArray(ch.panels) || ch.panels.length < 6) E(pre + ': too few panels');
          (ch.panels || []).forEach((p, pi) => { if (!p.text) E(pre + ' panel ' + pi + ': missing text'); });
          (ch.choices || []).forEach((c, i) => {
            if (!Array.isArray(c.opts) || c.opts.length < 2) E(pre + ' choice ' + i + ': needs >=2 opts');
            (c.opts || []).forEach((o) => {
              if (!o.t) E(pre + ' choice ' + i + ': opt missing text');
              if (o.goto != null && (o.goto < 0 || o.goto >= ch.panels.length)) E(pre + ' choice ' + i + ': goto out of range');
            });
          });
          (ch.checks || []).forEach((c, i) => {
            if (!c.k) E(pre + ' check ' + i + ': missing kind');
            if (!Array.isArray(c.opts) || c.opts.length < 2) E(pre + ' check ' + i + ': needs >=2 opts');
            if (c.ok == null || c.ok < 0 || c.ok >= c.opts.length) E(pre + ' check ' + i + ': bad ok');
            (c.opts || []).forEach((o) => { if (o.it && !ids.has(o.it)) E(pre + ' check ' + i + ': unknown item ' + o.it); });
          });
        });
      }

      (pack.listening || []).forEach((set, i) => {
        const pre = code + ' listening[' + i + ']';
        if (!set.id || !set.title) E(pre + ': missing id/title');
        if (!Array.isArray(set.trials) || set.trials.length < 6) E(pre + ': too few trials');
        (set.trials || []).forEach((t, ti) => {
          if (!t.say) E(pre + ' trial ' + ti + ': missing say');
          if (!Array.isArray(t.opts) || t.opts.length < 2) E(pre + ' trial ' + ti + ': needs >=2 opts');
          if (t.ok == null || t.ok < 0 || t.ok >= t.opts.length) E(pre + ' trial ' + ti + ': bad ok');
          (t.opts || []).forEach((o) => { if (o.it && !ids.has(o.it)) E(pre + ' trial ' + ti + ': unknown item ' + o.it); });
        });
      });
      if (!pack.listening || !pack.listening.length) E(code + ' (verified): missing listening sets');

      (pack.reading || []).forEach((tx, i) => {
        const pre = code + ' reading[' + i + ']';
        if (!tx.id || !tx.title) E(pre + ': missing id/title');
        if (!Array.isArray(tx.lines) || tx.lines.length < 5) E(pre + ': too few lines');
        (tx.lines || []).forEach((l, li) => { if (!l.t) E(pre + ' line ' + li + ': missing t'); });
        (tx.tasks || []).forEach((k, ki) => {
          if (!k.k) E(pre + ' task ' + ki + ': missing kind');
          if (k.k === 'order') {
            if (!Array.isArray(k.cards) || k.cards.length < 3) E(pre + ' task ' + ki + ': order needs >=3 cards');
            if (!Array.isArray(k.order) || k.order.length !== k.cards.length) E(pre + ' task ' + ki + ': order length mismatch');
            const seen = new Set(k.order || []);
            if (seen.size !== (k.cards || []).length) E(pre + ' task ' + ki + ': order not a permutation');
          } else {
            if (!Array.isArray(k.opts) || k.opts.length < 2) E(pre + ' task ' + ki + ': needs >=2 opts');
            if (k.ok == null || k.ok < 0 || k.ok >= k.opts.length) E(pre + ' task ' + ki + ': bad ok');
          }
        });
      });
      if (!pack.reading || !pack.reading.length) E(code + ' (verified): missing reading texts');

      /* v1.1 verified extras: curated sounds + number patterns */
      if (!pack.sounds || !Array.isArray(pack.sounds.pairs) || pack.sounds.pairs.length < 6) {
        E(code + ' (verified): needs >=6 curated sound pairs');
      } else {
        pack.sounds.pairs.forEach((p, i) => {
          if (!p || !p.a || !p.b || !p.a.t || !p.b.t) E(code + ' sounds pair ' + i + ': needs a and b');
          if (p.a && p.b && p.a.t === p.b.t) E(code + ' sounds pair ' + i + ': a and b identical');
        });
      }
      if (!pack.numbers || !pack.numbers.price || String(pack.numbers.price).indexOf('{n}') < 0) E(code + ' (verified): missing numbers.price pattern');
      if (!pack.numbers || !pack.numbers.days || pack.numbers.days.length !== 7) E(code + ' (verified): missing 7 day names');
      if (!pack.culture || pack.culture.length < 2) E(code + ' (verified): missing cultural notes');

      return errs;
    },

    /* cross-language parity: every language (verified AND draft) covers
       the complete shared concept inventory */
    parityError() {
      const errs = [];
      const need = PG.inventory.ids;
      order.forEach((c) => {
        const ids = new Set(packs[c].items.map((i) => i.id));
        need.forEach((id) => { if (!ids.has(id)) errs.push(c + ' missing concept ' + id); });
      });
      return errs.length ? errs : null;
    },

    /* duplicate-translation detector: two different concepts mapped to
       the same string is almost certainly an authoring error — except the
       genuine homographs below, where the language truly uses one word for
       both meanings (e.g. Catalan "nou" = nine and new) */
    HOMOGRAPHS: ['ca:nou', 'cs:ahoj!', 'cs:prosím', 'fa:نه', 'fi:ole hyvä', 'he:בבקשה', 'ru:пожалуйста'],
    duplicateTranslations(pack) {
      const seen = {};
      const errs = [];
      pack.items.forEach((it) => {
        const t = String(it.t || '').trim().toLowerCase();
        if (!t) return;
        if (seen[t] && seen[t] !== it.id) {
          if (content.HOMOGRAPHS.indexOf(pack.code + ':' + t) >= 0) return; // genuine homograph
          errs.push(pack.code + ': "' + it.t + '" used for both ' + seen[t] + ' and ' + it.id);
        }
        seen[t] = it.id;
      });
      return errs;
    },
  };

  PG.content = content;
  PG.registerLanguage = registerLanguage; // top-level alias used by language data files
})();

/* ==== core/srs.js ==== */
/* ============================================================
   POLYGLOT AI — spaced exposure scheduler (SM-2-inspired)
   Wall-clock interval ladder from 2 minutes to ~1 month.
   Successful recall advances; failure retreats and shortens.
   The scheduler is deliberately simple and deterministic so it
   can be unit-tested and reasoned about (§11 repetition engine).
   ============================================================ */
(function () {
  'use strict';
  const PG = (globalThis.PG = globalThis.PG || {});
  const U = PG.util;

  const INTERVALS = [
    2 * U.MIN,        // 0: first success → review in 2 min (same session)
    15 * U.MIN,       // 1
    1 * U.HOUR,       // 2
    6 * U.HOUR,       // 3
    1 * U.DAY,        // 4
    2 * U.DAY,        // 5
    4 * U.DAY,        // 6
    8 * U.DAY,        // 7
    16 * U.DAY,       // 8
    32 * U.DAY,       // 9
  ];

  /* quality in [0..5], SM-2 style semantics:
     5 = instant, confident · 4 = correct · 3 = correct but slow/hesitant
     2 = incorrect, recognised after · 1 = incorrect · 0 = complete blank  */
  const srs = {
    INTERVALS,
    newItem() { return { st: 0, reps: 0, lapses: 0, ivl: 0, ease: 2.3, due: 0, last: 0, ok: 0, bad: 0, ctx: [], sup: 0, prod: 0 }; },

    isDue(rec, now) { return rec && rec.st > 0 && rec.due <= (now == null ? U.now() : now); },

    /* Apply a review outcome. Mutates and returns the record. */
    review(rec, quality, now) {
      now = now == null ? U.now() : now;
      if (quality >= 3) {
        rec.reps += 1;
        rec.ok += 1;
        rec.last = now;
        const gain = quality === 5 && rec.ease >= 2.5 ? 2 : 1;
        rec.ivl = Math.min(INTERVALS.length - 1, rec.ivl + gain);
        rec.ease = U.clamp(rec.ease + 0.05, 1.3, 2.8);
      } else {
        rec.bad += 1;
        rec.lapses += 1;
        rec.reps = 0;
        rec.last = now;
        const retreat = rec.ease <= 1.6 ? 4 : 3;
        rec.ivl = Math.max(0, rec.ivl - retreat);
        rec.ease = U.clamp(rec.ease - 0.2, 1.3, 2.8);
      }
      rec.due = now + INTERVALS[rec.ivl];
      return rec;
    },
  };

  PG.srs = srs;
})();

/* ==== core/learner.js ==== */
/* ============================================================
   POLYGLOT AI — learner model (§15)
   Distinguishes exposure from comprehension: items move through
   knowledge states only on repeated evidence in distinct contexts,
   never on a single successful response.
   ============================================================ */
(function () {
  'use strict';
  const PG = (globalThis.PG = globalThis.PG || {});
  const U = PG.util;
  const SRS = PG.srs;

  /* knowledge states */
  const ST = { UNSEEN: 0, SEEN: 1, RECOGNIZED: 2, UNDERSTOOD_CTX: 3, UNDERSTOOD: 4, RETAINED: 5, PRODUCED: 6 };
  const ST_NAMES = ['unseen', 'seen', 'recognized', 'understoodCtx', 'understood', 'retained', 'produced'];

  const DIMS = ['listening', 'reading', 'vocab', 'expressions', 'comprehension', 'retention', 'transfer', 'speaking', 'pronunciation', 'fluency'];

  const HISTORY_CAP = 400;
  const CTX_CAP = 8;

  const learner = {
    ST, ST_NAMES, DIMS,

    newProfile(target, native) {
      return {
        v: 3,
        target: target,
        native: native || 'en',
        name: '',
        avatar: '🙂',
        createdAt: U.now(),
        updatedAt: U.now(),
        /* v3: all learning state is per language — items 'lang:itemId',
           dims/goals/acts keyed by language code — so switching the learning
           language starts that language's own path. name, avatar, xp, streak,
           native and settings stay shared. */
        items: {},          // '<lang>:<itemId>' -> record (srs + knowledge state)
        dims: {},           // '<lang>' -> { dim: {s,n} }
        history: [],        // every entry tagged lg: '<lang>'
        xp: 0,
        streak: 0,
        lastDay: 0,
        acts: {},           // '<lang>' -> lessons/scn/story/storyFlags/listen/read + counters
        goals: {},          // '<lang>' -> { day, insight, lesson, activity }
        notifications: { seenDay: 0 },
        seenTmpl: {},       // '<lang>:<tplId>' -> count
        settings: { rate: 1, voice: null, captions: false, assist: false, romaji: true, dark: false, spokenResp: false, flashcards: false },
      };
    },

    /* ---- per-language state accessors ---- */
    itemKey(code, id) { return code + ':' + id; },
    _langActs(profile, code) {
      const k = code || profile.target;
      let a = profile.acts[k];
      if (!a) {
        a = profile.acts[k] = {
          lessons: {}, scn: {}, story: {}, storyFlags: {}, listen: {}, read: {},
          vocab: 0, numbers: 0, ear: 0, sounds: 0, flash: 0,
        };
      }
      return a;
    },
    /* acts of the profile's current learning language (created on demand) */
    actsFor(profile) { return this._langActs(profile, profile.target); },

    /* ---- daily goals (v1.1): insight · lesson · activity — per language (v3) ---- */
    goalState(profile) {
      const today = U.dayKey(U.now());
      const g = (profile.goals[profile.target] = profile.goals[profile.target] || { day: 0, insight: false, lesson: false, activity: false });
      if (g.day !== today) {
        g.day = today; g.insight = false; g.lesson = false; g.activity = false;
      }
      return g;
    },
    touchGoal(profile, kind) {
      const g = this.goalState(profile);
      if (kind === 'insight' || kind === 'lesson' || kind === 'activity') g[kind] = true;
    },
    goalsDone(profile) {
      const g = this.goalState(profile);
      return (g.insight ? 1 : 0) + (g.lesson ? 1 : 0) + (g.activity ? 1 : 0);
    },

    rec(profile, id) {
      let r = profile.items[id];
      if (!r) { r = SRS.newItem(); profile.items[id] = r; }
      return r;
    },

    /* iterate only the current language's item records ('<lang>:<id>') */
    _langItems(profile, fn) {
      const pre = profile.target + ':';
      for (const k in profile.items) if (k.indexOf(pre) === 0) fn(profile.items[k], k.slice(pre.length));
    },

    knownCount(profile, minState) {
      minState = minState == null ? ST.RECOGNIZED : minState;
      let n = 0;
      this._langItems(profile, (r) => { if (r.st >= minState) n++; });
      return n;
    },

    stateCounts(profile) {
      const counts = [0, 0, 0, 0, 0, 0, 0];
      this._langItems(profile, (r) => { counts[r.st]++; });
      return counts;
    },

    /* ---- dimension scores (EMA over recent evidence) — per language ---- */
    recordDim(profile, dim, ok, weight) {
      if (DIMS.indexOf(dim) < 0) return;
      const langs = (profile.dims[profile.target] = profile.dims[profile.target] || {});
      const d = (langs[dim] = langs[dim] || { s: 0, n: 0 });
      const a = 0.3 * (weight || 1);
      d.s = d.n === 0 ? (ok ? 100 : 0) : d.s * (1 - a) + (ok ? 100 : 0) * a;
      d.n += 1;
    },
    dimScore(profile, dim) {
      const d = (profile.dims[profile.target] || {})[dim];
      if (!d || d.n === 0) return { score: 0, conf: 0, n: 0 };
      return { score: Math.round(d.s), conf: Math.min(1, d.n / 10), n: d.n };
    },

    /* ---- history ---- */
    log(profile, entry) {
      /* tag with the language the evidence belongs to (v3); older entries
         without a tag were migrated with the profile's then-current target */
      if (entry.lg == null) entry.lg = profile.target;
      profile.history.push(Object.assign({ t: U.now() }, entry));
      if (profile.history.length > HISTORY_CAP) profile.history.splice(0, profile.history.length - HISTORY_CAP);
    },

    recentAccuracy(profile, n) {
      const lg = profile.target;
      const checks = profile.history.filter((h) => h.lg === lg && (h.kind === 'recognition' || h.kind === 'review' || h.kind === 'production'));
      const s = U.last(checks, n == null ? 30 : n);
      if (!s.length) return null;
      return s.filter((h) => h.ok).length / s.length;
    },

    /* ---- xp & streak ---- */
    award(profile, xp) { profile.xp += xp; },
    touchStreak(profile) {
      const today = U.dayKey(U.now());
      if (profile.lastDay === today) return;
      const yest = U.dayKey(U.now() - U.DAY);
      profile.streak = profile.lastDay === yest ? profile.streak + 1 : 1;
      profile.lastDay = today;
    },

    /* ---- evidence pipeline (§7 comprehensible input engine) ---- */
    /* ev: { kind:'exposure'|'recognition'|'review'|'production',
            ok, support, modality:'listen'|'read'|'speak'|'interact',
            ctx, quality?, ms?, sim? }  */
    applyEvidence(profile, code, itemId, ev) {
      const r = this.rec(profile, this.itemKey(code, itemId));
      const now = U.now();
      ev = ev || {};

      if (ev.kind === 'exposure') {
        if (r.st === ST.UNSEEN) r.st = ST.SEEN;
        this._addCtx(r, ev.ctx);
        r.last = now;
        this.log(profile, { kind: 'exposure', it: itemId, ctx: ev.ctx, ok: true, lg: code });
        return r;
      }

      const distinctCtx = r.ctx.length;
      let quality;
      if (ev.kind === 'production') {
        quality = ev.sim == null ? 4 : ev.sim >= 0.85 ? 5 : ev.sim >= 0.6 ? 4 : ev.sim >= 0.4 ? 3 : 1;
      } else if (ev.ok) {
        quality = ev.support ? 3 : (ev.ms != null && ev.ms < 3500 ? 5 : 4);
      } else {
        quality = ev.secondTry ? 2 : 1;
      }
      if (ev.quality != null) quality = ev.quality;
      SRS.review(r, quality, now);
      this._addCtx(r, ev.ctx);

      if (ev.kind === 'recognition' || ev.kind === 'review' || ev.kind === 'production') {
        const ok = ev.kind === 'production' ? quality >= 3 : !!ev.ok;
        if (ok) {
          if (ev.kind === 'production') {
            r.prod += 1;
            if (r.st >= ST.RECOGNIZED) r.st = ST.PRODUCED;
          } else if (ev.support) {
            if (r.st < ST.UNDERSTOOD_CTX) r.st = ST.UNDERSTOOD_CTX;
            r.sup += 1;
          } else {
            if (r.st < ST.RECOGNIZED) r.st = ST.RECOGNIZED;
            /* r.ctx already includes the current context at this point */
            if (r.st === ST.RECOGNIZED && r.ctx.length >= 2) r.st = ST.UNDERSTOOD;
            if (ev.kind === 'review' && r.ivl >= 4 && r.ok >= 4 && r.ctx.length >= 3 && r.st < ST.RETAINED) r.st = ST.RETAINED;
          }
          r.fails = 0;
        } else {
          r.fails = (r.fails || 0) + 1;
          /* two consecutive failures at a demonstrated level → demote one
             state: evidence, not optimism (§15). */
          if (r.fails >= 2 && r.st >= ST.UNDERSTOOD) { r.st = r.st - 1; r.fails = 0; }
        }
        this.log(profile, { kind: ev.kind, it: itemId, ctx: ev.ctx, ok, sup: !!ev.support || !!ev.secondTry, lg: code });
      }
      return r;
    },

    _addCtx(r, ctx) {
      if (!ctx) return;
      if (r.ctx.indexOf(ctx) < 0) {
        r.ctx.push(ctx);
        if (r.ctx.length > CTX_CAP) r.ctx.shift();
      }
    },

    /* ---- persistence ---- */
    serialize(profile) {
      profile.updatedAt = U.now();
      return JSON.stringify(profile);
    },
    validateImport(obj) {
      if (!obj || typeof obj !== 'object') return 'not an object';
      if (obj.v !== 1 && obj.v !== 2 && obj.v !== 3) return 'unsupported version';
      if (PG.content.pack(obj.target) == null) return 'unknown target language: ' + obj.target;
      if (!obj.items || typeof obj.items !== 'object') return 'missing items';
      if (!obj.dims || typeof obj.dims !== 'object') return 'missing dims';
      if (!Array.isArray(obj.history)) return 'missing history';
      if (obj.history.length > 2000) return 'history too large';
      /* schema-guard every imported record: no prototype pollution, no odd types.
         v3 keys the srs records per language ('es:water'); v1/v2 used bare ids. */
      for (const k in obj.items) {
        if (!/^([a-z][a-z0-9-]{0,10}:)?[a-z][a-z0-9-]{0,40}$/i.test(k)) return 'bad item id: ' + k;
        const r = obj.items[k];
        if (typeof r !== 'object' || Array.isArray(r)) return 'bad record for ' + k;
        const nums = ['st', 'reps', 'lapses', 'ivl', 'ok', 'bad', 'sup', 'prod', 'ease', 'due', 'last'];
        for (const f of nums) {
          if (r[f] != null && (typeof r[f] !== 'number' || !isFinite(r[f]))) return 'bad ' + f + ' for ' + k;
        }
        if (r.st != null && (r.st < 0 || r.st > 6 || Math.floor(r.st) !== r.st)) return 'bad state for ' + k;
      }
      if (obj.name != null && (typeof obj.name !== 'string' || obj.name.length > 40)) return 'bad name';
      return null;
    },
    deserialize(json) {
      let obj;
      try { obj = JSON.parse(json); } catch (e) { return { error: 'invalid JSON' }; }
      const err = this.validateImport(obj);
      if (err) return { error: err };
      /* migrate v1/v2 → v3 and normalise with defaults so a partial-but-valid
         backup never bricks the app. v3 makes all learning state per language;
         v1/v2 state is attributed to the language the profile was on when it
         was made — the profile's target at import time. */
      const base = this.newProfile(obj.target, obj.native || 'en');
      obj.v = 3;
      if (typeof obj.name !== 'string') obj.name = '';
      obj.name = String(obj.name).slice(0, 40);
      if (typeof obj.avatar !== 'string' || !obj.avatar) obj.avatar = '🙂';
      obj.settings = Object.assign(base.settings, obj.settings || {});
      obj.notifications = Object.assign(base.notifications, obj.notifications || {});
      obj.seenTmpl = obj.seenTmpl || {};
      obj.xp = typeof obj.xp === 'number' ? obj.xp : 0;
      obj.streak = typeof obj.streak === 'number' ? obj.streak : 0;

      /* --- v1/v2 flat learning state → per-language (v3) --- */
      const tgt = obj.target;
      obj.acts = obj.acts || {};
      if (obj.acts.lessons !== undefined || obj.acts.scn !== undefined) {
        obj.acts = { [tgt]: obj.acts };           // flat acts were one language's path
      }
      obj.goals = obj.goals || {};
      if (typeof obj.goals.day === 'number') {
        obj.goals = { [tgt]: obj.goals };         // flat daily goals belonged to that path
      }
      obj.dims = obj.dims || {};
      if (DIMS.some((d) => obj.dims[d] !== undefined)) {
        obj.dims = { [tgt]: obj.dims };           // flat dimension scores were that path's
      }
      /* bare item ids / template ids → '<lang>:<id>' */
      for (const k in obj.items) {
        if (k.indexOf(':') < 0) {
          obj.items[tgt + ':' + k] = obj.items[k];
          delete obj.items[k];
        }
      }
      for (const k in obj.seenTmpl) {
        if (k.indexOf(':') < 0) {
          obj.seenTmpl[tgt + ':' + k] = obj.seenTmpl[k];
          delete obj.seenTmpl[k];
        }
      }
      /* history entries without a language tag were made on the target path */
      obj.history.forEach((h) => { if (h && h.lg == null) h.lg = tgt; });
      return { profile: obj };
    },
  };

  PG.learner = learner;
})();

/* ==== core/progression.js ==== */
/* ============================================================
   POLYGLOT AI — adaptive progression engine (§16)
   Evidence-based decisions: difficulty tier, speech rate,
   new-item budget, support level, next-activity focus.
   Every decision carries a machine-readable reason that the UI
   can show the learner ("why am I seeing this?").
   ============================================================ */
(function () {
  'use strict';
  const PG = (globalThis.PG = globalThis.PG || {});
  const U = PG.util;
  const L = PG.learner;

  /* map a dimension to the activity that trains it best.
     'listen' → ear training, 'read' → reading card, 'sounds' → Sounds module */
  const DIM_ACTIVITY = {
    listening: { activity: 'ear', reasonKey: 'why.listening' },
    reading: { activity: 'reading', reasonKey: 'why.reading' },
    vocab: { activity: 'vocab', reasonKey: 'why.vocab' },
    expressions: { activity: 'scenarios', reasonKey: 'why.expressions' },
    comprehension: { activity: 'stories', reasonKey: 'why.comprehension' },
    retention: { activity: 'review', reasonKey: 'why.retention' },
    transfer: { activity: 'review', reasonKey: 'why.transfer' },
    speaking: { activity: 'speaking', reasonKey: 'why.speaking' },
    pronunciation: { activity: 'sounds', reasonKey: 'why.pronunciation' },
    fluency: { activity: 'speaking', reasonKey: 'why.fluency' },
  };

  const progression = {
    DIM_ACTIVITY,

    /* main entry — compute the current adaptation envelope */
    compute(profile) {
      const acc = L.recentAccuracy(profile, 30);
      /* count genuine check evidence; 'trialItem' entries are per-option
         bookkeeping noise and must not inflate the evidence count */
      const n = profile.history.filter((h) => h.lg === profile.target && h.kind !== 'exposure' && h.kind !== 'trialItem').length;
      const accV = acc == null ? 0.75 : acc; // neutral prior until evidence exists

      /* difficulty tier: 0 = supported, 1 = normal, 2 = challenging */
      let tier = 1;
      const reasons = [];
      if (n < 12) { tier = 0; reasons.push({ key: 'why.newUser' }); }
      else if (acc != null && acc < 0.7) { tier = 0; reasons.push({ key: 'why.accuracyLow', data: { pct: Math.round(acc * 100) } }); }
      else if (acc != null && acc > 0.92 && n >= 30) { tier = 2; reasons.push({ key: 'why.accuracyHigh', data: { pct: Math.round(acc * 100) } }); }

      /* speech rate 0.65..1.0 — slower while accuracy is low (§12) */
      const rate = U.round(U.clamp(0.65 + 0.35 * U.clamp((accV - 0.5) / 0.45, 0, 1), 0.65, 1.0), 2);

      /* new-item budget per activity: 3..8 (§7 new vocabulary density) */
      const newPerAct = Math.round(U.clamp(3 + 5 * U.clamp((accV - 0.55) / 0.4, 0, 1), 3, 8));

      /* support level 0..2: extra visual support / simplified options */
      let support = 1;
      if (tier === 0) support = 2;
      else if (tier === 2) support = 0;

      /* focus: weakest dimension that has enough evidence to trust,
         otherwise the least-evidenced dimension (explore) */
      let focusDim = null;
      let focusScore = null;
      let explore = false;
      L.DIMS.forEach((d) => {
        const ds = L.dimScore(profile, d);
        const weighted = ds.score * (0.4 + 0.6 * ds.conf); // trust evidenced scores
        if (focusScore == null || weighted < focusScore) { focusScore = weighted; focusDim = d; }
      });
      if (L.dimScore(profile, focusDim).n < 3) explore = true;

      const rec = this.recommend(profile, focusDim, tier);

      return {
        tier, rate, newPerAct, support, accRecent: acc, evidenceCount: n,
        focusDim, explore, recommend: rec, reasons,
      };
    },

    recommend(profile, focusDim, tier) {
      const map = DIM_ACTIVITY[focusDim] || DIM_ACTIVITY.vocab;
      let activity = map.activity;
      let args = null;
      const pack = PG.content.pack(profile.target);

      /* retention focus prefers review when items are actually due */
      if (activity === 'review' && this.dueCount(profile) === 0) activity = 'vocab';
      /* speaking is gated on vocabulary (§14: no premature production) */
      if (activity === 'speaking' && L.knownCount(profile, L.ST.RECOGNIZED) < 6) activity = 'vocab';

      /* the recommendation must point at an OPEN activity: walk the
         fallback chain until one is available for this learner+language */
      const chain = [activity, 'vocab', 'ear', 'numbers', 'review', 'lessons'];
      for (const cand of chain) {
        if (cand === 'review' || cand === 'lessons') { activity = cand; break; }
        const def = (PG.activities ? PG.activities.DEFS : []).find((d) => d.id === cand);
        if (def && PG.activities.status(profile, def, pack).open) { activity = cand; break; }
        if (!def && cand === activity) { activity = 'lessons'; break; }
      }

      if (activity === 'scenarios') args = this.nextScenario(profile);
      if (activity === 'stories') args = this.nextChapter(profile);
      if (activity === 'reading') args = this.nextReading(profile);

      return { activity, args, reasonKey: map.reasonKey, focusDim };
    },

    dueCount(profile) {
      const now = U.now();
      const pre = profile.target + ':';
      let n = 0;
      for (const id in profile.items) if (id.indexOf(pre) === 0 && PG.srs.isDue(profile.items[id], now)) n++;
      return n;
    },

    /* unlock gating — progression is earned, not assumed */
    nextScenario(profile) {
      const pack = PG.content.pack(profile.target);
      if (!pack) return null;
      const done = L.actsFor(profile).scn;
      const list = (pack.scenarios || []).map((s) => s.id);
      for (const id of list) if (!done[id]) return id;
      /* all done → recommend the least-replayed for variation practice */
      let best = list[0], bestN = Infinity;
      for (const id of list) { const c = done[id] || 0; if (c < bestN) { bestN = c; best = id; } }
      return best;
    },
    nextChapter(profile) {
      const pack = PG.content.pack(profile.target);
      if (!pack || !pack.story) return null;
      const done = L.actsFor(profile).story;
      for (const ch of pack.story.chapters) if (!done[ch.id]) return ch.id;
      return null;
    },
    nextListening(profile) {
      const pack = PG.content.pack(profile.target);
      if (!pack) return null;
      const done = L.actsFor(profile).listen;
      for (const s of pack.listening || []) if (!done[s.id]) return s.id;
      return null;
    },
    nextReading(profile) {
      const pack = PG.content.pack(profile.target);
      if (!pack) return null;
      const done = L.actsFor(profile).read;
      for (const t of pack.reading || []) if (!done[t.id]) return t.id;
      return null;
    },

    /* can a chapter / set / text be opened at all? (used by screens) */
    unlockState(profile) {
      const pack = PG.content.pack(profile.target);
      const known = L.knownCount(profile, L.ST.RECOGNIZED);
      const out = { chapters: {}, listening: {}, reading: {} };
      if (pack && pack.story) {
        pack.story.chapters.forEach((ch, i) => {
          let ok = known >= 8;
          if (i > 0) ok = ok && !!L.actsFor(profile).story[pack.story.chapters[i - 1].id];
          out.chapters[ch.id] = ok;
        });
      }
      if (pack) {
        (pack.listening || []).forEach((s, i) => {
          out.listening[s.id] = i === 0 ? known >= 6 : !!L.actsFor(profile).listen[pack.listening[i - 1].id];
        });
        (pack.reading || []).forEach((t, i) => {
          out.reading[t.id] = i === 0 ? known >= 10 : !!L.actsFor(profile).read[pack.reading[i - 1].id];
        });
      }
      return out;
    },
  };

  PG.progression = progression;
})();

/* ==== core/input-engine.js ==== */
/* ============================================================
   POLYGLOT AI — comprehensible input engine (§7)
   Selects and composes input according to what the learner has
   actually demonstrated: known items carry meaning, due items are
   naturally re-encountered (spaced exposure inside stories and
   scenarios, not only flashcards), new items arrive in a bounded
   budget, and multiple template variants prevent sentence
   memorisation.
   ============================================================ */
(function () {
  'use strict';
  const PG = (globalThis.PG = globalThis.PG || {});
  const U = PG.util;
  const L = PG.learner;
  /* v3: item records are keyed '<lang>:<itemId>' — one path per language */
  const K = (code, id) => code + ':' + id;

  const input = {
    /* all item records currently due for spaced re-encounter */
    dueItems(profile, code, limit, tag) {
      const pack = PG.content.pack(code);
      if (!pack) return [];
      const now = U.now();
      let due = pack.items.filter((it) => {
        const r = profile.items[K(code, it.id)];
        return r && PG.srs.isDue(r, now) && r.st >= L.ST.SEEN;
      });
      if (tag) due = due.filter((it) => (it.tags || '').split(',').indexOf(tag) >= 0);
      due.sort((a, b) => (profile.items[K(code, a.id)].due - profile.items[K(code, b.id)].due));
      return limit ? due.slice(0, limit) : due;
    },

    /* unknown items, cheapest level first — candidates for teaching */
    newItems(profile, code, n, tag, lv) {
      const pack = PG.content.pack(code);
      if (!pack) return [];
      let pool = pack.items.filter((it) => {
        const r = profile.items[K(code, it.id)];
        return !r || r.st === L.ST.UNSEEN;
      });
      if (tag) pool = pool.filter((it) => (it.tags || '').split(',').indexOf(tag) >= 0);
      if (lv) pool = pool.filter((it) => (it.lv || 1) <= lv);
      pool.sort((a, b) => (a.lv || 1) - (b.lv || 1));
      return U.sample(pool, n);
    },

    /* Build an option set around a correct answer.
       Policy: distractors prefer (1) due items → re-encounter,
       (2) new items (max 2 per check) → discovery,
       (3) known items → consolidation. Semantically close first. */
    options(profile, code, correctId, count, opts) {
      opts = opts || {};
      const pack = PG.content.pack(code);
      if (!pack) return [correctId];
      const correct = PG.content.item(code, correctId);
      if (!correct) return [correctId];
      count = Math.max(2, count || 4);
      const maxNew = opts.maxNew == null ? 1 : opts.maxNew;
      const exclude = new Set(opts.exclude || []);

      const sameTag = (it) => (it.tags || '').split(',').some((t) => (correct.tags || '').split(',').indexOf(t) >= 0);
      const samePos = (it) => it.pos === correct.pos;
      const eligible = (it) => it.id !== correctId && !exclude.has(it.id);

      const buckets = { due: [], fresh: [], known: [] };
      pack.items.forEach((it) => {
        if (!eligible(it)) return;
        const r = profile.items[K(code, it.id)];
        if (r && PG.srs.isDue(r, U.now()) && r.st >= L.ST.SEEN) buckets.due.push(it);
        else if (!r || r.st === L.ST.UNSEEN) buckets.fresh.push(it);
        else buckets.known.push(it);
      });

      const pick = (arr, n) => U.sample(arr, n);
      const sameTagArr = (arr) => arr.filter(sameTag);

      /* distractor policy (§7): semantic coherence first —
         1. same-tag due items → spaced re-encounter in a fitting context
         2. same-tag fresh items → coherent discovery
         3. cross-tag fresh, capped → controlled novelty
         4. same-tag known → consolidation
         5. same word class / any → never leave the grid short */
      const out = [];
      const need = count - 1;
      out.push(...pick(sameTagArr(buckets.due), need));
      if (out.length < need) out.push(...pick(sameTagArr(buckets.fresh).slice(0, 10), need - out.length));
      if (out.length < need) out.push(...pick(buckets.fresh.filter((it) => !sameTag(it)), Math.min(need - out.length, maxNew + 1)));
      if (out.length < need) out.push(...pick(sameTagArr(buckets.known), need - out.length));
      if (out.length < need) out.push(...pick(buckets.known.filter((it) => !sameTag(it) && samePos(it)), need - out.length));
      if (out.length < need) out.push(...pick(pack.items.filter(eligible), need - out.length));

      const ids = [correctId].concat(out.map((i) => i.id));
      return U.shuffle(ids);
    },

    /* Compose a fresh sentence from templates + current policy.
       Returns { text, tmplId, used:[{id, role}] } or null. */
    sentence(profile, code, opts) {
      opts = opts || {};
      const pack = PG.content.pack(code);
      if (!pack) return null;
      const tag = opts.tag;
      const lv = opts.lv || 2;
      /* when forcing a specific item, only templates whose slots can host it */
      const forceTags = opts.forceItem ? ((PG.content.item(code, opts.forceItem) || {}).tags || '').split(',') : null;
      let tpls = (pack.templates || []).filter((t) => {
        const tags = String(t.text).match(/\{(\w+)\}/g) || [];
        const slotTags = tags.map((s) => s.slice(1, -1));
        if (tag) return slotTags.indexOf(tag) >= 0;
        if (forceTags) return slotTags.some((s) => forceTags.indexOf(s) >= 0);
        return true;
      });
      if (!tpls.length) return null;
      /* prefer unseen templates → variation (§7) */
      tpls = tpls.slice().sort((a, b) => {
        const an = profile.seenTmpl[K(code, a.id)] || 0, bn = profile.seenTmpl[K(code, b.id)] || 0;
        if (an !== bn) return an - bn;
        return (a.lv || 1) - (b.lv || 1);
      });
      const tpl = tpls[0];

      const used = [];
      const force = opts.forceItem ? PG.content.item(code, opts.forceItem) : null;
      let forceUsed = false;
      let text = String(tpl.text).replace(/\{(\w+)\}/g, (m, slotTag) => {
        let it = null;
        if (force && !forceUsed && (force.tags || '').split(',').indexOf(slotTag) >= 0) {
          it = force; forceUsed = true;
        } else {
          it = this._pickSlotItem(profile, code, slotTag, opts, used.map((u) => u.id));
        }
        if (!it) return m;
        used.push({ id: it.id, role: slotTag });
        return it.t + (pack.romaji && opts.romaji && it.r ? ' (' + it.r + ')' : '');
      });
      profile.seenTmpl[K(code, tpl.id)] = (profile.seenTmpl[K(code, tpl.id)] || 0) + 1;
      /* per-language contraction rules, e.g. Spanish "a el" → "al" (§18) */
      if (pack.contract) {
        pack.contract.forEach((pair) => { text = text.split(pair[0]).join(pair[1]); });
      }
      return { text, tmplId: tpl.id, used };
    },

    /* slot filler policy: ~20% due, >=1 new when quota allows, rest known */
    _pickSlotItem(profile, code, tag, opts, excludeIds) {
      const pack = PG.content.pack(code);
      const pool = PG.content.itemsByTag(code, tag, { maxLv: opts.lv || 2 })
        .filter((it) => excludeIds.indexOf(it.id) < 0);
      if (!pool.length) return null;
      const known = pool.filter((it) => { const r = profile.items[K(code, it.id)]; return r && r.st >= L.ST.RECOGNIZED; });
      const due = pool.filter((it) => { const r = profile.items[K(code, it.id)]; return r && PG.srs.isDue(r, U.now()); });
      const fresh = pool.filter((it) => { const r = profile.items[K(code, it.id)]; return !r || r.st === L.ST.UNSEEN; });
      const roll = Math.random();
      if (due.length && roll < 0.2) return U.choice(due);
      if (fresh.length && (opts.newQuota == null || opts.newQuota > 0) && roll < 0.35) {
        if (opts.newQuota != null) opts.newQuota--;
        return U.choice(fresh);
      }
      if (known.length) return U.choice(known);
      return U.choice(pool);
    },
  };

  PG.input = input;
})();

/* ==== core/check.js ==== */
/* ============================================================
   POLYGLOT AI — comprehension evaluation (§4, §7, §20)
   Meaning is checked through pictures, situations and target-
   language paraphrase — never through default translation.
   Evidence distinguishes first-try success, supported success
   (retry / captions / assist) and failure, and feeds both the
   learner model and the spaced-exposure scheduler.
   ============================================================ */
(function () {
  'use strict';
  const PG = (globalThis.PG = globalThis.PG || {});
  const U = PG.util;
  const L = PG.learner;

  const check = {
    /* spec: { opts:[{it, sc, t}], ok: index, k:'pic'|'scene'|'sit'|'para'|'num'|'dir'|'yesno',
               ctx, dims:[dim names], say?, newItems?: [ids] }
       response: { idx, attempt (1|2), ms } for choice kinds
                  { order: [indices] } for order tasks
                  { said, targets:[strings] } for say kind
       Returns { correct, retry, solved } and mutates the profile. */
    run(profile, code, spec, response) {
      const dims = spec.dims && spec.dims.length ? spec.dims : ['vocab'];
      const ctx = spec.ctx || 'unknown';
      const attempt = response.attempt || 1;
      const supportUsed = !!response.supportUsed || attempt > 1;

      /* ---- order task: sequence events ---- */
      if (spec.k === 'order') {
        const correct = JSON.stringify(response.order || []) === JSON.stringify(spec.order);
        (spec.cards || []).forEach((c, i) => {
          if (c.it) L.applyEvidence(profile, code, c.it, { kind: 'exposure', ctx, modality: 'read' });
        });
        dims.forEach((d) => L.recordDim(profile, d, correct, spec.weight));
        if (correct) { L.award(profile, 15); L.touchStreak(profile); }
        this._logItems(profile, spec, correct, supportUsed);
        return { correct, solved: correct };
      }

      /* ---- spoken production (§14) ---- */
      if (spec.k === 'say') {
        const targets = response.targets || [];
        let sim = 0;
        targets.forEach((t) => { sim = Math.max(sim, U.similarity(response.said || '', t)); });
        const pass = sim >= 0.8;
        const partial = sim >= 0.55;
        if (spec.item) {
          L.applyEvidence(profile, code, spec.item, {
            kind: 'production', ok: pass, sim, ctx, modality: 'speak',
          });
        }
        dims.forEach((d) => {
          if (d === 'pronunciation') L.recordDim(profile, d, sim >= 0.75);
          else L.recordDim(profile, d, pass);
        });
        if (dims.indexOf('pronunciation') < 0) L.recordDim(profile, 'pronunciation', sim >= 0.75);
        if (pass) { L.award(profile, 25); L.touchStreak(profile); }
        this._logItems(profile, spec, pass, supportUsed);
        return { correct: pass, retry: !pass && partial && attempt === 1, sim, solved: pass || attempt > 1 };
      }

      /* ---- choice kinds: pic / scene / sit / para / num / dir / yesno ---- */
      const chosen = response.idx;
      const correct = chosen === spec.ok;
      const optItems = (spec.opts || []).map((o) => o.it).filter(Boolean);
      /* every option is an exposure — the learner reads/sees them */
      optItems.forEach((id) => L.applyEvidence(profile, code, id, { kind: 'exposure', ctx, modality: spec.modality || 'interact' }));
      (spec.newItems || []).forEach((id) => { /* new teaching candidates were shown */ });

      if (correct) {
        const okItem = (spec.opts[spec.ok] || {}).it || spec.item;
        if (okItem) {
          L.applyEvidence(profile, code, okItem, {
            kind: spec.kind || 'recognition', ok: true, support: supportUsed,
            ms: response.ms, ctx, modality: spec.modality || 'interact',
          });
        }
        dims.forEach((d) => L.recordDim(profile, d, true, spec.weight));
        L.award(profile, supportUsed ? 5 : 10);
        L.touchStreak(profile);
        this._logItems(profile, spec, true, supportUsed);
        return { correct: true, solved: true };
      }

      /* wrong: record the failure honestly, allow one supported retry */
      const badItem = chosen != null && spec.opts[chosen] && spec.opts[chosen].it;
      if (badItem) L.applyEvidence(profile, code, badItem, { kind: 'recognition', ok: false, secondTry: attempt > 1, ctx, modality: spec.modality || 'interact' });
      dims.forEach((d) => L.recordDim(profile, d, false, spec.weight));
      this._logItems(profile, spec, false, supportUsed);
      return { correct: false, retry: attempt === 1, solved: attempt > 1 };
    },

    _logItems(profile, spec, ok, support) {
      const its = (spec.opts || []).map((o) => o && o.it).filter(Boolean);
      its.forEach((id) => PG.learner.log(profile, { kind: 'trialItem', it: id, ok, sup: support, ctx: spec.ctx }));
    },
  };

  PG.check = check;
})();

/* ==== core/sync.js ==== */
/* ============================================================
   POLYGLOT AI — optional account sync (v1.2, Supabase)
   Cross-device progress sync. OPTIONAL by design:
   - not configured → the app never makes a single network request
   - signed out    → the app runs exactly as before (localStorage only)
   - offline       → everything keeps working; changes queue locally
                    and sync next time a sync succeeds
   Storage model: the whole v3 per-language profile as ONE JSON row
   per user in public.profiles, protected by Row Level Security
   (each user can only read/write their own row). The client holds
   ONLY the public anon key — never a service key.
   Merge policy: last-write-wins. Each push stamps client_t = the
   writer's clock; on conflict the later write wins as a whole.
   ============================================================ */
(function () {
  'use strict';
  const PG = (globalThis.PG = globalThis.PG || {});
  const U = PG.util;

  /* ============================================================
     >>> PASTE YOUR SUPABASE PROJECT HERE (the ONLY place needed) <<<
     Supabase Dashboard → Project → Settings → API:
       - "Project URL"      → SUPABASE_URL
       - "anon public" key  → SUPABASE_ANON_KEY
     Run download/supabase-setup.sql in the SQL editor first.
     NEVER paste the "service_role" key here — it bypasses RLS.
     (You can also paste these at runtime in Settings → Sync —
     then they live only in your browser's localStorage.)
     ============================================================ */
  const SUPABASE_URL = '';        // e.g. 'https://abcd1234.supabase.co'
  const SUPABASE_ANON_KEY = '';   // e.g. 'eyJhbGciOi...'

  const K_CFG = 'pg.sync.cfg';
  const K_SESSION = 'pg.sync.session';
  const K_STATE = 'pg.sync.state';
  const MIN_PASSWORD = 6;

  const sync = {
    /* true when the same credentials were configured before */
    _cfg: null, _ses: null, _st: null, _status: 'disabled', _msg: '',
    _listeners: [], _autoT: null,

    /* ---------- configuration (anon key only, ever) ---------- */
    /* acceptable endpoints: https anywhere; plain http only for a local
       dev loopback (never send anything but the anon key over http anyway) */
    _okUrl(url) { return /^https:\/\/.+/.test(url) || /^http:\/\/(localhost|127\.0\.0\.1)(:\d+)?$/i.test(url); },
    configured() {
      const c = this._config();
      return !!(c && c.url && c.anonKey && this._okUrl(c.url));
    },
    _config() {
      if (this._cfg) return this._cfg;
      let c = null;
      try { c = U.store.get(K_CFG); } catch (e) { c = null; }
      if (!c || !c.url || !c.anonKey) c = { url: SUPABASE_URL, anonKey: SUPABASE_ANON_KEY };
      this._cfg = c;
      return c;
    },
    setConfig(url, anonKey) {
      url = String(url || '').trim().replace(/\/+$/, '');
      anonKey = String(anonKey || '').trim();
      if (!this._okUrl(url)) throw new Error('invalid url');
      if (anonKey.length < 20) throw new Error('invalid key');
      this._ses = null; this._st = null;
      U.store.set(K_CFG, { url, anonKey });
      this._cfg = { url, anonKey };
      this._set('signedout');
    },

    /* ---------- status ---------- */
    status() { return this._status; },
    info() {
      const ses = this.session();
      const st = this._state();
      return {
        configured: this.configured(),
        status: this._status,
        message: this._msg,
        email: ses ? (ses.user && ses.user.email) || '' : '',
        lastSync: st.lastSync || 0,
      };
    },
    onChange(cb) { this._listeners.push(cb); },
    _emit() { this._listeners.forEach((cb) => { try { cb(this.info()); } catch (e) {} }); },
    _set(status, msg) { this._status = status; this._msg = msg || ''; this._emit(); },

    /* ---------- session (stored locally, never in the profile) ---------- */
    session() {
      if (this._ses !== null) return this._ses || null;
      let s = null;
      try { s = U.store.get(K_SESSION); } catch (e) { s = null; }
      this._ses = s && s.access_token && s.user ? s : null;
      if (!this.configured()) this._ses = null;
      return this._ses;
    },
    _saveSession(s) {
      this._ses = s || null;
      if (s) U.store.set(K_SESSION, s);
      else U.store.set(K_SESSION, null);
    },
    _state() {
      if (this._st) return this._st;
      let st = null;
      try { st = U.store.get(K_STATE); } catch (e) { st = null; }
      this._st = st && typeof st.lastSync === 'number' ? st : { lastSync: 0 };
      return this._st;
    },
    _saveState() { U.store.set(K_STATE, this._state()); },

    /* a profile with no learning history yet (fresh onboarding):
       used to RESTORE cloud data at sign-in instead of letting the empty
       local profile win last-write-wins and wipe it */
    _isEmptyProfile(p) {
      if (!p) return true;
      if ((p.xp || 0) > 0) return false;
      const a = p.acts || {};
      for (const k in a) {
        const la = a[k] || {};
        if (la.lessons && Object.keys(la.lessons).length) return false;
        if ((la.scn && Object.keys(la.scn).length) || (la.story && Object.keys(la.story).length)) return false;
        if ((la.listen && Object.keys(la.listen).length) || (la.read && Object.keys(la.read).length)) return false;
        if (((la.vocab || 0) + (la.numbers || 0) + (la.ear || 0) + (la.sounds || 0) + (la.flash || 0)) > 0) return false;
      }
      return true;
    },
    _hasRemoteData(remote) {
      if (!remote || !remote.data) return false;
      return !this._isEmptyProfile(remote.data) || Object.keys(remote.data.items || {}).length > 0;
    },

    /* ============================================================
       LAST-WRITE-WINS merge decision — pure, unit-tested.
       local      : the local profile (uses .updatedAt, ms)
       remote     : { data, client_t } | null  (client_t = writer clock, ms)
       lastSync   : ms timestamp of the last successful sync cycle (0 = never)
       opts       : { preferRemoteIfEmpty } — at SIGN-IN, restore a cloud
                    profile onto a device whose local profile is still empty
       returns    : { action: 'push' | 'pull' | 'none', profile, reason }
         push  → local is (or wins as) the newer write: send local
         pull  → remote is the newer write: adopt remote.data wholesale
         none  → already in sync, no network write needed
       Rules:
         - no remote row yet                      → push (first sync)
         - remote unchanged (client_t <= lastSync):
             local changed since lastSync         → push
             local unchanged                      → none
         - remote changed (client_t > lastSync):
             local also changed (updatedAt > lastSync) → conflict →
               later timestamp wins; tie → local (stable, idempotent)
             local unchanged                      → pull
       ============================================================ */
    decideSync(local, remote, lastSync, opts) {
      local = local || {};
      lastSync = lastSync || 0;
      const lu = local.updatedAt || 0;
      if (opts && opts.preferRemoteIfEmpty && this._hasRemoteData(remote) && this._isEmptyProfile(local)) {
        return { action: 'pull', profile: remote.data, reason: 'restore-on-signin' };
      }
      if (!remote) return { action: 'push', profile: local, reason: 'no-remote-row' };
      const rt = remote.client_t || 0;
      if (rt <= lastSync) {
        if (lu > lastSync) return { action: 'push', profile: local, reason: 'local-changed' };
        return { action: 'none', profile: local, reason: 'in-sync' };
      }
      /* remote changed since our last sync */
      if (lu > lastSync) {
        /* both sides changed → last write wins (tie → local) */
        return rt > lu
          ? { action: 'pull', profile: remote.data, reason: 'conflict-remote-newer' }
          : { action: 'push', profile: local, reason: 'conflict-local-newer' };
      }
      return { action: 'pull', profile: remote.data, reason: 'remote-changed' };
    },

    /* ---------- Supabase REST (documented API, no SDK needed) ---------- */
    _fetchGuard() { return typeof globalThis.fetch === 'function'; },

    /* NOTE on network policy: the app's CSP (shell.html) allows fetch
       ONLY to *.supabase.co / *.supabase.com (and localhost for dev).
       With sync unconfigured the client makes no request at all. */
    async _req(path, opts, tryRefresh) {
      if (!this._fetchGuard()) throw new Error('network unavailable');
      const c = this._config();
      const h = Object.assign({ apikey: c.anonKey }, opts.headers || {});
      const ses = this.session();
      if (ses) h.Authorization = 'Bearer ' + ses.access_token;
      if (opts.body) h['Content-Type'] = 'application/json';
      const ctl = typeof AbortController === 'function' ? new AbortController() : null;
      const timer = ctl ? setTimeout(() => { try { ctl.abort(); } catch (e) {} }, 15000) : null;
      let res;
      try {
        res = await fetch(c.url + path, { method: opts.method || 'GET', headers: h, body: opts.body || null, signal: ctl ? ctl.signal : undefined });
      } catch (e) {
        throw new Error('network unreachable');
      } finally {
        if (timer) clearTimeout(timer);
      }
      if (res.status === 401 && ses && tryRefresh !== false) {
        const ok = await this._refresh();
        if (ok) return this._req(path, opts, false);
      }
      if (!res.ok) {
        let msg = 'HTTP ' + res.status;
        try {
          const j = await res.json();
          msg = j.msg || j.message || (j.error && j.error.message) || j.error_description || msg;
        } catch (e) {}
        if (res.status === 400 && /credential/i.test(msg)) throw new Error('bad credentials');
        const e = new Error(msg); e.http = res.status; throw e;
      }
      if (res.status === 204 || res.status === 205) return null;
      return res.json();
    },

    async _refresh() {
      const ses = this.session();
      if (!ses || !ses.refresh_token || !this._fetchGuard()) return false;
      const c = this._config();
      try {
        const res = await fetch(c.url + '/auth/v1/token?grant_type=refresh_token', {
          method: 'POST',
          headers: { apikey: c.anonKey, 'Content-Type': 'application/json' },
          body: JSON.stringify({ refresh_token: ses.refresh_token }),
        });
        if (!res.ok) return false;
        const j = await res.json();
        if (!j || !j.access_token) return false;
        this._saveSession({ access_token: j.access_token, refresh_token: j.refresh_token || ses.refresh_token, expires_at: j.expires_at || 0, user: j.user || ses.user });
        return true;
      } catch (e) { return false; }
    },

    async signUp(email, password) {
      email = String(email || '').trim();
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) throw new Error('invalid email');
      if (!password || password.length < MIN_PASSWORD) throw new Error('weak password');
      const j = await this._req('/auth/v1/signup', { method: 'POST', body: JSON.stringify({ email, password }) });
      if (j && j.access_token) {
        this._saveSession({ access_token: j.access_token, refresh_token: j.refresh_token, expires_at: j.expires_at || 0, user: j.user || { id: null, email } });
        this._set('syncing');
        return { needsConfirmation: false };
      }
      /* email confirmation required by the project's settings */
      this._set('signedout');
      return { needsConfirmation: true };
    },

    async signIn(email, password) {
      email = String(email || '').trim();
      if (!email || !password) throw new Error('bad credentials');
      let j;
      try {
        j = await this._req('/auth/v1/token?grant_type=password', { method: 'POST', body: JSON.stringify({ email, password }) });
      } catch (e) {
        /* GoTrue answers 400 for wrong email/password — surface it cleanly */
        if (e && e.http === 400) throw new Error('bad credentials');
        throw e;
      }
      if (!j || !j.access_token) throw new Error('bad credentials');
      this._saveSession({ access_token: j.access_token, refresh_token: j.refresh_token, expires_at: j.expires_at || 0, user: j.user || { id: null, email } });
      this._set('syncing');
      return {};
    },

    async signOut() {
      try { await this._req('/auth/v1/logout', { method: 'POST', body: '{}' }); } catch (e) { /* session is dropped locally regardless */ }
      this._saveSession(null);
      this._state().lastSync = 0;
      this._saveState();
      this._set('signedout');
    },

    async _getRow() {
      const ses = this.session();
      if (!ses || !ses.user || !ses.user.id) return null;
      const j = await this._req('/rest/v1/profiles?select=user_id,data,client_t&user_id=eq.' + encodeURIComponent(ses.user.id), { method: 'GET' });
      if (!Array.isArray(j) || !j.length || !j[0] || typeof j[0].data !== 'object') return null;
      return { data: j[0].data, client_t: j[0].client_t || 0 };
    },

    async _upsert(profile, clientT) {
      const ses = this.session();
      if (!ses || !ses.user || !ses.user.id) throw new Error('not signed in');
      const row = [{ user_id: ses.user.id, data: profile, client_t: clientT }];
      await this._req('/rest/v1/profiles?on_conflict=user_id', {
        method: 'POST',
        headers: { Prefer: 'resolution=merge-duplicates' },
        body: JSON.stringify(row),
      });
    },

    /* ---------- one full sync cycle ----------
       deps: { getProfile(), adoptProfile(p) } — supplied by the app so
       this module stays DOM-free (and testable headless). */
    async syncNow(deps, opts) {
      if (!this.configured()) { this._set('disabled'); return { ok: false, reason: 'disabled' }; }
      if (!this.session()) { this._set('signedout'); return { ok: false, reason: 'signedout' }; }
      if (!this._fetchGuard()) { this._set('offline'); return { ok: false, reason: 'offline' }; }
      this._set('syncing');
      try {
        const remote = await this._getRow();
        const local = deps.getProfile();
        const st = this._state();
        if (!local) {
          /* no local profile at all (fresh device / local wipe): adopt the
             remote row if one exists — never push a null profile */
          if (remote && remote.data) {
            const res = PG.learner.deserialize(JSON.stringify(remote.data));
            if (!res.profile) throw new Error('remote profile rejected');
            deps.adoptProfile(res.profile);
            st.lastSync = U.now(); this._saveState(); this._set('synced');
            return { ok: true, action: 'pull', reason: 'fresh-device-restore' };
          }
          this._set('synced');
          return { ok: true, action: 'none', reason: 'no-local-profile' };
        }
        const d = this.decideSync(local, remote, st.lastSync, opts);
        if (d.action === 'pull') {
          /* remote wins: adopt wholesale, through the validating
             deserializer (migration + schema guard, never trust a row) */
          const res = PG.learner.deserialize(JSON.stringify(d.profile));
          if (!res.profile) throw new Error('remote profile rejected');
          deps.adoptProfile(res.profile);
        } else if (d.action === 'push') {
          await this._upsert(d.profile, U.now());
        }
        st.lastSync = U.now();
        this._saveState();
        this._set('synced');
        return { ok: true, action: d.action, reason: d.reason };
      } catch (e) {
        const msg = String((e && e.message) || e);
        this._set(/credential|rejected|not signed/.test(msg) ? 'error' : 'offline', msg);
        return { ok: false, error: msg };
      }
    },

    /* debounced auto-sync after local saves (app.save hooks this) */
    autoSync(deps, delayMs) {
      if (!this.configured() || !this.session() || !this._fetchGuard()) return;
      clearTimeout(this._autoT);
      this._autoT = setTimeout(() => { this.syncNow(deps).catch(() => {}); }, delayMs == null ? 4000 : delayMs);
    },

    /* ---------- helpers for tests ---------- */
    _reset() {
      this._cfg = null; this._ses = null; this._st = null; this._autoT = null;
      this._status = 'disabled'; this._msg = '';
      try { U.store.set(K_CFG, null); U.store.set(K_SESSION, null); U.store.set(K_STATE, null); } catch (e) {}
    },
  };

  PG.sync = sync;
})();

/* ==== core/providers.js ==== */
/* ============================================================
   POLYGLOT AI — provider abstraction layer (§19)
   Model-agnostic service interfaces. The browser implements TTS
   via the Web Speech API and ASR via SpeechRecognition. An LLM
   provider is intentionally NOT wired: shipping API keys inside
   a client-side file is prohibited, so all shipped content is
   authored and validated instead (§20). The interfaces exist so
   a backend can be slotted in without touching engine code.
   ============================================================ */
(function () {
  'use strict';
  const PG = (globalThis.PG = globalThis.PG || {});
  const U = PG.util;

  /* ---------------- TTS ---------------- */
  function SpeechTTS() {
    const synth = (typeof globalThis.speechSynthesis !== 'undefined') ? globalThis.speechSynthesis : null;
    let cachedVoices = [];
    const listeners = [];

    function refreshVoices() {
      if (!synth) return;
      cachedVoices = synth.getVoices() || [];
      listeners.forEach((fn) => { try { fn(cachedVoices); } catch (e) { /* noop */ } });
    }
    if (synth) {
      refreshVoices();
      if (typeof synth.addEventListener === 'function') synth.addEventListener('voiceschanged', refreshVoices);
      else if (synth.onvoiceschanged !== undefined) synth.onvoiceschanged = refreshVoices;
      /* Chrome populates voices asynchronously; poll briefly */
      let tries = 0;
      const poll = setInterval(() => {
        refreshVoices();
        if (cachedVoices.length || ++tries > 20) clearInterval(poll);
      }, 250);
    }

    return {
      name: 'web-speech',
      get ready() { return !!synth; },
      onVoices(fn) { listeners.push(fn); fn(cachedVoices); },
      voicesFor(prefixes) {
        return cachedVoices.filter((v) => prefixes.some((p) => (v.lang || '').toLowerCase().indexOf(p) === 0));
      },
      hasVoiceFor(prefixes) { return this.voicesFor(prefixes).length > 0; },
      speak(text, opts) {
        opts = opts || {};
        return new Promise((resolve) => {
          if (!synth || !text) { resolve(false); return; }
          try { synth.cancel(); } catch (e) { /* noop */ }
          const u = new globalThis.SpeechSynthesisUtterance(text);
          u.lang = opts.lang || 'en-US';
          u.rate = U.clamp(opts.rate == null ? 1 : opts.rate, 0.5, 1.4);
          u.pitch = 1;
          if (opts.voice) u.voice = opts.voice;
          let done = false;
          const finish = (ok) => { if (!done) { done = true; resolve(ok); } };
          u.onend = () => finish(true);
          u.onerror = () => finish(false);
          setTimeout(() => finish(false), Math.max(4000, text.length * 220)); // watchdog
          try { synth.speak(u); } catch (e) { finish(false); }
        });
      },
      stop() { try { if (synth) synth.cancel(); } catch (e) { /* noop */ } },
    };
  }

  /* ---------------- ASR ---------------- */
  function WebASR() {
    const SR = globalThis.SpeechRecognition || globalThis.webkitSpeechRecognition;
    return {
      name: 'web-speech-recognition',
      get supported() { return !!SR; },
      /* resolve { transcript } or { error } */
      listenOnce(lang) {
        return new Promise((resolve) => {
          if (!SR) { resolve({ error: 'unsupported' }); return; }
          let rec;
          try { rec = new SR(); } catch (e) { resolve({ error: 'unsupported' }); return; }
          const lang8 = typeof lang === 'string' && /^[a-z]{2,3}(-[A-Za-z0-9]{2,8})?$/.test(lang) ? lang : 'en-US';
          rec.lang = lang8;
          rec.interimResults = false;
          rec.maxAlternatives = 3;
          rec.continuous = false;
          let settled = false;
          const done = (v) => { if (!settled) { settled = true; try { rec.stop(); } catch (e) { /* noop */ } resolve(v); } };
          rec.onresult = (e) => {
            const alts = [];
            for (let i = 0; i < e.results.length; i++) {
              const r = e.results[i];
              if (r.isFinal) for (let j = 0; j < r.length; j++) alts.push(r[j].transcript);
            }
            done({ transcript: alts[0] || '', alternatives: alts });
          };
          rec.onerror = (e) => done({ error: e && e.error ? e.error : 'error' });
          rec.onend = () => done({ error: 'no-speech' });
          try { rec.start(); } catch (e) { done({ error: 'start-failed' }); }
          setTimeout(() => done({ error: 'timeout' }), 8000);
        });
      },
    };
  }

  PG.providers = {
    /* A backend implementation only has to satisfy these interfaces:
       tts: { ready, voicesFor(prefixes), speak(text,{lang,rate,voice}) -> Promise<bool> }
       asr: { supported, listenOnce(lang) -> Promise<{transcript}|{error}> }
       llm: null — reserved for server-side generation behind an
            authenticated backend; never keyed client-side. */
    tts: null,
    asr: null,
    init() {
      this.tts = SpeechTTS();
      this.asr = WebASR();
    },
  };
})();
