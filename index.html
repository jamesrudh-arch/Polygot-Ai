<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; font-src 'none'; connect-src https://*.supabase.co https://*.supabase.com http://localhost:* http://127.0.0.1:*; media-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="description" content="Polyglot AI — immersive language acquisition through comprehensible input, interaction and intelligent repetition.">
<meta name="color-scheme" content="light dark">
<title>Polyglot AI 🦜</title>
<style>
/* ============================================================
   POLYGLOT AI — single-file application styles
   System fonts only, no external requests. Mobile-first.
   ============================================================ */
:root {
  --accent: #4f46e5;
  --accent2: #312e81;
  --bg: #f4f5fb;
  --surface: #ffffff;
  --surface2: #eef0fa;
  --text: #1c1e29;
  --muted: #6b7280;
  --ok: #16a34a;
  --bad: #dc2626;
  --warn: #d97706;
  --radius: 18px;
  --shadow: 0 4px 18px rgba(28, 30, 41, 0.08);
  --font: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', 'Noto Sans', 'Noto Sans SC', 'Noto Sans JP', sans-serif;
}
body.dark {
  --bg: #12141d;
  --surface: #1d2030;
  --surface2: #262a3d;
  --text: #e8eaf2;
  --muted: #9aa1b5;
  --shadow: 0 4px 18px rgba(0, 0, 0, 0.35);
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}
button { font-family: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 8px; }

/* ---------- top bar ---------- */
.topbar {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px;
  background: color-mix(in srgb, var(--surface) 88%, transparent);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid rgba(120, 120, 140, 0.18);
}
.brand { font-size: 22px; }
.top-title { font-weight: 700; font-size: 17px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.top-chips { display: flex; gap: 6px; }
.chip { background: var(--surface2); border-radius: 999px; padding: 4px 10px; font-size: 13px; font-weight: 600; }
.topbtn { border: none; background: var(--surface2); color: var(--text); font-size: 20px; border-radius: 12px; width: 38px; height: 38px; cursor: pointer; }

/* ---------- layout ---------- */
.view { max-width: 760px; margin: 0 auto; padding: 14px 14px 96px; outline: none; }
.pad { display: flex; flex-direction: column; gap: 10px; }

/* ---------- bottom nav ---------- */
.bottomnav {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 20;
  display: flex; justify-content: space-around;
  background: color-mix(in srgb, var(--surface) 92%, transparent);
  backdrop-filter: blur(10px);
  border-top: 1px solid rgba(120, 120, 140, 0.18);
  padding: 6px 4px calc(6px + env(safe-area-inset-bottom));
}
.navbtn {
  border: none; background: none; color: var(--muted);
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 12px; cursor: pointer;
}
.navbtn.active { color: var(--accent); }
.nav-ico { font-size: 22px; }

/* ---------- cards ---------- */
.card {
  display: flex; align-items: center; gap: 12px; width: 100%;
  background: var(--surface); border: 1px solid rgba(120, 120, 140, 0.14);
  border-radius: var(--radius); padding: 14px; text-align: left;
  cursor: pointer; box-shadow: var(--shadow); color: var(--text);
  transition: transform 0.12s ease;
}
.card:active { transform: scale(0.985); }
.card.locked { opacity: 0.55; }
.card-icon { font-size: 30px; }
.card-body { flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.card-title { font-weight: 700; font-size: 16px; }
.card-sub { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card-badge { background: var(--surface2); color: var(--accent); font-weight: 700; font-size: 12px; padding: 4px 10px; border-radius: 999px; white-space: nowrap; }
.card-lock { font-size: 16px; }
.list { gap: 10px; }
.list-sub { color: var(--muted); margin: 4px 2px 8px; font-size: 14px; }

/* ---------- home ---------- */
.rec-card {
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  color: #fff; border-radius: 22px; padding: 20px; margin-bottom: 14px;
  box-shadow: 0 10px 28px rgba(79, 70, 229, 0.35);
}
.rec-head { display: flex; gap: 14px; align-items: center; }
.rec-emoji { font-size: 44px; }
.rec-kicker { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; opacity: 0.85; font-weight: 700; }
.rec-title { font-size: 21px; font-weight: 800; margin: 2px 0; }
.rec-why { font-size: 14px; opacity: 0.95; }
.rec-extra { font-size: 12px; opacity: 0.8; margin-top: 8px; }
.rec-card .btn.xl { background: #fff; color: var(--accent2); margin-top: 14px; width: 100%; }
.stats-row { display: flex; gap: 10px; margin-bottom: 14px; }
.stat { flex: 1; background: var(--surface); border-radius: var(--radius); padding: 12px; text-align: center; box-shadow: var(--shadow); }
.stat-v { font-size: 20px; font-weight: 800; display: block; }
.stat-l { font-size: 12px; color: var(--muted); }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* ---------- buttons ---------- */
.btn {
  border: none; background: var(--accent); color: #fff;
  font-size: 16px; font-weight: 700; padding: 13px 22px;
  border-radius: 14px; cursor: pointer; transition: filter 0.15s;
}
.btn:hover { filter: brightness(1.08); }
.btn:disabled { opacity: 0.5; cursor: default; }
.btn.ghost { background: var(--surface2); color: var(--text); }
.btn.danger { background: var(--bad); }
.btn.xl { font-size: 18px; padding: 15px 26px; width: 100%; }
.onb-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
.onb-actions .btn { flex: 1; min-width: 140px; }

/* ---------- onboarding ---------- */
.onb { display: flex; flex-direction: column; gap: 8px; padding-top: 4vh; }
.onb.center { justify-content: center; min-height: 60vh; text-align: center; align-items: center; }
.onb-hero { text-align: center; margin-bottom: 12px; }
.logo { font-size: 56px; display: block; }
.onb-hero h1 { margin: 8px 0 4px; font-size: 30px; letter-spacing: -0.02em; }
.onb-tag { color: var(--muted); margin: 0; }
.onb-h { font-size: 22px; margin: 12px 0 4px; }
.onb-sub { color: var(--muted); line-height: 1.5; margin: 0 0 8px; }
.onb-note { color: var(--muted); font-size: 13px; text-align: center; }
.lang-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.lang-card {
  background: var(--surface); border: 2px solid transparent; border-radius: var(--radius);
  padding: 14px 8px; display: flex; flex-direction: column; align-items: center; gap: 6px;
  cursor: pointer; color: var(--text); box-shadow: var(--shadow); font-weight: 600;
}
.lang-card:hover { border-color: var(--accent); }
.lang-card.big { grid-column: span 1; padding: 18px 8px; }
.lang-flag { font-size: 32px; }
.lang-name { font-size: 16px; }
.lang-meta { font-size: 12px; color: var(--muted); font-weight: 500; }
.onb-foot { margin-top: 18px; text-align: center; }
.tips { list-style: none; padding: 0; margin: 10px 0; display: flex; flex-direction: column; gap: 10px; }
.tips li { background: var(--surface); border-radius: 14px; padding: 12px 14px; line-height: 1.45; font-size: 15px; }
.script-demo { text-align: center; background: var(--surface); border-radius: var(--radius); padding: 18px; margin: 10px 0; }
.kana { font-size: 40px; font-weight: 700; }
.roma { color: var(--muted); font-size: 16px; }

/* ---------- run screens ---------- */
.run-wrap { display: flex; flex-direction: column; gap: 14px; }
.scene-banner {
  background: linear-gradient(135deg, var(--surface2), var(--surface));
  border-radius: var(--radius); text-align: center; font-size: 44px;
  padding: 20px 10px; letter-spacing: 6px;
}
.scene-banner.sm { font-size: 32px; padding: 12px; }
.run-progress { color: var(--muted); text-align: center; margin: 0; font-weight: 600; }
.dots { display: flex; gap: 5px; justify-content: center; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(130, 130, 150, 0.35); }
.dot.on { background: var(--accent); }
.dot.cur { transform: scale(1.35); }
.char-line { display: flex; gap: 10px; align-items: flex-start; }
.avatar {
  font-size: 34px; width: 54px; height: 54px; flex: 0 0 54px; border-radius: 50%;
  background: var(--surface2); display: flex; align-items: center; justify-content: center;
}
.avatar.narrator { font-size: 24px; }
.bubble {
  background: var(--surface); border-radius: 4px 18px 18px 18px; padding: 12px 14px;
  box-shadow: var(--shadow); flex: 1; font-size: 18px; line-height: 1.5;
}
.say-line { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.say-text { font-size: 18px; font-weight: 600; line-height: 1.5; }
.roma { color: var(--muted); font-weight: 500; font-size: 0.85em; }
.round-btn {
  border: none; background: var(--accent); color: #fff; font-size: 18px;
  width: 44px; height: 44px; border-radius: 50%; cursor: pointer; flex: 0 0 44px;
}
.round-btn.sm { width: 36px; height: 36px; flex-basis: 36px; font-size: 15px; background: var(--surface2); color: var(--text); }

/* options */
.opt-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.opt {
  background: var(--surface); border: 2px solid rgba(120, 120, 140, 0.15); border-radius: var(--radius);
  padding: 14px 10px; display: flex; flex-direction: column; align-items: center; gap: 6px;
  cursor: pointer; color: var(--text); box-shadow: var(--shadow); min-height: 86px; justify-content: center;
}
.opt:hover { border-color: var(--accent); }
.opt-img, .opt-scene { font-size: 38px; line-height: 1.1; }
.opt-t { font-weight: 700; font-size: 15px; text-align: center; }
.opt-sub { color: var(--muted); font-size: 12px; }
.opt-sm .opt-img { font-size: 30px; }
.opt-sm { min-height: 72px; }

/* map */
.map { display: flex; flex-direction: column; gap: 4px; align-items: center; background: var(--surface2); padding: 12px; border-radius: var(--radius); }
.map-row { display: flex; gap: 4px; }
.map-cell { font-size: 26px; width: 42px; height: 42px; display: flex; align-items: center; justify-content: center; background: var(--surface); border-radius: 10px; }

/* listening */
.listen-zone { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 22px 0 6px; }
.big-play {
  border: none; background: var(--accent); color: #fff; font-size: 34px;
  width: 92px; height: 92px; border-radius: 50%; cursor: pointer;
  box-shadow: 0 8px 22px rgba(79, 70, 229, 0.4);
}
.caption { background: var(--surface2); border-radius: 12px; padding: 8px 14px; font-weight: 600; }

/* reading */
.read-line { display: flex; gap: 10px; align-items: flex-start; background: var(--surface); padding: 16px; border-radius: var(--radius); box-shadow: var(--shadow); }
.read-text { font-size: 19px; line-height: 1.7; margin: 0; flex: 1; }
.reading { gap: 12px; }
.advance { display: flex; justify-content: flex-end; }

/* speaking */
.word-hero { text-align: center; font-size: 64px; padding: 8px; }
.mic-zone { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 8px 0; }
.mic-btn {
  border: none; background: var(--bad); color: #fff; font-size: 32px;
  width: 84px; height: 84px; border-radius: 50%; cursor: pointer;
  box-shadow: 0 8px 22px rgba(220, 38, 38, 0.35);
}
.mic-btn.listening { animation: pulse 1s infinite; background: var(--warn); }
.mic-hint { color: var(--muted); font-size: 13px; text-align: center; margin: 0; }
@keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.12); } }

/* choices & checks */
.choice-prompt, .check-prompt { font-size: 17px; font-weight: 700; margin: 4px 2px; }
.story-choice { flex-direction: row; justify-content: flex-start; text-align: left; min-height: 64px; }
.story-choice .opt-scene { font-size: 26px; }
.order-slots { display: flex; flex-direction: column; gap: 8px; }
.order-card { flex-direction: row; justify-content: flex-start; min-height: 60px; }
.order-card.picked { border-color: var(--accent); background: var(--surface2); }
.ord-n { background: var(--accent); color: #fff; border-radius: 50%; width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 14px; flex: 0 0 26px; }

/* summary */
.summary { text-align: center; align-items: center; padding-top: 3vh; }
.sum-emoji { font-size: 58px; }
.sum-stats { display: flex; gap: 12px; justify-content: center; margin: 12px 0; flex-wrap: wrap; }
.sum-h { margin: 14px 0 8px; }
.sum-note { color: var(--muted); margin: 4px 0; }
.word-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 100%; }
.word-card { background: var(--surface); border-radius: 14px; padding: 10px 6px; display: flex; flex-direction: column; align-items: center; gap: 2px; box-shadow: var(--shadow); }
.w-img { font-size: 28px; }
.w-t { font-weight: 700; font-size: 14px; }
.w-sub { color: var(--muted); font-size: 12px; }

/* flash & toast */
.flash {
  position: fixed; top: 72px; left: 50%; transform: translateX(-50%) translateY(-16px);
  background: var(--surface); color: var(--text); border-radius: 999px; padding: 10px 22px;
  font-weight: 800; font-size: 17px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
  display: flex; gap: 8px; align-items: center; opacity: 0; transition: all 0.25s; z-index: 50;
  pointer-events: none; /* never block the next answer */
}
.flash.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.flash.ok { background: var(--ok); color: #fff; }
.flash.no { background: var(--bad); color: #fff; }
.toast {
  position: fixed; bottom: 92px; left: 50%; transform: translateX(-50%) translateY(20px);
  background: #1c1e29; color: #fff; border-radius: 12px; padding: 10px 18px; font-size: 14px;
  opacity: 0; transition: all 0.25s; z-index: 60; max-width: 86vw; text-align: center;
  pointer-events: none;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.banner {
  background: #fff7ed; color: #9a3412; border: 1px solid #fdba74; border-radius: 12px;
  padding: 10px 14px; font-size: 14px; margin-bottom: 10px; line-height: 1.45;
}

/* dashboard */
.dashboard { display: flex; flex-direction: column; gap: 12px; }
.panel { background: var(--surface); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); }
.panel h3 { margin: 0 0 10px; font-size: 16px; }
.panel-note { color: var(--muted); font-size: 13px; line-height: 1.5; }
.radar { width: 100%; max-width: 340px; display: block; margin: 0 auto 8px; }
.radar-ring { fill: none; stroke: rgba(130, 130, 150, 0.25); stroke-width: 1; }
.radar-axis { stroke: rgba(130, 130, 150, 0.25); stroke-width: 1; }
.radar-shape { fill: color-mix(in srgb, var(--accent) 30%, transparent); stroke: var(--accent); stroke-width: 2; }
.radar-label { font-size: 10px; fill: var(--muted); }
.radar-label.radar-weak { opacity: 0.45; }
.dim-legend { display: flex; flex-direction: column; gap: 6px; }
.dim-row { display: flex; align-items: center; gap: 8px; font-size: 13px; }
.dim-row.weak .dim-name { opacity: 0.6; }
.dim-name { width: 34%; }
.dim-bar { flex: 1; height: 8px; background: var(--surface2); border-radius: 99px; overflow: hidden; }
.dim-fill { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.dim-val { width: 44px; text-align: right; font-weight: 700; }
.low { font-size: 10px; color: var(--warn); }
.bar-row { display: flex; align-items: center; gap: 8px; margin: 6px 0; font-size: 13px; }
.bar-label { width: 40%; color: var(--muted); }
.bar-track { flex: 1; height: 12px; background: var(--surface2); border-radius: 99px; overflow: hidden; }
.bar-fill { display: block; height: 100%; border-radius: 99px; background: var(--accent); }
.bar-fill.st1 { background: #94a3b8; } .bar-fill.st2 { background: #60a5fa; }
.bar-fill.st3 { background: #34d399; } .bar-fill.st4 { background: #10b981; }
.bar-fill.st5 { background: #059669; } .bar-fill.st6 { background: #047857; }
.bar-value { width: 30px; text-align: right; font-weight: 700; }
.decision { display: flex; justify-content: space-between; padding: 7px 0; border-bottom: 1px dashed rgba(130, 130, 150, 0.3); font-size: 14px; }
.d-k { color: var(--muted); }
.d-v { font-weight: 700; }
.why-list { margin: 10px 0 0; padding-left: 18px; font-size: 13px; color: var(--muted); line-height: 1.7; }
.history { display: flex; flex-direction: column; gap: 6px; }
.h-row { display: flex; gap: 8px; align-items: center; font-size: 13px; }
.h-what { flex: 1; }
.h-when { color: var(--muted); font-size: 12px; }

/* settings */
.settings { display: flex; flex-direction: column; gap: 12px; }
.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; font-weight: 600; font-size: 14px; }
.field select { padding: 10px; border-radius: 10px; border: 1px solid rgba(120, 120, 140, 0.3); background: var(--surface); color: var(--text); font-size: 15px; }
.field input[type='range'] { accent-color: var(--accent); }
.warn { color: var(--warn); font-weight: 500; }
.toggle-row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid rgba(130, 130, 150, 0.15); cursor: pointer; }
.toggle-row:last-child { border-bottom: none; }
.t-label { flex: 1; display: flex; flex-direction: column; gap: 2px; font-weight: 600; font-size: 15px; }
.t-hint { color: var(--muted); font-size: 12px; font-weight: 500; line-height: 1.4; }
.toggle-row input { position: absolute; opacity: 0; pointer-events: none; }
.t-switch { width: 46px; height: 26px; background: var(--surface2); border-radius: 99px; position: relative; transition: background 0.2s; flex: 0 0 46px; }
.t-switch::after { content: ''; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; background: #fff; border-radius: 50%; transition: left 0.2s; box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3); }
.toggle-row input:checked + .t-switch { background: var(--accent); }
.toggle-row input:checked + .t-switch::after { left: 23px; }

/* ring (card progress) */
.ring { display: block; }
.ring-bg { fill: none; stroke: var(--surface2); stroke-width: 5; }
.ring-fg { fill: none; stroke: var(--accent); stroke-width: 5; stroke-linecap: round; transform: rotate(-90deg); transform-origin: center; }

/* ============ v1.1: status badges ============ */
.badge { display: inline-block; font-size: 10.5px; font-weight: 700; border-radius: 999px; padding: 3px 8px; margin-top: 4px; }
.badge.verified { background: #dcfce7; color: #166534; }
.badge.draft { background: #fef3c7; color: #92400e; }
.badge.planned { background: #e5e7eb; color: #6b7280; }
body.dark .badge.verified { background: #14532d; color: #bbf7d0; }
body.dark .badge.draft { background: #78350f; color: #fde68a; }
body.dark .badge.planned { background: #374151; color: #d1d5db; }
.onb-h3 { font-size: 15px; margin: 18px 0 8px; }
.muted { color: var(--muted); font-weight: 500; }
.lang-card.picked { border-color: var(--accent); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 35%, transparent); }
.planned-grid .lang-card { opacity: 0.55; cursor: default; }

/* ============ v1.1: onboarding profile ============ */
.name-input {
  font-size: 17px; padding: 14px 16px; border-radius: 14px; border: 1.5px solid rgba(120,120,140,0.3);
  background: var(--surface); color: var(--text); width: 100%;
}
.avatar-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin-top: 14px; }
.avatar-btn {
  font-size: 26px; background: var(--surface); border: 2px solid rgba(120,120,140,0.2);
  border-radius: 14px; padding: 8px 0; cursor: pointer;
}
.avatar-btn.picked { border-color: var(--accent); background: var(--surface2); }

/* ============ v1.1: home ============ */
.home-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 12px; }
.home-id { display: flex; gap: 12px; align-items: center; min-width: 0; }
.home-avatar { font-size: 40px; width: 60px; height: 60px; border-radius: 50%; background: var(--surface); display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow); }
.home-hi { font-size: 19px; font-weight: 800; }
.home-lang { font-size: 13px; color: var(--muted); margin-top: 2px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.home-chips { display: flex; gap: 6px; align-items: center; }
.bell { position: relative; border: none; background: var(--surface); font-size: 20px; width: 42px; height: 42px; border-radius: 50%; cursor: pointer; box-shadow: var(--shadow); }
.bell .badge-dot {
  position: absolute; top: -4px; inset-inline-end: -4px; background: var(--bad); color: #fff;
  font-size: 10.5px; font-weight: 800; border-radius: 999px; min-width: 18px; height: 18px;
  display: flex; align-items: center; justify-content: center; padding: 0 4px;
}
.goals-panel .goal { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px dashed rgba(130,130,150,0.25); }
.goals-panel .goal:last-child { border-bottom: none; }
.goal.done .goal-lbl { color: var(--muted); text-decoration: line-through; }
.goal-ico { font-size: 19px; }
.goal-lbl { flex: 1; font-size: 14.5px; font-weight: 600; }
.goal-mark { font-size: 16px; }
.insight-card .insight-text { font-size: 14.5px; line-height: 1.6; color: var(--text); margin: 6px 0 10px; }
.shortcut-row { display: flex; flex-wrap: wrap; gap: 8px; }
.shortcut {
  flex: 1 1 28%; min-width: 88px; display: flex; flex-direction: column; align-items: center; gap: 4px;
  background: var(--surface2); border: none; border-radius: 14px; padding: 10px 6px;
  font-size: 11.5px; font-weight: 700; color: var(--text); cursor: pointer;
}
.shortcut .nav-ico, .shortcut span:first-child { font-size: 22px; }
.shortcut.off { opacity: 0.5; }

/* ============ v1.1: bottom sheet ============ */
.sheet-backdrop {
  position: fixed; inset: 0; background: rgba(10, 12, 20, 0.5); z-index: 100;
  display: flex; align-items: flex-end; justify-content: center;
}
.sheet-backdrop[hidden] { display: none; }
.sheet {
  background: var(--surface); width: 100%; max-width: 560px; border-radius: 22px 22px 0 0;
  padding: 20px 18px calc(20px + env(safe-area-inset-bottom)); max-height: 76vh; overflow-y: auto;
}
.sheet-title { margin: 0 0 10px; font-size: 17px; }
.sheet-h { margin: 14px 0 6px; font-size: 14px; }
.sheet-p { font-size: 13.5px; color: var(--muted); line-height: 1.55; margin: 4px 0; }
.sheet-status { font-size: 13.5px; font-weight: 600; }
.notif-row { display: flex; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px dashed rgba(130,130,150,0.25); font-size: 14px; }
.notif-row:last-child { border-bottom: none; }

.self-fallback { margin-top: 14px; text-align: center; }
.self-fallback .mic-hint { margin: 0 0 10px; }

/* ============ v1.1: lessons ============ */
.level-block { margin-bottom: 18px; }
.level-head { display: flex; gap: 12px; align-items: center; margin-bottom: 10px; }
.level-num {
  font-size: 18px; font-weight: 800; color: #fff; background: var(--accent);
  width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; flex: 0 0 40px;
}
.level-title { flex: 1; min-width: 0; }
.level-title h3 { margin: 0 0 6px; font-size: 16px; }
.level-bar { height: 8px; border-radius: 99px; background: var(--surface2); overflow: hidden; }
.level-bar span { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.level-count { font-size: 11.5px; color: var(--muted); font-weight: 600; }
.lesson-card { padding: 11px 14px; }
.lesson-card .lesson-state { font-size: 18px; flex: 0 0 26px; text-align: center; }
.lesson-card.breakthrough { border-inline-start: 4px solid var(--accent); }
.lesson-card.locked { opacity: 0.6; }

/* ============ v1.1: lesson run ============ */
.expose-card {
  display: flex; flex-direction: column; align-items: center; gap: 8px;
  background: var(--surface); border-radius: 22px; padding: 28px 18px; box-shadow: var(--shadow);
}
.expose-img { font-size: 74px; line-height: 1.1; }
.expose-img.sm { font-size: 40px; }
.expose-word { font-size: 30px; font-weight: 800; text-align: center; }
.scene-tableau { display: flex; gap: 12px; justify-content: center; padding: 8px 0; }
.scene-tile {
  flex: 1; max-width: 130px; background: var(--surface); border: 2px solid rgba(120,120,140,0.2);
  border-radius: 20px; padding: 20px 8px; cursor: pointer; box-shadow: var(--shadow);
}
.scene-tile:hover { border-color: var(--accent); }
.tile-emoji { font-size: 52px; }
.avatar.big { font-size: 44px; width: 74px; height: 74px; flex: 0 0 74px; font-size: 40px; }
.mode-icon { font-size: 24px; margin-top: 2px; }

/* ============ v1.1: flashcards ============ */
.flash-card {
  width: 100%; min-height: 260px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
  background: var(--surface); border: 2px solid rgba(120,120,140,0.2); border-radius: 24px;
  cursor: pointer; box-shadow: var(--shadow); padding: 20px;
}
.flash-card.flipped { border-color: var(--accent); background: var(--surface2); }
.flash-off-panel .flash-off-box {
  display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 18px;
  border: 2px dashed rgba(130,130,150,0.4); border-radius: 18px; font-weight: 800; font-size: 16px; margin: 8px 0;
}
.flash-off-box span, .flash-off-box { font-size: 40px; }
.flash-off-box div { font-size: 16px; font-weight: 800; }

/* ============ v1.1: You tab ============ */
.you-head { display: flex; gap: 14px; align-items: center; }
.you-avatar { font-size: 38px; width: 64px; height: 64px; flex: 0 0 64px; border-radius: 50%; border: none; background: var(--surface2); cursor: pointer; }
.you-id { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.you-name {
  font-size: 18px; font-weight: 800; padding: 8px 12px; border-radius: 12px;
  border: 1.5px solid rgba(120,120,140,0.25); background: transparent; color: var(--text); width: 100%;
}
.lang-line { border: none; background: none; color: var(--muted); font-size: 13.5px; cursor: pointer; padding: 0; text-align: start; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.draft-banner { border-inline-start: 4px solid #d97706; }

/* responsive */
@media (min-width: 640px) {
  .view { padding: 20px 20px 40px; }
  .grid { grid-template-columns: 1fr 1fr 1fr; }
  .opt-grid { grid-template-columns: repeat(4, 1fr); }
  .word-grid { grid-template-columns: repeat(4, 1fr); }
  .lang-grid { grid-template-columns: repeat(6, 1fr); }
  .toast { bottom: 96px; }
}
@media (max-width: 400px) {
  .lang-grid { grid-template-columns: repeat(2, 1fr); }
  .opt-grid { grid-template-columns: repeat(2, 1fr); }
  .avatar-grid { grid-template-columns: repeat(4, 1fr); }
}
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}

/* ---- optional account sync (v1.2) ---- */
.sync-chip { display: inline-block; margin-top: 8px; border: 1px solid transparent; border-radius: 999px;
  padding: 4px 12px; font-size: 13px; font-weight: 600; cursor: pointer; background: var(--surface2); color: var(--text); }
.sync-chip.ok { background: rgba(34, 197, 94, 0.14); color: #15803d; border-color: rgba(34, 197, 94, 0.35); }
.sync-chip.bad { background: rgba(239, 68, 68, 0.12); color: #dc2626; border-color: rgba(239, 68, 68, 0.3); }
.sync-chip.wait { background: rgba(245, 158, 11, 0.14); color: #b45309; border-color: rgba(245, 158, 11, 0.35); }
.sync-chip.static { cursor: default; margin-top: 4px; }
.sync-chip .sync-t { font-weight: 400; opacity: 0.75; margin-left: 2px; }
.field input[type="text"], .field input[type="email"], .field input[type="password"], .field input[type="url"] {
  padding: 10px; border-radius: 10px; border: 1px solid rgba(120, 120, 140, 0.3);
  background: var(--surface); color: var(--text); font-size: 15px; font-weight: 400; }

</style>
