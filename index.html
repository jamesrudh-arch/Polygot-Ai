    C('love', 'love', 'expr', '❤️', 2, 'expr'),
    /* introductions (v1.1) */
    C('name', 'the name', 'n', '📛', 1, 'person'),
    C('myname', 'my name is…', 'expr', '', 1, 'expr'),
    C('whatsyourname', 'what is your name?', 'expr', '', 2, 'expr'),
  ];

  PG.inventory = {
    list: INVENTORY,
    byId: {},
    ids: INVENTORY.map((c) => c.id),
    count: INVENTORY.length,
  };
  INVENTORY.forEach((c) => { PG.inventory.byId[c.id] = c; });
})();

/* ==== content/lessons.js ==== */
/* ============================================================
   POLYGLOT AI — curriculum (v1.1)
   Language-independent lesson definitions referencing concept ids
   from the shared inventory. Titles/themes are interface-locale
   keys (lesson titles live in the learner's interface language;
   lesson CONTENT is always the learning language).
   Lesson ids are stable and referenced by activity gating.
   ============================================================ */
(function () {
  'use strict';
  const PG = (globalThis.PG = globalThis.PG || {});

  const LEVELS = [
    {
      id: 'lvl1', themeKey: 'lvl1.theme',
      lessons: [
        { id: 'l1-1', key: 'l.greetings', concepts: ['hello', 'goodmorning', 'goodnight', 'goodbye', 'thanks', 'please', 'yes', 'no'] },
        { id: 'l1-2', key: 'l.basic', concepts: ['hello', 'thanks', 'welcome', 'excuseme', 'yes', 'no', 'please', 'friend'] },
        { id: 'l1-3', key: 'l.mood', concepts: ['howareyou', 'imwell', 'happy', 'sad', 'tired', 'angry'] },
        { id: 'l1-4', key: 'l.introduce', concepts: ['name', 'myname', 'whatsyourname', 'friend', 'goodbye'] },
        { id: 'l1-5', key: 'l.breakthrough1', breakthrough: true, concepts: ['hello', 'thanks', 'yes', 'no', 'water', 'coffee', 'bread', 'happy'] },
      ],
    },
    {
      id: 'lvl2', themeKey: 'lvl2.theme',
      lessons: [
        { id: 'l2-1', key: 'l.food', concepts: ['water', 'coffee', 'tea', 'milk', 'bread', 'cheese', 'apple', 'fish'] },
        { id: 'l2-2', key: 'l.numbers', concepts: ['one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 'ten'] },
        { id: 'l2-3', key: 'l.money', concepts: ['money', 'card', 'howmuch', 'expensive', 'cheap', 'five'] },
        { id: 'l2-4', key: 'l.places', concepts: ['house', 'shop', 'station', 'park', 'restaurant', 'hotel', 'street', 'school'] },
        { id: 'l2-5', key: 'l.breakthrough2', breakthrough: true, concepts: ['buy', 'pay', 'howmuch', 'one', 'two', 'three', 'apple', 'banana'] },
      ],
    },
    {
      id: 'lvl3', themeKey: 'lvl3.theme',
      lessons: [
        { id: 'l3-1', key: 'l.people', concepts: ['man', 'woman', 'boy', 'girl', 'waiter', 'cat', 'dog', 'bird'] },
        { id: 'l3-2', key: 'l.time', concepts: ['sun', 'moon', 'goodmorning', 'goodnight', 'clock', 'sleep'] },
        { id: 'l3-3', key: 'l.actions', concepts: ['eat', 'drink', 'sleep', 'run', 'read', 'listen', 'speak', 'go'] },
        { id: 'l3-4', key: 'l.describe', concepts: ['big', 'small', 'hot', 'cold', 'new', 'delicious'] },
        { id: 'l3-5', key: 'l.breakthrough3', breakthrough: true, concepts: ['find', 'love', 'want', 'happy', 'cat', 'house'] },
      ],
    },
  ];

  /* flat lesson list in curriculum order */
  const ALL = [];
  LEVELS.forEach((lv, li) => lv.lessons.forEach((l) => { l.levelIdx = li; ALL.push(l); }));

  PG.lessons = {
    LEVELS, ALL,
    byId(id) { return ALL.find((l) => l.id === id) || null; },
    firstIncomplete(profile) {
      const A = PG.learner.actsFor(profile);
      for (const l of ALL) { if (!A.lessons[l.id]) return l; }
      return null; // everything completed
    },
    isUnlocked(profile, lessonId) {
      const idx = ALL.findIndex((l) => l.id === lessonId);
      if (idx <= 0) return true;
      return !!PG.learner.actsFor(profile).lessons[ALL[idx - 1].id];
    },
    levelProgress(profile, levelIdx) {
      const lv = LEVELS[levelIdx];
      const A = PG.learner.actsFor(profile);
      const done = lv.lessons.filter((l) => A.lessons[l.id]).length;
      return { done, total: lv.lessons.length, pct: done / lv.lessons.length };
    },
  };

  /* ------------------------------------------------------------
     Activity definitions: the Activities tab cards.
     lock.lesson → requires that lesson completed (per language).
     lock.needsSounds / needsRich → language-content availability
     (curated sound pairs / authored scenarios-stories-reading),
     shown as an explanation on locked cards, never as a dead end.
     ------------------------------------------------------------ */
  PG.activities = {
    DEFS: [
      { id: 'sounds', icon: '🔊', titleKey: 'act.sounds', subKey: 'act.soundsSub', lock: { lesson: 'l1-2' }, needs: 'sounds', kind: 'sounds' },
      { id: 'vocab', icon: '🖼️', titleKey: 'act.vocab', subKey: 'act.vocabSub', lock: { lesson: 'l1-2' }, kind: 'vocab' },
      { id: 'numbers', icon: '🔢', titleKey: 'act.numbers', subKey: 'act.numbersSub', lock: { lesson: 'l2-2' }, kind: 'numbers' },
      { id: 'ear', icon: '👂', titleKey: 'act.ear', subKey: 'act.earSub', lock: { lesson: 'l1-2' }, kind: 'ear' },
      { id: 'scenarios', icon: '🎭', titleKey: 'act.scenarios', subKey: 'act.scenSub', lock: { lesson: 'l1-5' }, needs: 'rich', kind: 'scenarios' },
      { id: 'stories', icon: '📖', titleKey: 'act.stories', subKey: 'act.storiesSub', lock: { lesson: 'l1-5' }, needs: 'rich', kind: 'story' },
      { id: 'reading', icon: '📕', titleKey: 'act.reading', subKey: 'act.readingSub', lock: { lesson: 'l2-4' }, needs: 'rich', kind: 'reading' },
      { id: 'speaking', icon: '🎤', titleKey: 'act.speaking', subKey: 'act.speakingSub', lock: { lesson: 'l1-4' }, kind: 'speak' },
    ],

    /* status of one activity for the current learner + language */
    status(profile, def, pack) {
      /* subscription flag is OFF by default — nothing is premium */
      if (PG.config.subscriptionEnabled && PG.config.premiumActivities.indexOf(def.id) >= 0) {
        return { open: false, reason: 'subscription' };
      }
      if (def.lock && def.lock.lesson && !PG.learner.actsFor(profile).lessons[def.lock.lesson]) {
        return { open: false, reason: 'lesson', lessonId: def.lock.lesson };
      }
      if (def.needs === 'sounds' && !(pack && pack.sounds && pack.sounds.pairs && pack.sounds.pairs.length)) {
        return { open: false, reason: 'noSounds' };
      }
      if (def.needs === 'rich' && !(pack && pack.scenarios && pack.story && pack.reading)) {
        return { open: false, reason: 'notVerified' };
      }
      return { open: true };
    },
  };
})();

/* ==== engines/scenario.js ==== */
/* ============================================================
   POLYGLOT AI — scenario engine (§9 immersive environments)
   Real-world simulations with characters, consequences and
   adaptive difficulty. Pure state machine: present() returns a
   view descriptor; respond() advances. No DOM in here.
   ============================================================ */
(function () {
  'use strict';
  const PG = (globalThis.PG = globalThis.PG || {});
  const U = PG.util;
  const L = PG.learner;
  const ENG = (PG.eng = PG.eng || {});

  const scenario = {
    start(profile, code, scnId) {
      const pack = PG.content.pack(code);
      const sc = (pack.scenarios || []).find((s) => s.id === scnId) || pack.scenarios[0];
      const prog = PG.progression.compute(profile);
      return {
        kind: 'scn',
        code, sc, stageIdx: 0,
        tier: prog.tier, rate: prog.rate,
        newQuota: prog.newPerAct, newTaught: [], dueHits: 0,
        attempt: 1, wrongTotal: 0, firstTryCorrect: 0, streakCorrect: 0,
        opts: null, done: false, summary: null, said: null, afterPending: null,
        lastOutcome: null,
        npcPos: sc.map ? sc.map.start.slice() : null,
      };
    },

    _stage(st) { return st.sc.stages[st.stageIdx]; },
    _char(st, id) { return (st.sc.chars || []).find((c) => c.id === id) || st.sc.chars[0]; },

    /* adaptive say text for current tier */
    _say(st, stage) {
      const s = stage.say || {};
      const t = Math.min(st.tier, 2);
      return s[String(t)] || s['1'] || s['0'] || '';
    },

    /* build the option set (fixed for curated stages, adaptive for flex) */
    _buildOpts(st, stage) {
      const r = stage.resp;
      if (r.flex) {
        let pool = PG.content.itemsByTag(st.code, r.poolTag, { maxLv: 2 }).filter((it) => it.img);
        if (!pool.length) pool = PG.content.itemsByTag(st.code, r.poolTag, {});
        if (!pool.length) pool = PG.content.pack(st.code).items.filter((it) => it.img && (it.lv || 1) === 1);
        const due = PG.input.dueItems(st.profileRef || { items: {} }, st.code, 3, r.poolTag);
        let correct = null;
        /* prefer a due item (spaced re-encounter), else new (quota), else known */
        const dueInPool = pool.filter((it) => due.some((d) => d.id === it.id));
        if (dueInPool.length) correct = U.choice(dueInPool);
        else if (st.newQuota > 0) {
          const fresh = pool.filter((it) => { const rec = st.profileRef && st.profileRef.items[it.id]; return !rec || rec.st === L.ST.UNSEEN; });
          if (fresh.length) { correct = U.choice(fresh); st.newQuota--; }
        }
        if (!correct) correct = U.choice(pool);
        const ids = PG.input.options(st.profileRef, st.code, correct.id, r.count || 4, {
          maxNew: 1, exclude: st.newTaught.filter((i) => i !== correct.id),
        });
        return ids.map((id) => ({ it: id }));
      }
      const count = st.tier === 0 && r.opts.length > 3 ? 3 : r.opts.length;
      let ids = r.opts.slice();
      if (count < ids.length) {
        ids = ids.slice(0, count - 1).concat(ids[ids.length - 1]);
        if (ids.indexOf(r.ok) < 0) ids[count - 1] = r.ok;
      }
      return U.shuffle(ids).map((id) => ({ it: id }));
    },

    present(st, profile) {
      /* consequence panel takes precedence even over the summary, so the
         farewell consequence of a final free choice is never lost */
      if (st.afterPending) {
        return {
          type: 'after', idx: st.stageIdx, total: st.sc.stages.length,
          scene: st.afterPending.scene, text: st.afterPending.text,
        };
      }
      if (st.done) return { type: 'summary', summary: st.summary, sc: st.sc };
      st.profileRef = profile;
      const stage = this._stage(st);
      if (!st.opts) st.opts = this._buildOpts(st, stage);
      const r = stage.resp;
      const supportNow = st.tier === 0 || st.attempt > 1;
      const view = {
        type: 'stage',
        idx: st.stageIdx, total: st.sc.stages.length,
        setting: st.sc.setting,
        who: this._char(st, stage.who),
        scene: stage.scene || st.sc.icon,
        sayText: this._say(st, stage),
        sayTier: st.tier,
        rate: st.rate * (supportNow ? 0.85 : 1),
        attempt: st.attempt,
        support: supportNow,
        kind: r.k,
        options: st.opts,
        ok: st.opts.findIndex((o) => o.it === r.ok),
        spoken: !!profile.settings.spokenResp && st.tier >= 1 && (r.k === 'pic' || r.k === 'num' || r.k === 'yesno'),
        map: st.sc.map ? this._mapView(st) : null,
        after: null,
      };
      return view;
    },

    _mapView(st) {
      const m = st.sc.map;
      const grid = m.rows.map((row) => row.slice());
      const [r, c] = st.npcPos;
      grid[r][c] = m.npc;
      return { grid, target: m.target, targetIcon: m.rows[m.target[0]][m.target[1]] };
    },

    /* response: {idx} | {said} | {selfRating} | {advance} */
    respond(st, profile, response) {
      if (st.done) return st;
      /* dismiss a consequence panel — the scenario may finish here */
      if (st.afterPending) {
        if (response.advance) {
          st.afterPending = null;
          if (st.stageIdx >= st.sc.stages.length) this._finish(st, profile);
        }
        return st;
      }
      const stage = this._stage(st);
      const r = stage.resp;
      let idx = response.idx;

      /* spoken answer mode: match the utterance against option texts */
      if (response.said != null) {
        let best = -1, bestSim = 0;
        st.opts.forEach((o, i) => {
          const it = PG.content.item(st.code, o.it);
          if (!it) return;
          const sim = Math.max(U.similarity(response.said, it.t), it.r ? U.similarity(response.said, it.r) : 0);
          if (sim > bestSim) { bestSim = sim; best = i; }
        });
        if (bestSim < 0.5) { st.said = response.said; return st; } // unclear → ask again
        idx = best;
      }
      if (idx == null) return st;

      const modality = response.said != null ? 'speak' : 'interact';
      const ctx = 'scn:' + st.sc.id + ':' + st.stageIdx;

      /* ---- free-choice stage: any answer is valid communication; the
         world responds with the consequence (§9 natural consequences) ---- */
      if (r.free) {
        const chosenId = st.opts[idx] ? st.opts[idx].it : r.opts[0];
        const recBefore = profile.items[chosenId]; // state BEFORE this encounter
        st.opts.forEach((o) => L.applyEvidence(profile, st.code, o.it, { kind: 'exposure', ctx, modality }));
        L.applyEvidence(profile, st.code, chosenId, { kind: 'recognition', ok: true, support: true, ctx, modality });
        ['listening', 'vocab'].forEach((d) => L.recordDim(profile, d, true));
        if (modality === 'speak') L.recordDim(profile, 'speaking', true);
        L.award(profile, 10);
        L.touchStreak(profile);
        if ((!recBefore || recBefore.st <= L.ST.SEEN) && st.newTaught.indexOf(chosenId) < 0) st.newTaught.push(chosenId);
        if (st.attempt === 1) { st.firstTryCorrect++; st.streakCorrect++; }
        const chosen = PG.content.item(st.code, chosenId);
        if (stage.after) {
          st.afterPending = {
            scene: stage.after.scene,
            text: String(stage.after.text).split('{choice}').join(chosen ? chosen.t : ''),
          };
        }
        this._teach(st, profile, stage);
        st.lastOutcome = 'ok';
        st.attempt = 1;
        st.opts = null;
        st.stageIdx++;
        if (st.stageIdx >= st.sc.stages.length && !st.afterPending) this._finish(st, profile);
        return st;
      }

      const opts = st.opts.map((o) => ({ it: o.it }));
      const res = PG.check.run(profile, st.code, {
        opts, ok: opts.findIndex((o) => o.it === r.ok), k: 'recognition',
        ctx,
        dims: r.dims || (modality === 'speak' ? ['listening', 'vocab', 'speaking'] : ['listening', 'vocab']),
        modality,
        item: r.ok,
        newItems: [],
      }, { idx, attempt: st.attempt, ms: response.ms });

      /* count due re-encounters for the summary */
      if (res.correct) {
        st.dueHits += (profile.items[r.ok] && profile.items[r.ok].ivl > 0) ? 1 : 0;
      }

      if (!res.correct && res.retry) {
        st.attempt = 2;
        st.wrongTotal++;
        st.streakCorrect = 0;
        st.lastOutcome = 'retry';
        return st; // same stage again, now with support
      }
      if (!res.correct) {
        /* failed twice: reveal + move on (recorded honestly) */
        st.wrongTotal++;
        st.streakCorrect = 0;
        st.revealed = true;
        st.lastOutcome = 'fail';
      } else {
        if (st.attempt === 1) { st.firstTryCorrect++; st.streakCorrect++; st.lastOutcome = 'ok'; }
        else { st.streakCorrect = 0; st.lastOutcome = 'support'; }
      }

      /* teach list: mark new exposures for summary */
      this._teach(st, profile, stage);
      if (r.ok) {
        const rec = profile.items[r.ok];
        if ((!rec || rec.st <= L.ST.SEEN) && st.newTaught.indexOf(r.ok) < 0) st.newTaught.push(r.ok);
      }

      /* in-run difficulty adaptation (§9 adaptive difficulty) */
      if (st.streakCorrect >= 3 && st.tier < 2) { st.tier++; st.streakCorrect = 0; }
      if (st.wrongTotal > 0 && st.wrongTotal % 2 === 0 && st.tier > 0) { st.tier--; }

      /* direction stages move the character on the map */
      if (st.sc.map && r.k === 'dir' && res.correct) {
        const [row, col] = st.npcPos;
        const delta = { right: [0, 1], left: [0, -1], straight: [-1, 0] }[r.ok];
        st.npcPos = [U.clamp(row + delta[0], 0, st.sc.map.rows.length - 1), U.clamp(col + delta[1], 0, st.sc.map.rows[0].length - 1)];
      }

      st.attempt = 1;
      st.opts = null;
      st.stageIdx++;
      if (st.stageIdx >= st.sc.stages.length) this._finish(st, profile);
      return st;
    },

    _teach(st, profile, stage) {
      (stage.teach || []).forEach((id) => {
        const rec = profile.items[id];
        if (!rec || rec.st === L.ST.UNSEEN) {
          L.applyEvidence(profile, st.code, id, { kind: 'exposure', ctx: 'scn:' + st.sc.id, modality: 'interact' });
          if (st.newTaught.indexOf(id) < 0) st.newTaught.push(id);
        }
      });
    },

    _finish(st, profile) {
      st.done = true;
      const total = st.sc.stages.length;
      const acc = total ? st.firstTryCorrect / total : 0;
      PG.learner.actsFor(profile).scn[st.sc.id] = (PG.learner.actsFor(profile).scn[st.sc.id] || 0) + 1;
      L.award(profile, 20);
      PG.learner.touchGoal(profile, 'activity');
      st.summary = {
        newItems: st.newTaught.map((id) => PG.content.item(st.code, id)).filter(Boolean),
        dueReviewed: st.dueHits,
        accuracy: acc, total,
        replay: PG.learner.actsFor(profile).scn[st.sc.id] > 1,
      };
    },
  };

  ENG.scenario = scenario;
})();

/* ==== engines/story.js ==== */
/* ============================================================
   POLYGLOT AI — story engine (§10 story-based acquisition)
   Recurring characters, branching choices, comprehension checks
   woven into the narrative, and cross-chapter continuity via
   learner flags.
   ============================================================ */
(function () {
  'use strict';
  const PG = (globalThis.PG = globalThis.PG || {});
  const U = PG.util;
  const L = PG.learner;
  const ENG = (PG.eng = PG.eng || {});

  const story = {
    /* chapterId optional → first unfinished chapter */
    start(profile, code, chapterId) {
      const pack = PG.content.pack(code);
      const st = pack.story;
      let ch = (st.chapters || []).find((c) => c.id === chapterId);
      if (!ch) ch = (st.chapters || []).find((c) => !(PG.learner.actsFor(profile).story || {})[c.id]) || st.chapters[0];
      return {
        kind: 'story',
        code, story: st, ch,
        panelIdx: 0, checkIdx: 0, choiceDone: {},
        attempt: 1, wrongTotal: 0, firstTry: 0, checksTotal: 0, lastOutcome: null,
        phase: 'panel', done: false, summary: null, opts: null,
      };
    },

    _checksDue(st) {
      const ch = st.ch;
      return (ch.checks || []).filter((c) => c.after === st.panelIdx);
    },
    _choiceDue(st) {
      const ch = st.ch;
      return (ch.choices || []).find((c) => c.at === st.panelIdx && !st.choiceDone[c.at]);
    },
    _panelText(st, p) {
      if (p.alt && (profileFlag(st, p.alt.flag))) return p.alt.text;
      return p.text;
      function profileFlag(st2, f) { return st2.profileRef && PG.learner.actsFor(st2.profileRef).storyFlags && !!PG.learner.actsFor(st2.profileRef).storyFlags[f]; }
    },

    present(st, profile) {
      st.profileRef = profile;
      if (st.done) return { type: 'summary', summary: st.summary, ch: st.ch };
      const ch = st.ch;

      /* pending comprehension check? */
      const check = st.pendingCheck;
      if (check) {
        if (!st.opts) st.opts = check.opts.slice();
        return {
          type: 'check', sayText: check.say || '', scene: check.scene || ch.icon,
          kind: check.k, options: st.opts, ok: check.ok, attempt: st.attempt,
          prompt: check.prompt || '', why: check.why || '',
        };
      }

      /* pending choice? */
      const choice = this._choiceDue(st);
      if (choice) {
        return {
          type: 'choice', scene: choice.scene || ch.icon, prompt: choice.prompt,
          options: choice.opts.map((o, i) => ({ idx: i, t: o.t, icon: o.icon })),
        };
      }

      const panel = ch.panels[st.panelIdx];
      if (!panel) { this._finish(st, profile); return { type: 'summary', summary: st.summary, ch }; }
      const who = panel.who === 'n' ? null : (panel.who === 'h' ? st.story.hero : (ch.chars || []).find((c) => c.id === panel.who) || st.story.hero);
      return {
        type: 'panel',
        idx: st.panelIdx, total: ch.panels.length,
        who, hero: st.story.hero,
        scene: panel.scene || ch.icon,
        text: this._panelText(st, panel),
        last: st.panelIdx === ch.panels.length - 1,
      };
    },

    /* UI signals: {advance} for panels, {optIdx} for choices,
       {idx} for checks */
    respond(st, profile, response) {
      if (st.done) return st;
      const ch = st.ch;

      if (st.pendingCheck) {
        const check = st.pendingCheck;
        const res = PG.check.run(profile, st.code, {
          opts: check.opts, ok: check.ok, k: check.k,
          ctx: 'story:' + ch.id + ':' + st.panelIdx,
          dims: check.dims || ['comprehension', 'vocab'],
          modality: 'listen',
          say: check.say,
        }, { idx: response.idx, attempt: st.attempt, ms: response.ms });
        if (!res.correct && res.retry) { st.attempt = 2; st.wrongTotal++; st.lastOutcome = 'retry'; return st; }
        /* count each check once, after any retry */
        st.checksTotal++;
        if (res.correct && st.attempt === 1) { st.firstTry++; st.lastOutcome = 'ok'; }
        else if (res.correct) { st.lastOutcome = 'support'; }
        else { st.wrongTotal++; st.lastOutcome = 'fail'; }
        st.attempt = 1;
        st.pendingCheck = null;
        st.opts = null;
        return st;
      }

      if (response.optIdx != null) {
        const choice = this._choiceDue(st);
        if (choice) {
          const opt = choice.opts[response.optIdx];
          if (opt.flag) PG.learner.actsFor(profile).storyFlags[opt.flag] = true;
          st.choiceDone[choice.at] = true;
          /* exposure to any items named in the option */
          (opt.items || []).forEach((id) => L.applyEvidence(profile, st.code, id, { kind: 'exposure', ctx: 'story:' + ch.id, modality: 'read' }));
          if (opt.goto != null) st.panelIdx = opt.goto;
        }
        return st;
      }

      /* advance a panel; arm checks that follow it */
      st.panelIdx++;
      const due = this._checksDue(st);
      if (due.length) { st.pendingCheck = due[0]; }
      if (st.panelIdx >= ch.panels.length) this._finish(st, profile);
      return st;
    },

    _finish(st, profile) {
      st.done = true;
      PG.learner.actsFor(profile).story[st.ch.id] = 'done';
      const acc = st.checksTotal ? st.firstTry / st.checksTotal : 1;
      L.award(profile, 30);
      PG.learner.touchGoal(profile, 'activity');
      st.summary = { accuracy: acc, checks: st.checksTotal, flags: Object.keys(PG.learner.actsFor(profile).storyFlags || {}).length };
    },
  };

  ENG.story = story;
})();

/* ==== engines/listening.js ==== */
/* ============================================================
   POLYGLOT AI — listening engine (§12)
   Audio-first comprehension: the learner hears the language and
   demonstrates understanding through pictures, scenes or
   target-language options. Target-language captions exist but are
   OFF by default; using them marks evidence as "supported".
   ============================================================ */
(function () {
  'use strict';
  const PG = (globalThis.PG = globalThis.PG || {});
  const U = PG.util;
  const L = PG.learner;
  const ENG = (PG.eng = PG.eng || {});

  const listening = {
    start(profile, code, setId) {
      const pack = PG.content.pack(code);
      const set = (pack.listening || []).find((s) => s.id === setId) || pack.listening[0];
      const prog = PG.progression.compute(profile);
      return {
        kind: 'listen', code, set,
        trialIdx: 0, attempt: 1, replays: 0,
        rate: prog.rate, // app.say applies the user's speed setting exactly once
        captions: !!profile.settings.captions,
        firstTry: 0, wrongTotal: 0, done: false, summary: null,
      };
    },

    present(st, profile) {
      if (st.done) return { type: 'summary', summary: st.summary, set: st.set };
      const t = st.set.trials[st.trialIdx];
      return {
        type: 'trial',
        idx: st.trialIdx, total: st.set.trials.length,
        sayText: t.say, kind: t.k, options: t.opts, ok: t.ok,
        attempt: st.attempt, replays: st.replays,
        showText: st.captions || st.attempt > 1, // support only
        rate: st.rate, wordSet: st.set.kind === 'word',
        scene: st.set.icon,
      };
    },

    respond(st, profile, response) {
      if (st.done) return st;
      const t = st.set.trials[st.trialIdx];
      if (response.replay) { st.replays++; return st; }

      const support = st.captions || st.replays > 0;
      const res = PG.check.run(profile, st.code, {
        opts: t.opts, ok: t.ok, k: t.k,
        ctx: 'listen:' + st.set.id + ':' + st.trialIdx,
        dims: st.set.kind === 'word' ? ['listening', 'vocab'] : ['listening', 'comprehension'],
        modality: 'listen',
      }, { idx: response.idx, attempt: st.attempt, ms: response.ms, supportUsed: support });

      if (!res.correct && res.retry) { st.attempt = 2; st.wrongTotal++; st.lastOutcome = 'retry'; return st; }
      if (res.correct && st.attempt === 1) { st.firstTry++; st.lastOutcome = 'ok'; }
      else if (res.correct) { st.lastOutcome = 'support'; }
      else { st.wrongTotal++; st.lastOutcome = 'fail'; }
      st.attempt = 1; st.replays = 0;
      st.trialIdx++;
      if (st.trialIdx >= st.set.trials.length) this._finish(st, profile);
      return st;
    },

    _finish(st, profile) {
      st.done = true;
      const acc = st.firstTry / st.set.trials.length;
      PG.learner.actsFor(profile).listen[st.set.id] = Math.max(acc, PG.learner.actsFor(profile).listen[st.set.id] || 0);
      L.award(profile, 20);
      PG.learner.touchGoal(profile, 'activity');
      st.summary = { accuracy: acc, total: st.set.trials.length };
    },
  };

  ENG.listening = listening;
})();

/* ==== engines/reading.js ==== */
/* ============================================================
   POLYGLOT AI — reading engine (§13)
   Graded texts with tap-to-hear sentences, then comprehension
   through meaningful interaction: sequencing events, picture
   matching and target-language paraphrase — not translation.
   ============================================================ */
(function () {
  'use strict';
  const PG = (globalThis.PG = globalThis.PG || {});
  const U = PG.util;
  const L = PG.learner;
  const ENG = (PG.eng = PG.eng || {});

  const reading = {
    start(profile, code, textId) {
      const pack = PG.content.pack(code);
      const tx = (pack.reading || []).find((t) => t.id === textId) || pack.reading[0];
      return {
        kind: 'read', code, tx,
        phase: 'lines', lineIdx: 0, taskIdx: 0,
        attempt: 1, wrongTotal: 0, firstTry: 0, done: false, summary: null,
        orderPicked: [],
      };
    },

    present(st, profile) {
      if (st.done) return { type: 'summary', summary: st.summary, tx: st.tx };
      if (st.phase === 'lines') {
        const line = st.tx.lines[st.lineIdx];
        return {
          type: 'line', idx: st.lineIdx, total: st.tx.lines.length,
          text: line.t, scene: line.sc || st.tx.icon, title: st.tx.title, icon: st.tx.icon,
          last: st.lineIdx === st.tx.lines.length - 1,
        };
      }
      const task = st.tx.tasks[st.taskIdx];
      const base = {
        type: 'task', idx: st.taskIdx, total: st.tx.tasks.length,
        attempt: st.attempt, scene: st.tx.icon, title: st.tx.title,
      };
      if (task.k === 'order') {
        return Object.assign(base, {
          kind: 'order', prompt: task.prompt,
          cards: st.shuffledCards || (st.shuffledCards = U.shuffle(task.cards.map((c, i) => ({ i, t: c.t, sc: c.sc, it: c.it })))),
          picked: st.orderPicked,
        });
      }
      return Object.assign(base, {
        kind: task.k, prompt: task.prompt, say: task.say || '',
        options: task.opts, ok: task.ok,
      });
    },

    respond(st, profile, response) {
      if (st.done) return st;
      if (st.phase === 'lines') {
        st.lineIdx++;
        /* every read line is exposure for the items it names */
        const line = st.tx.lines[st.lineIdx - 1];
        (line && line.items || []).forEach((id) => L.applyEvidence(profile, st.code, id, { kind: 'exposure', ctx: 'read:' + st.tx.id, modality: 'read' }));
        if (st.lineIdx >= st.tx.lines.length) { st.phase = 'tasks'; st.taskIdx = 0; }
        return st;
      }

      const task = st.tx.tasks[st.taskIdx];
      if (task.k === 'order') {
        if (response.pick != null) {
          if (st.orderPicked.indexOf(response.pick) < 0) st.orderPicked.push(response.pick);
          return st;
        }
        if (response.unpick) {
          st.orderPicked = st.orderPicked.filter((i) => i !== response.unpick);
          return st;
        }
        if (response.submit) {
          const res = PG.check.run(profile, st.code, {
            k: 'order', order: task.order, cards: task.cards,
            ctx: 'read:' + st.tx.id, dims: ['reading', 'comprehension'],
          }, { order: st.orderPicked });
          if (!res.correct) st.wrongTotal++; else st.firstTry++;
          st.orderPicked = []; st.shuffledCards = null;
          st.taskIdx++;
          if (st.taskIdx >= st.tx.tasks.length) this._finish(st, profile);
        }
        return st;
      }

      const res = PG.check.run(profile, st.code, {
        opts: task.opts, ok: task.ok, k: task.k, say: task.say,
        ctx: 'read:' + st.tx.id, dims: ['reading'], modality: 'read',
      }, { idx: response.idx, attempt: st.attempt, ms: response.ms });
      if (!res.correct && res.retry) { st.attempt = 2; st.wrongTotal++; st.lastOutcome = 'retry'; return st; }
      if (res.correct && st.attempt === 1) { st.firstTry++; st.lastOutcome = 'ok'; }
      else if (res.correct) { st.lastOutcome = 'support'; }
      else { st.wrongTotal++; st.lastOutcome = 'fail'; }
      st.attempt = 1;
      st.taskIdx++;
      if (st.taskIdx >= st.tx.tasks.length) this._finish(st, profile);
      return st;
    },

    _finish(st, profile) {
      st.done = true;
      const acc = st.tx.tasks.length ? st.firstTry / st.tx.tasks.length : 1;
      PG.learner.actsFor(profile).read[st.tx.id] = 'done';
      L.award(profile, 25);
      PG.learner.touchGoal(profile, 'activity');
      st.summary = { accuracy: acc, total: st.tx.tasks.length };
    },
  };

  ENG.reading = reading;
})();

/* ==== engines/speaking.js ==== */
/* ============================================================
   POLYGLOT AI — speaking engine (§14 natural speaking)
   Progressive production: only items the learner has actually
   encountered become speaking trials. ASR when the browser
   provides it; an honest self-assessment fallback otherwise
   (flagged as lower-confidence evidence). No audio is ever
   stored — recognition is live and discarded.
   ============================================================ */
(function () {
  'use strict';
  const PG = (globalThis.PG = globalThis.PG || {});
  const U = PG.util;
  const L = PG.learner;
  const ENG = (PG.eng = PG.eng || {});

  const speaking = {
    /* asrAvailable: boolean passed by the screen layer */
    start(profile, code, asrAvailable) {
      const pack = PG.content.pack(code);
      const now = U.now();

      const known = pack.items.filter((it) => {
        const r = profile.items[it.id];
        return r && r.st >= L.ST.RECOGNIZED;
      });
      const due = known.filter((it) => PG.srs.isDue(profile.items[it.id], now));
      const produced = known.filter((it) => profile.items[it.id].prod > 0);
      const neverProduced = known.filter((it) => profile.items[it.id].prod === 0);

      /* priority: due items first, then never-produced known items */
      let picks = U.uniq(due.concat(neverProduced, produced)).filter((it) => it.t.length <= 24);
      let intro = false;
      if (picks.length < 4) {
        /* not enough encountered language: listen-and-repeat intro
           (exposure + production in one trial) */
        intro = true;
        picks = pack.items.filter((it) => (it.lv || 1) === 1 && (it.pos === 'n' || it.pos === 'expr') && it.img).slice(0, 6);
      }
      picks = picks.slice(0, 6);

      return {
        kind: 'speak', code, asr: !!asrAvailable, intro,
        trials: picks.map((it) => ({ item: it, done: false })),
        trialIdx: 0, attempt: 1,
        results: [], done: picks.length === 0, summary: picks.length ? null : { ok: 0, total: 0, items: [], selfMode: !asrAvailable },
      };
    },

    present(st, profile) {
      if (st.done) return { type: 'summary', summary: st.summary };
      const tr = st.trials[st.trialIdx];
      const it = tr.item;
      return {
        type: 'trial', idx: st.trialIdx, total: st.trials.length,
        item: { id: it.id, t: it.t, r: it.r || null, img: it.img || null, pos: it.pos },
        asr: st.asr, intro: st.intro, attempt: st.attempt,
        romaji: !!(profile.settings.romaji && it.r),
      };
    },

    /* response: {said, targets} | {self: 'easy'|'ok'|'hard'} | {replay} */
    respond(st, profile, response) {
      if (st.done) return st;
      const tr = st.trials[st.trialIdx];
      if (response.replay) return st;

      if (response.said != null) {
        const it = tr.item;
        const targets = [it.t].concat(it.r ? [it.r] : []);
        const res = PG.check.run(profile, st.code, {
          k: 'say', item: it.id, opts: [], ok: 0,
          ctx: 'speak:' + it.id,
          dims: ['speaking', 'pronunciation'],
        }, { said: response.said, targets, attempt: st.attempt });
        if (!res.correct && res.retry) { st.attempt = 2; return st; }
        st.results.push({ id: it.id, ok: res.correct, sim: res.sim });
        tr.done = true;
      } else if (response.self) {
        /* fallback path: self-assessed production (lower confidence) */
        const ok = response.self !== 'hard';
        L.applyEvidence(profile, st.code, tr.item.id, {
          kind: 'production', ok, sim: response.self === 'easy' ? 0.9 : 0.55,
          ctx: 'speak:' + tr.item.id, modality: 'speak',
        });
        L.recordDim(profile, 'speaking', ok, 0.5);
        L.recordDim(profile, 'fluency', ok, 0.5);
        if (ok) L.award(profile, 10);
        st.results.push({ id: tr.item.id, ok, self: true });
        tr.done = true;
      } else {
        return st;
      }

      st.attempt = 1;
      st.trialIdx++;
      if (st.trialIdx >= st.trials.length) this._finish(st, profile);
      return st;
    },

    _finish(st, profile) {
      st.done = true;
      const ok = st.results.filter((r) => r.ok).length;
      L.award(profile, 15);
      PG.learner.touchGoal(profile, 'activity');
      st.summary = {
        ok, total: st.results.length,
        items: st.results.map((r) => ({ it: PG.content.item(st.code, r.id), ok: r.ok })),
        selfMode: !st.asr,
      };
    },
  };

  ENG.speaking = speaking;
})();

/* ==== engines/review.js ==== */
/* ============================================================
   POLYGLOT AI — contextual repetition engine (§11)
   Review happens in NEW sentence contexts (not isolated cards):
   due items are embedded in fresh template sentences, picture
   checks, or spoken reproduction. Due items are ALSO injected
   into scenarios/stories/listening by the input engine — this
   mode is the explicit, learner-visible part of repetition.
   ============================================================ */
(function () {
  'use strict';
  const PG = (globalThis.PG = globalThis.PG || {});
  const U = PG.util;
  const L = PG.learner;
  const ENG = (PG.eng = PG.eng || {});

  const review = {
    start(profile, code) {
      const pack = PG.content.pack(code);
      const now = U.now();

      /* 1) genuinely due items; 2) consolidable items (seen but shaky);
         3) brand-new learners → seed with level-1 core vocabulary */
      let picks = pack.items.filter((it) => {
        const r = profile.items[it.id];
        return r && PG.srs.isDue(r, now) && r.st >= L.ST.SEEN;
      });
      let mode = 'due';
      if (picks.length < 4) {
        const shaky = pack.items.filter((it) => {
          const r = profile.items[it.id];
          return r && (r.st === L.ST.RECOGNIZED || r.st === L.ST.UNDERSTOOD_CTX);
        });
        picks = picks.concat(shaky).slice(0, 8);
        mode = 'consolidate';
      }
      if (picks.length < 4) {
        picks = pack.items.filter((it) => (it.lv || 1) === 1 && it.img);
        mode = 'seed';
      }
      picks = U.uniq(picks).slice(0, 8);

      /* build trials: prefer sentence context ≥ picture ≥ say */
      const trials = picks.map((it) => {
        const sen = PG.input.sentence(profile, code, { forceItem: it.id, lv: 2, newQuota: 1 });
        if (sen && sen.used.some((u) => u.id === it.id)) {
          return { item: it, kind: 'sentence', text: sen.text };
        }
        if (it.img) return { item: it, kind: 'pic' };
        return { item: it, kind: 'say' };
      });

      return {
        kind: 'review', code, mode, trials,
        trialIdx: 0, attempt: 1, firstTry: 0, wrongTotal: 0,
        done: trials.length === 0, summary: null, opts: null,
      };
    },

    present(st, profile) {
      if (st.done) return { type: 'summary', summary: st.summary, mode: st.mode };
      const tr = st.trials[st.trialIdx];
      const view = {
        type: 'trial', idx: st.trialIdx, total: st.trials.length,
        kind: tr.kind, item: { id: tr.item.id, t: tr.item.t, r: tr.item.r || null, img: tr.item.img || null },
        attempt: st.attempt, rate: 0.9,
        romaji: !!(profile.settings.romaji && tr.item.r),
      };
      if (tr.kind === 'sentence') view.text = tr.text;
      /* option sets are built here (not only in respond) so the trial is
         answerable as soon as it is presented */
      if (tr.kind === 'sentence' || tr.kind === 'pic') {
        if (!st.opts) {
          const ids = PG.input.options(profile, st.code, tr.item.id, 4, { maxNew: 0 });
          st.opts = ids.map((id) => ({ it: id }));
        }
        view.options = st.opts;
        view.ok = st.opts.findIndex((o) => o.it === tr.item.id);
      }
      return view;
    },

    respond(st, profile, response) {
      if (st.done) return st;
      const tr = st.trials[st.trialIdx];

      if (tr.kind === 'sentence') {
        /* demonstrate meaning of the featured item inside the sentence */
        if (!st.opts) {
          const ids = PG.input.options(profile, st.code, tr.item.id, 4, { maxNew: 0 });
          st.opts = ids.map((id) => ({ it: id }));
        }
        const res = PG.check.run(profile, st.code, {
          opts: st.opts, ok: st.opts.findIndex((o) => o.it === tr.item.id), k: 'recognition',
          ctx: 'review:' + tr.item.id,
          dims: ['retention', 'transfer'],
        }, { idx: response.idx, attempt: st.attempt, ms: response.ms });
        if (!res.correct && res.retry) { st.attempt = 2; st.wrongTotal++; return st; }
        if (res.correct && st.attempt === 1) st.firstTry++;
        if (!res.correct) st.wrongTotal++;
        st.attempt = 1; st.opts = null;
        st.trialIdx++;
        if (st.trialIdx >= st.trials.length) this._finish(st, profile);
        return st;
      }

      if (tr.kind === 'pic') {
        const res = PG.check.run(profile, st.code, {
          opts: st.opts, ok: st.opts.findIndex((o) => o.it === tr.item.id), k: 'recognition',
          ctx: 'review:' + tr.item.id, dims: ['retention', 'vocab'],
        }, { idx: response.idx, attempt: st.attempt, ms: response.ms });
        if (!res.correct && res.retry) { st.attempt = 2; st.wrongTotal++; return st; }
        if (res.correct && st.attempt === 1) st.firstTry++;
        if (!res.correct) st.wrongTotal++;
        st.attempt = 1; st.opts = null;
        st.trialIdx++;
        if (st.trialIdx >= st.trials.length) this._finish(st, profile);
        return st;
      }

      /* say trial — spoken if a transcript arrived, honest self-assessment
         otherwise (never a dead end when the microphone is unavailable) */
      if (response.self) {
        const ok = response.self !== 'hard';
        L.applyEvidence(profile, st.code, tr.item.id, {
          kind: 'production', ok, sim: response.self === 'easy' ? 0.9 : 0.55,
          ctx: 'review:' + tr.item.id, modality: 'speak',
        });
        L.recordDim(profile, 'retention', ok);
        L.recordDim(profile, 'speaking', ok);
        if (ok && st.attempt === 1) st.firstTry++;
        st.attempt = 1;
        st.trialIdx++;
        if (st.trialIdx >= st.trials.length) this._finish(st, profile);
        return st;
      }
      const targets = [tr.item.t].concat(tr.item.r ? [tr.item.r] : []);
      const res = PG.check.run(profile, st.code, {
        k: 'say', item: tr.item.id, opts: [], ok: 0,
        ctx: 'review:' + tr.item.id, dims: ['retention', 'speaking'],
      }, { said: response.said || '', targets, attempt: st.attempt });
      if (!res.correct && res.retry) { st.attempt = 2; return st; }
      if (res.correct && st.attempt === 1) st.firstTry++;
      else if (!res.correct) st.wrongTotal++;
      st.attempt = 1;
      st.trialIdx++;
      if (st.trialIdx >= st.trials.length) this._finish(st, profile);
      return st;
    },

    _finish(st, profile) {
      st.done = true;
      const total = st.trials.length;
      L.award(profile, 15);
      PG.learner.touchGoal(profile, 'activity');
      st.summary = {
        accuracy: total ? st.firstTry / total : 0, total,
        items: st.trials.map((t) => t.item),
      };
    },
  };

  ENG.review = review;
})();

/* ==== engines/lesson.js ==== */
/* ============================================================
   POLYGLOT AI — lesson engine (v1.1)
   Runs the shared, language-independent curriculum in the LEARNING
   language: exposure cards, picture checks, scene tableaus, one
   production step and (for breakthrough lessons) a free-choice
   finale. Adaptive: concepts are ordered by learner state, failed
   checks are repeated at the end, support mode simplifies options
   and slows audio. DOM-free state machine like every engine.
   ============================================================ */
(function () {
  'use strict';
  const PG = (globalThis.PG = globalThis.PG || {});
  const U = PG.util;
  const L = PG.learner;
  const ENG = (PG.eng = PG.eng || {});

  const lesson = {
    start(profile, code, lessonId) {
      const def = PG.lessons.byId(lessonId) || PG.lessons.ALL[0];
      const prog = PG.progression.compute(profile);
      const ordered = this._orderConcepts(profile, def.concepts);
      const st = {
        kind: 'lesson',
        code, def, levelIdx: def.levelIdx,
        support: prog.tier === 0,
        rate: prog.rate,
        steps: [], idx: 0, attempt: 1,
        failed: [], reQueued: false,
        checks: 0, firstTry: 0, newTaught: [],
        done: false, summary: null, opts: null,
      };
      this._buildSteps(st, profile, ordered);
      return st;
    },

    /* unknown concepts first (that is what the lesson teaches), then
       shaky, then due, then known — the adaptive reorder (§Lessons) */
    _orderConcepts(profile, concepts) {
      const rank = (id) => {
        const r = profile.items[id];
        if (!r || r.st === L.ST.UNSEEN) return 0;
        if (r.st <= L.ST.UNDERSTOOD_CTX) return 1;
        if (PG.srs.isDue(r, U.now())) return 2;
        return 3;
      };
      return concepts.slice().sort((a, b) => rank(a) - rank(b));
    },

    _buildSteps(st, profile, ordered) {
      const steps = [];
      const groups = [];
      for (let i = 0; i < ordered.length; i += 3) groups.push(ordered.slice(i, i + 3));
      groups.forEach((g) => {
        g.forEach((id) => steps.push({ t: 'expose', id }));
        g.forEach((id) => steps.push({ t: 'check', id }));
      });
      /* scene tableaus: hear the word, tap the matching picture in a tableau */
      const pool = ordered.slice();
      for (let i = 0; i < 2 && pool.length >= 3; i++) {
        const picks = U.sample(pool, 3);
        steps.push({ t: 'scene', id: picks[0], tableau: U.shuffle(picks) });
      }
      /* one production step */
      if (ordered.length) steps.push({ t: 'say', id: U.choice(ordered.filter((id) => { const it = PG.content.item(st.code, id); return it && it.t && it.t.length <= 24; }) || ordered) });
      /* breakthrough finale: a free communicative choice */
      if (st.def.breakthrough) {
        const exprPool = ordered.filter((id) => { const it = PG.content.item(st.code, id); return it && it.pos === 'expr'; });
        const pool2 = exprPool.length >= 2 ? exprPool : ordered;
        steps.push({ t: 'free', ids: U.sample(pool2, Math.min(3, pool2.length)) });
      }
      st.steps = steps;
    },

    _options(st, profile, itemId) {
      if (!st.opts) {
        /* same-lesson concepts are the most meaningful distractors */
        const mates = st.def.concepts
          .filter((id) => id !== itemId)
          .map((id) => PG.content.item(st.code, id))
          .filter(Boolean);
        const need = st.support ? 2 : 3;
        let picks = U.sample(mates, need);
        if (picks.length < need) {
          const ids = PG.input.options(profile, st.code, itemId, need + 1 - picks.length + 1, { maxNew: 1 });
          ids.forEach((id) => {
            if (picks.length < need && id !== itemId && !picks.some((p) => p.id === id)) {
              const it = PG.content.item(st.code, id);
              if (it) picks.push(it);
            }
          });
        }
        st.opts = U.shuffle([PG.content.item(st.code, itemId)].concat(picks).filter(Boolean)).map((it) => ({ it: it.id }));
      }
      return st.opts;
    },

    present(st, profile) {
      if (st.done) return { type: 'summary', summary: st.summary, def: st.def };
      const step = st.steps[st.idx];
      if (!step) { this._finish(st, profile); return { type: 'summary', summary: st.summary, def: st.def }; }
      const base = { idx: st.idx, total: st.steps.length, attempt: st.attempt, rate: st.rate * (st.support || st.attempt > 1 ? 0.85 : 1) };
      const it = PG.content.item(st.code, step.id);
      const romaji = !!(profile.settings.romaji && it && it.r);

      if (step.t === 'expose') {
        return Object.assign(base, {
          type: 'expose', item: { id: it.id, t: it.t, r: it.r || null, img: it.img || '💬' }, romaji,
        });
      }
      if (step.t === 'check') {
        const opts = this._options(st, profile, step.id);
        return Object.assign(base, {
          type: 'check', item: { id: it.id, t: it.t, r: it.r || null, img: it.img || '💬' }, romaji,
          sayText: it.t, options: opts, ok: opts.findIndex((o) => o.it === step.id),
          support: st.support || st.attempt > 1,
        });
      }
      if (step.t === 'scene') {
        const tableau = step.tableau.map((id) => ({ it: id }));
        return Object.assign(base, {
          type: 'scene', sayText: it.t, tableau, ok: tableau.findIndex((o) => o.it === step.id), item: { id: it.id, t: it.t },
        });
      }
      if (step.t === 'say') {
        return Object.assign(base, {
          type: 'say', item: { id: it.id, t: it.t, r: it.r || null, img: it.img || '💬' }, romaji,
          asr: !!(PG.providers && PG.providers.asr && PG.providers.asr.supported),
        });
      }
      /* free finale */
      return Object.assign(base, {
        type: 'free',
        options: step.ids.map((id) => ({ it: id })),
        charIcon: '🧑',
      });
    },

    /* responses: {advance} | {idx} | {said} | {self} */
    respond(st, profile, response) {
      if (st.done) return st;
      const step = st.steps[st.idx];
      if (!step) { this._finish(st, profile); return st; }
      const it = PG.content.item(st.code, step.id);
      const ctx = 'lesson:' + st.def.id + ':' + st.idx;

      if (step.t === 'expose') {
        L.applyEvidence(profile, st.code, step.id, { kind: 'exposure', ctx, modality: 'interact' });
        const rec = profile.items[step.id];
        if ((!rec || rec.st <= L.ST.SEEN) && st.newTaught.indexOf(step.id) < 0) st.newTaught.push(step.id);
        st.attempt = 1; st.opts = null; st.idx++;
        return st;
      }

      if (step.t === 'check' || step.t === 'scene') {
        const opts = step.t === 'check' ? st.opts : step.tableau.map((id) => ({ it: id }));
        const okIdx = opts.findIndex((o) => o.it === step.id);
        const res = PG.check.run(profile, st.code, {
          opts, ok: okIdx, k: 'recognition', ctx,
          dims: ['vocab', 'listening'], modality: 'listen',
        }, { idx: response.idx, attempt: st.attempt, ms: response.ms });
        st.checks++;
        if (!res.correct && res.retry) { st.attempt = 2; if (st.failed.indexOf(step.id) < 0) st.failed.push(step.id); return st; }
        if (res.correct && st.attempt === 1) st.firstTry++;
        st.attempt = 1; st.opts = null; st.idx++;
        this._maybeRepeatOrFinish(st, profile);
        return st;
      }

      if (step.t === 'say') {
        const targets = [it.t].concat(it.r ? [it.r] : []);
        if (response.said != null) {
          const res = PG.check.run(profile, st.code, {
            k: 'say', item: step.id, opts: [], ok: 0, ctx, dims: ['speaking', 'pronunciation'],
          }, { said: response.said, targets, attempt: st.attempt });
          if (!res.correct && res.retry) { st.attempt = 2; return st; }
        } else if (response.self) {
          L.applyEvidence(profile, st.code, step.id, { kind: 'production', ok: response.self !== 'hard', sim: response.self === 'easy' ? 0.9 : 0.55, ctx, modality: 'speak' });
          L.recordDim(profile, 'speaking', response.self !== 'hard', 0.5);
        } else { return st; }
        st.attempt = 1; st.idx++;
        this._maybeRepeatOrFinish(st, profile);
        return st;
      }

      if (step.t === 'free') {
        /* any choice is valid communication — the character responds */
        const chosenId = response.idx != null && step.ids[response.idx] ? step.ids[response.idx] : step.ids[0];
        const chosen = PG.content.item(st.code, chosenId);
        (step.ids || []).forEach((id) => L.applyEvidence(profile, st.code, id, { kind: 'exposure', ctx, modality: 'interact' }));
        L.applyEvidence(profile, st.code, chosenId, { kind: 'recognition', ok: true, support: true, ctx, modality: 'interact' });
        ['listening', 'vocab'].forEach((d) => L.recordDim(profile, d, true));
        L.award(profile, 10);
        L.touchStreak(profile);
        st.freeResponse = chosen ? chosen.t : '';
        st.idx++;
        this._maybeRepeatOrFinish(st, profile);
        return st;
      }

      st.idx++;
      this._maybeRepeatOrFinish(st, profile);
      return st;
    },

    /* adaptive repeat: failed checks come back once at the end */
    _maybeRepeatOrFinish(st, profile) {
      if (st.idx < st.steps.length) return;
      if (st.failed.length && !st.reQueued) {
        st.reQueued = true;
        st.failed.forEach((id) => st.steps.push({ t: 'check', id }));
        st.failedThisRound = st.failed.slice();
        st.failed = [];
        return;
      }
      this._finish(st, profile);
    },

    _finish(st, profile) {
      if (st.done) return;
      st.done = true;
      const prev = PG.learner.actsFor(profile).lessons[st.def.id];
      const score = st.checks ? st.firstTry / st.checks : 1;
      PG.learner.actsFor(profile).lessons[st.def.id] = { done: true, score, at: U.now(), replays: prev ? (prev.replays || 0) + 1 : 0 };
      PG.learner.touchGoal(profile, 'lesson');
      L.award(profile, 25);
      L.touchStreak(profile);
      st.summary = {
        score, checks: st.checks,
        newItems: st.newTaught.map((id) => PG.content.item(st.code, id)).filter(Boolean),
        replay: !!(prev && prev.done),
        freeResponse: st.freeResponse || null,
      };
    },
  };

  ENG.lesson = lesson;
})();

/* ==== engines/sounds.js ==== */
/* ============================================================
   POLYGLOT AI — Sounds engine (v1.1)
   Sound-system training with curated minimal/near pairs from the
   language file: hear one member of a pair, pick what you heard.
   Available only for languages with curated pairs (Verified).
   ============================================================ */
(function () {
  'use strict';
  const PG = (globalThis.PG = globalThis.PG || {});
  const U = PG.util;
  const L = PG.learner;
  const ENG = (PG.eng = PG.eng || {});

  const sounds = {
    start(profile, code) {
      const pack = PG.content.pack(code);
      const pairs = (pack && pack.sounds && pack.sounds.pairs) ? pack.sounds.pairs.slice() : [];
      const prog = PG.progression.compute(profile);
      const usePairs = U.shuffle(pairs).slice(0, 8);
      const trials = usePairs.map((p) => {
        const correctIsA = Math.random() < 0.5;
        const correct = correctIsA ? p.a : p.b;
        const other = correctIsA ? p.b : p.a;
        /* one extra distractor borrowed from another pair keeps it honest */
        let extra = null;
        const others = pairs.filter((q) => q !== p);
        if (others.length) {
          const q = U.choice(others);
          extra = Math.random() < 0.5 ? q.a : q.b;
        }
        const opts = [correct, other].concat(extra ? [extra] : []).map((w) => ({ t: w.t, r: w.r || null }));
        const shuffled = U.shuffle(opts);
        return {
          sayText: correct.t, hint: p.hint || null,
          options: shuffled, ok: shuffled.findIndex((o) => o.t === correct.t),
        };
      });
      return {
        kind: 'sounds', code,
        intro: (pack && pack.sounds && pack.sounds.intro) || '',
        trials, trialIdx: 0, attempt: 1, replays: 0,
        rate: prog.rate, firstTry: 0, wrongTotal: 0, done: !trials.length, summary: null,
      };
    },

    present(st, profile) {
      if (st.done) return { type: 'summary', summary: st.summary };
      const t = st.trials[st.trialIdx];
      return {
        type: 'trial', idx: st.trialIdx, total: st.trials.length,
        sayText: t.sayText, options: t.options, ok: t.ok, hint: t.hint,
        attempt: st.attempt, rate: st.rate * (st.attempt > 1 ? 0.8 : 0.92),
        showText: st.attempt > 1, // support: see the options after a miss
      };
    },

    respond(st, profile, response) {
      if (st.done) return st;
      const t = st.trials[st.trialIdx];
      if (response.replay) { st.replays++; return st; }
      const res = PG.check.run(profile, st.code, {
        opts: t.options, ok: t.ok, k: 'recognition', ctx: 'sounds:' + st.trialIdx,
        dims: ['listening', 'transfer'], modality: 'listen',
      }, { idx: response.idx, attempt: st.attempt, ms: response.ms, supportUsed: st.replays > 0 });
      if (!res.correct && res.retry) { st.attempt = 2; st.wrongTotal++; st.lastOutcome = 'retry'; return st; }
      if (res.correct && st.attempt === 1) { st.firstTry++; st.lastOutcome = 'ok'; }
      else if (res.correct) { st.lastOutcome = 'support'; }
      else { st.wrongTotal++; st.lastOutcome = 'fail'; }
      st.attempt = 1; st.replays = 0; st.trialIdx++;
      if (st.trialIdx >= st.trials.length) this._finish(st, profile);
      return st;
    },

    _finish(st, profile) {
      st.done = true;
      const acc = st.trials.length ? st.firstTry / st.trials.length : 0;
      PG.learner.actsFor(profile).sounds = (PG.learner.actsFor(profile).sounds || 0) + 1;
      L.award(profile, 20);
      PG.learner.touchGoal(profile, 'activity');
      L.touchStreak(profile);
      st.summary = { accuracy: acc, total: st.trials.length };
    },
  };

  ENG.sounds = sounds;
})();

/* ==== engines/numbers.js ==== */
/* ============================================================
   POLYGLOT AI — Numbers engine (v1.1)
   Counting, number sequences, prices, times and dates — driven by
   the language file's numbers patterns. Sections appear per
   language availability; counting works for every language because
   numerals live in the shared inventory.
   ============================================================ */
(function () {
  'use strict';
  const PG = (globalThis.PG = globalThis.PG || {});
  const U = PG.util;
  const L = PG.learner;
  const ENG = (PG.eng = PG.eng || {});

  const NUM_IDS = ['one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 'ten'];

  const numbers = {
    start(profile, code) {
      const pack = PG.content.pack(code);
      const prog = PG.progression.compute(profile);
      const num = (id) => PG.content.item(code, id);
      const trials = [];
      const modes = [];

      /* 1. counting: hear a number word → pick the numeral */
      const countIds = U.shuffle(NUM_IDS.slice()).slice(0, 4);
      countIds.forEach((id, i) => {
        const opts = this._numOptions(code, id);
        trials.push({ mode: 'count', sayText: num(id).t, options: opts.opts, ok: opts.ok, ctx: 'numbers:count:' + i });
      });
      modes.push('count');

      /* 2. sequence: hear n → pick n+1 */
      const seqStart = ['one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine'];
      const seqIds = U.shuffle(seqStart.slice()).slice(0, 2);
      seqIds.forEach((id, i) => {
        const next = NUM_IDS[NUM_IDS.indexOf(id) + 1];
        const opts = this._numOptions(code, next);
        trials.push({ mode: 'sequence', sayText: num(id).t, options: opts.opts, ok: opts.ok, ctx: 'numbers:seq:' + i });
      });
      modes.push('sequence');

      /* 3. prices: "N euros" → pick the numeral (needs language pattern) */
      if (pack.numbers && pack.numbers.price) {
        const priceIds = U.shuffle(['two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 'ten']).slice(0, 3);
        priceIds.forEach((id, i) => {
          const opts = this._numOptions(code, id);
          trials.push({
            mode: 'price', sayText: String(pack.numbers.price).split('{n}').join(num(id).t),
            options: opts.opts, ok: opts.ok, ctx: 'numbers:price:' + i, icon: '💰',
          });
        });
        modes.push('price');
      }

      /* 4. times: "at N o'clock" → pick the numeral (needs pattern) */
      if (pack.numbers && pack.numbers.time) {
        const timeIds = U.shuffle(['one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 'ten']).slice(0, 3);
        timeIds.forEach((id, i) => {
          const opts = this._numOptions(code, id);
          trials.push({
            mode: 'time', sayText: String(pack.numbers.time).split('{n}').join(num(id).t),
            options: opts.opts, ok: opts.ok, ctx: 'numbers:time:' + i, icon: '🕒',
          });
        });
        modes.push('time');
      }

      /* 5. dates: "Today is Monday" → pick the day (needs days + pattern) */
      if (pack.numbers && pack.numbers.days && pack.numbers.days.length === 7 && pack.numbers.date) {
        const dayIdx = [0, 1, 2, 3, 4, 5, 6];
        U.shuffle(dayIdx).slice(0, 2).forEach((di, i) => {
          const correct = { t: pack.numbers.days[di] };
          const others = pack.numbers.days.filter((_, j) => j !== di);
          const opts = U.shuffle([correct].concat(U.sample(others, 2)));
          trials.push({
            mode: 'date', sayText: String(pack.numbers.date).split('{day}').join(pack.numbers.days[di]),
            options: opts, ok: opts.findIndex((o) => o.t === correct.t), ctx: 'numbers:date:' + i, icon: '📅',
          });
        });
        modes.push('date');
      }

      return {
        kind: 'numbers', code, modes,
        trials, trialIdx: 0, attempt: 1, replays: 0, rate: prog.rate,
        firstTry: 0, wrongTotal: 0, done: !trials.length, summary: null,
      };
    },

    _numOptions(code, correctId) {
      const others = NUM_IDS.filter((id) => id !== correctId);
      const picks = U.sample(others, 3);
      const ids = U.shuffle([correctId].concat(picks));
      return {
        opts: ids.map((id) => ({ it: id })),
        ok: ids.indexOf(correctId),
      };
    },

    present(st, profile) {
      if (st.done) return { type: 'summary', summary: st.summary, modes: st.modes };
      const t = st.trials[st.trialIdx];
      return {
        type: 'trial', idx: st.trialIdx, total: st.trials.length,
        mode: t.mode, icon: t.icon || null,
        sayText: t.sayText, options: t.options, ok: t.ok,
        attempt: st.attempt, rate: st.rate * (st.attempt > 1 ? 0.82 : 0.95),
        showText: st.attempt > 1,
      };
    },

    respond(st, profile, response) {
      if (st.done) return st;
      const t = st.trials[st.trialIdx];
      if (response.replay) { st.replays++; return st; }
      const res = PG.check.run(profile, st.code, {
        opts: t.options, ok: t.ok, k: 'recognition', ctx: t.ctx,
        dims: t.mode === 'date' ? ['listening', 'comprehension'] : ['listening', 'vocab'],
        modality: 'listen',
      }, { idx: response.idx, attempt: st.attempt, ms: response.ms, supportUsed: st.replays > 0 });
      if (!res.correct && res.retry) { st.attempt = 2; st.wrongTotal++; st.lastOutcome = 'retry'; return st; }
      if (res.correct && st.attempt === 1) { st.firstTry++; st.lastOutcome = 'ok'; }
      else if (res.correct) { st.lastOutcome = 'support'; }
      else { st.wrongTotal++; st.lastOutcome = 'fail'; }
      st.attempt = 1; st.replays = 0; st.trialIdx++;
      if (st.trialIdx >= st.trials.length) this._finish(st, profile);
      return st;
    },

    _finish(st, profile) {
      st.done = true;
      const acc = st.trials.length ? st.firstTry / st.trials.length : 0;
      PG.learner.actsFor(profile).numbers = (PG.learner.actsFor(profile).numbers || 0) + 1;
      L.award(profile, 20);
      PG.learner.touchGoal(profile, 'activity');
      L.touchStreak(profile);
      st.summary = { accuracy: acc, total: st.trials.length, modes: st.modes };
    },
  };

  ENG.numbers = numbers;
})();

/* ==== engines/ear.js ==== */
/* ============================================================
   POLYGLOT AI — Ear Training engine (v1.1)
   Audio-first comprehension. For languages with authored listening
   sets (Verified) it runs those word → sentence → dialogue trials;
   for every other language it generates word → picture trials from
   the shared inventory, preferring items that are due or shaky.
   ============================================================ */
(function () {
  'use strict';
  const PG = (globalThis.PG = globalThis.PG || {});
  const U = PG.util;
  const L = PG.learner;
  const ENG = (PG.eng = PG.eng || {});

  const ear = {
    start(profile, code) {
      const pack = PG.content.pack(code);
      const prog = PG.progression.compute(profile);

      /* authored sets take precedence (richer: sentences & dialogues) */
      if (pack && pack.listening && pack.listening.length) {
        const nextId = PG.progression.nextListening(profile) || pack.listening[0].id;
        const st = PG.eng.listening.start(profile, code, nextId);
        st.kind = 'ear';
        return st;
      }

      /* generated trials: due → shaky → fresh, picture options */
      const pool = PG.content.items(code).filter((it) => it.img && (it.pos === 'n' || it.pos === 'feel' || it.pos === 'num' || it.pos === 'dir'));
      const due = pool.filter((it) => { const r = profile.items[it.id]; return r && PG.srs.isDue(r, U.now()); });
      const shaky = pool.filter((it) => { const r = profile.items[it.id]; return r && r.st >= L.ST.SEEN && r.st <= L.ST.UNDERSTOOD_CTX; });
      const fresh = pool.filter((it) => { const r = profile.items[it.id]; return !r || r.st === L.ST.UNSEEN; });
      const picks = U.uniq(due.concat(shaky, fresh, pool)).slice(0, 8);
      const trials = picks.map((it, i) => {
        const ids = PG.input.options(profile, code, it.id, 4, { maxNew: 1 });
        return { say: it.t, k: 'pic', opts: ids.map((id) => ({ it: id })), ok: ids.indexOf(it.id), ctx: 'ear:' + i };
      });

      return {
        kind: 'ear', code, generated: true,
        trials, trialIdx: 0, attempt: 1, replays: 0, rate: prog.rate,
        captions: !!profile.settings.captions,
        firstTry: 0, wrongTotal: 0, done: !trials.length, summary: null,
      };
    },

    present(st, profile) {
      if (st.done) return { type: 'summary', summary: st.summary, generated: !!st.generated };
      const t = st.trials[st.trialIdx];
      return {
        type: 'trial', idx: st.trialIdx, total: st.trials.length,
        sayText: t.say, kind: t.k, options: t.opts, ok: t.ok,
        attempt: st.attempt, rate: st.rate,
        showText: (st.captions || st.attempt > 1) && !t.opts.some((o) => o.sc),
        scene: '👂',
      };
    },

    respond(st, profile, response) {
      if (st.done) return st;
      const t = st.trials[st.trialIdx];
      if (response.replay) { st.replays++; return st; }
      const support = st.captions || (st.replays > 0);
      const res = PG.check.run(profile, st.code, {
        opts: t.opts, ok: t.ok, k: t.k, ctx: t.ctx || 'ear:' + st.trialIdx,
        dims: ['listening', 'vocab'], modality: 'listen',
      }, { idx: response.idx, attempt: st.attempt, ms: response.ms, supportUsed: support });
      if (!res.correct && res.retry) { st.attempt = 2; st.wrongTotal++; st.lastOutcome = 'retry'; return st; }
      if (res.correct && st.attempt === 1) { st.firstTry++; st.lastOutcome = 'ok'; }
      else if (res.correct) { st.lastOutcome = 'support'; }
      else { st.wrongTotal++; st.lastOutcome = 'fail'; }
      st.attempt = 1; st.replays = 0; st.trialIdx++;
      if (st.trialIdx >= st.trials.length) this._finish(st, profile);
      return st;
    },

    _finish(st, profile) {
      st.done = true;
      const total = st.trials.length;
      const acc = total ? st.firstTry / total : 0;
      if (st.generated) {
        PG.learner.actsFor(profile).ear = (PG.learner.actsFor(profile).ear || 0) + 1;
        st.summary = { accuracy: acc, total };
      } else {
        /* authored set: mirror the listening engine's bookkeeping */
        const set = st.set;
        PG.learner.actsFor(profile).listen[set.id] = Math.max(acc, PG.learner.actsFor(profile).listen[set.id] || 0);
        st.summary = { accuracy: acc, total };
      }
      L.award(profile, 20);
      PG.learner.touchGoal(profile, 'activity');
      L.touchStreak(profile);
    },
  };

  ENG.ear = ear;
})();

/* ==== engines/vocab.js ==== */
/* ============================================================
   POLYGLOT AI — Vocabulary engine (v1.1)
   Picture-based new words: an exposure card (picture + word + audio)
   followed immediately by a picture check, for a bounded set of
   unseen concepts; falls back to the weakest known words when
   nothing new is left at this level.
   ============================================================ */
(function () {
  'use strict';
  const PG = (globalThis.PG = globalThis.PG || {});
  const U = PG.util;
  const L = PG.learner;
  const ENG = (PG.eng = PG.eng || {});

  const vocab = {
    start(profile, code) {
      const pack = PG.content.pack(code);
      const prog = PG.progression.compute(profile);

      let picks = PG.input.newItems(profile, code, 6, null, 1)
        .filter((it) => it.img);
      let mode = 'new';
      if (picks.length < 4) {
        const lv2 = PG.input.newItems(profile, code, 6 - picks.length, null, 2).filter((it) => it.img);
        picks = picks.concat(lv2);
      }
      if (picks.length < 3) {
        /* nothing new: consolidate the weakest picture words */
        mode = 'consolidate';
        const pool = pack.items.filter((it) => it.img && (it.lv || 1) <= 2 && profile.items[it.id] && profile.items[it.id].st >= L.ST.SEEN);
        pool.sort((a, b) => (profile.items[a.id].st - profile.items[b.id].st) || (profile.items[a.id].bad - profile.items[b.id].bad));
        picks = pool.slice(0, 6);
      }
      picks = picks.slice(0, 6);

      /* interleave: expose → check per word */
      const steps = [];
      picks.forEach((it) => { steps.push({ t: 'expose', id: it.id }); steps.push({ t: 'check', id: it.id }); });

      return {
        kind: 'vocab', code, mode, steps, idx: 0, attempt: 1,
        rate: prog.rate, support: prog.tier === 0,
        checks: 0, firstTry: 0, newTaught: [], done: !steps.length, summary: null, opts: null,
      };
    },

    present(st, profile) {
      if (st.done) return { type: 'summary', summary: st.summary, mode: st.mode };
      const step = st.steps[st.idx];
      const it = PG.content.item(st.code, step.id);
      const romaji = !!(profile.settings.romaji && it.r);
      if (step.t === 'expose') {
        return {
          type: 'expose', idx: st.idx, total: st.steps.length,
          item: { id: it.id, t: it.t, r: it.r || null, img: it.img }, romaji,
          rate: st.rate * 0.9,
        };
      }
      if (!st.opts) {
        const ids = PG.input.options(profile, st.code, step.id, st.support ? 3 : 4, { maxNew: 1 });
        st.opts = ids.map((id) => ({ it: id }));
      }
      return {
        type: 'check', idx: st.idx, total: st.steps.length,
        sayText: it.t, item: { id: it.id, t: it.t, r: it.r || null, img: it.img }, romaji,
        options: st.opts, ok: st.opts.findIndex((o) => o.it === step.id),
        attempt: st.attempt, support: st.support || st.attempt > 1,
        rate: st.rate * (st.attempt > 1 ? 0.85 : 1),
      };
    },

    respond(st, profile, response) {
      if (st.done) return st;
      const step = st.steps[st.idx];
      const it = PG.content.item(st.code, step.id);
      const ctx = 'vocab:' + st.idx;

      if (step.t === 'expose') {
        L.applyEvidence(profile, st.code, step.id, { kind: 'exposure', ctx, modality: 'interact' });
        const rec = profile.items[step.id];
        if ((!rec || rec.st <= L.ST.SEEN) && st.newTaught.indexOf(step.id) < 0) st.newTaught.push(step.id);
        st.idx++;
        return st;
      }

      const res = PG.check.run(profile, st.code, {
        opts: st.opts, ok: st.opts.findIndex((o) => o.it === step.id), k: 'recognition', ctx,
        dims: ['vocab', 'listening'], modality: 'listen',
      }, { idx: response.idx, attempt: st.attempt, ms: response.ms });
      st.checks++;
      if (!res.correct && res.retry) { st.attempt = 2; st.lastOutcome = 'retry'; return st; }
      if (res.correct && st.attempt === 1) { st.firstTry++; st.lastOutcome = 'ok'; }
      else if (res.correct) { st.lastOutcome = 'support'; }
      else { st.lastOutcome = 'fail'; }
      st.attempt = 1; st.opts = null; st.idx++;
      if (st.idx >= st.steps.length) this._finish(st, profile);
      return st;
    },

    _finish(st, profile) {
      st.done = true;
      const acc = st.checks ? st.firstTry / st.checks : 0;
      PG.learner.actsFor(profile).vocab = (PG.learner.actsFor(profile).vocab || 0) + 1;
      L.award(profile, 15);
      PG.learner.touchGoal(profile, 'activity');
      L.touchStreak(profile);
      st.summary = {
        accuracy: acc, checks: st.checks, mode: st.mode,
        newItems: st.newTaught.map((id) => PG.content.item(st.code, id)).filter(Boolean),
      };
    },
  };

  ENG.vocab = vocab;
})();

/* ==== engines/flashcards.js ==== */
/* ============================================================
   POLYGLOT AI — Flashcards engine (v1.1)
   The classic two-sided card, deliberately OPT-IN: the flashcard
   format is off by default (settings.flashcards) because contextual
   re-encounters are the primary review format. A card is: picture
   + audio (front) → flip → word + romanisation → honest self-grade.
   Evidence is recorded as supported recognition.
   ============================================================ */
(function () {
  'use strict';
  const PG = (globalThis.PG = globalThis.PG || {});
  const U = PG.util;
  const L = PG.learner;
  const ENG = (PG.eng = PG.eng || {});

  const flashcards = {
    start(profile, code) {
      const pack = PG.content.pack(code);
      const now = U.now();

      let picks = pack.items.filter((it) => {
        const r = profile.items[it.id];
        return r && PG.srs.isDue(r, now) && r.st >= L.ST.SEEN && it.img;
      });
      if (picks.length < 4) {
        const shaky = pack.items.filter((it) => {
          const r = profile.items[it.id];
          return it.img && r && (r.st === L.ST.RECOGNIZED || r.st === L.ST.UNDERSTOOD_CTX);
        });
        picks = picks.concat(shaky);
      }
      if (picks.length < 4) {
        picks = pack.items.filter((it) => it.img && (it.lv || 1) === 1);
      }
      picks = U.uniq(picks).slice(0, 10);

      return {
        kind: 'flash', code,
        cards: picks, idx: 0, phase: 'front',
        got: 0, missed: 0, done: !picks.length, summary: null,
      };
    },

    present(st, profile) {
      if (st.done) return { type: 'summary', summary: st.summary };
      const it = st.cards[st.idx];
      return {
        type: 'card', idx: st.idx, total: st.cards.length,
        phase: st.phase,
        item: { id: it.id, t: it.t, r: it.r || null, img: it.img },
        romaji: !!(profile.settings.romaji && it.r),
        rate: 0.9,
      };
    },

    /* responses: {flip} | {grade:'got'|'missed'} */
    respond(st, profile, response) {
      if (st.done) return st;
      const it = st.cards[st.idx];
      if (response.flip) { st.phase = 'back'; return st; }
      if (response.grade) {
        const ok = response.grade === 'got';
        L.applyEvidence(profile, st.code, it.id, {
          kind: 'recognition', ok, support: true, ctx: 'flash:' + it.id, modality: 'interact',
        });
        L.recordDim(profile, 'retention', ok);
        if (ok) { st.got++; L.award(profile, 5); } else st.missed++;
        L.touchStreak(profile);
        st.phase = 'front';
        st.idx++;
        if (st.idx >= st.cards.length) this._finish(st, profile);
      }
      return st;
    },

    _finish(st, profile) {
      st.done = true;
      PG.learner.actsFor(profile).flash = (PG.learner.actsFor(profile).flash || 0) + 1;
      PG.learner.touchGoal(profile, 'activity');
      st.summary = {
        got: st.got, missed: st.missed, total: st.cards.length,
        accuracy: st.cards.length ? st.got / st.cards.length : 0,
        items: st.cards,
      };
    },
  };

  ENG.flashcards = flashcards;
})();

/* ==== ui/i18n.js ==== */
/* ============================================================
   POLYGLOT AI — i18n layer (v1.1: two independent languages)
   · INTERFACE language (learner's own): tabs, buttons, menus,
     settings, messages — resolved with T() from the interface
     locale, with English fallback.
   · LEARNING language (lesson content): audio, dialogue, stories,
     scenarios, captions, tutor speech, feedback — content comes
     from language packs; in-lesson feedback strings resolve with
     L() (pack lessonFeedback → locale pack → English last resort).
   Any interface language works with any learning language.
   ============================================================ */
(function () {
  'use strict';
  const PG = (globalThis.PG = globalThis.PG || {});

  const STRINGS = {};   // locale -> { key: value }

  /* locales whose interface layout is right-to-left */
  const RTL_LOCALES = ['ar', 'he', 'fa', 'ur'];

  const i18n = {
    registerStrings(lang, map) { STRINGS[lang] = Object.assign(STRINGS[lang] || {}, map); },
    has(lang) { return !!STRINGS[lang]; },
    langs() { return Object.keys(STRINGS); },
    isRtl(lang) { return RTL_LOCALES.indexOf(lang) >= 0; },

    /* translate in a specific locale */
    TL(lang, key, vars) {
      const pack = STRINGS[lang] || {};
      let s = pack[key];
      if (s == null) s = (STRINGS.en && STRINGS.en[key]) != null ? STRINGS.en[key] : key;
      if (vars) Object.keys(vars).forEach((k) => { s = String(s).split('{ ' + k + ' }').join(vars[k]).split('{' + k + '}').join(vars[k]); });
      return s;
    },

    /* interface language (learner's own language) */
    T(key, vars) {
      const lang = (PG.app && PG.app.uiLang && PG.app.uiLang()) || 'en';
      return i18n.TL(lang, key, vars);
    },

    /* learning language (lesson content: feedback, tutor speech).
       Resolution: language-pack lessonFeedback → locale pack for that
       language → English (last resort for keys a draft may not define). */
    L(key, vars) {
      const target = (PG.app && PG.app.lessonLang && PG.app.lessonLang()) || 'es';
      const pack = PG.content ? PG.content.pack(target) : null;
      if (pack && pack.lessonFeedback && pack.lessonFeedback[key] != null) {
        let s = pack.lessonFeedback[key];
        if (vars) Object.keys(vars).forEach((k) => { s = String(s).split('{' + k + '}').join(vars[k]); });
        return s;
      }
      if (STRINGS[target] && STRINGS[target][key] != null) return i18n.TL(target, key, vars);
      return i18n.TL('en', key, vars);
    },

    /* check that every locale defines every key (build-time QA) */
    parityErrors() {
      const base = STRINGS.en ? Object.keys(STRINGS.en).sort() : [];
      const errs = [];
      Object.keys(STRINGS).forEach((l) => {
        if (l === 'en') return;
        const keys = new Set(Object.keys(STRINGS[l]));
        base.forEach((k) => { if (!keys.has(k)) errs.push(l + ' missing key ' + k); });
        keys.forEach((k) => { if (base.indexOf(k) < 0) errs.push(l + ' extra key ' + k); });
      });
      return errs;
    },
  };

  PG.i18n = i18n;
})();

/* ==== ui/components.js ==== */
/* ============================================================
   POLYGLOT AI — UI components (browser only)
   Small render helpers: everything dynamic is escaped; icons are
   emoji; charts are inline SVG (no external dependencies).
   ============================================================ */
(function () {
  'use strict';
  const PG = (globalThis.PG = globalThis.PG || {});
  const U = PG.util;
  const UI = (PG.ui = PG.ui || {});

  const qs = (sel, root) => (root || document).querySelector(sel);
  const qsa = (sel, root) => Array.prototype.slice.call((root || document).querySelectorAll(sel));
  const esc = U.esc;

  const components = {
    qs, qsa, esc,

    /* card with icon + title + subtitle + optional right badge */
    card(o) {
      return (
        '<button class="card' + (o.locked ? ' locked' : '') + (o.cls ? ' ' + o.cls : '') + '" data-act="' + esc(o.act || '') + '"' +
        (o.disabled ? ' disabled' : '') + '>' +
        '<span class="card-icon" aria-hidden="true">' + esc(o.icon || '') + '</span>' +
        '<span class="card-body"><span class="card-title">' + esc(o.title) + '</span>' +
        (o.sub ? '<span class="card-sub">' + esc(o.sub) + '</span>' : '') + '</span>' +
        (o.badge != null ? '<span class="card-badge">' + esc(String(o.badge)) + '</span>' : '') +
        (o.locked ? '<span class="card-lock">🔒</span>' : '') +
        '</button>'
      );
    },

    progressRing(pct, size, label) {
      size = size || 44;
      const r = (size - 8) / 2, c = 2 * Math.PI * r;
      const off = c * (1 - U.clamp(pct, 0, 1));
      return (
        '<svg class="ring" width="' + size + '" height="' + size + '" viewBox="0 0 ' + size + ' ' + size + '" role="img"' +
        (label ? ' aria-label="' + esc(label) + '"' : '') + '>' +
        '<circle cx="' + size / 2 + '" cy="' + size / 2 + '" r="' + r + '" class="ring-bg"></circle>' +
        '<circle cx="' + size / 2 + '" cy="' + size / 2 + '" r="' + r + '" class="ring-fg" stroke-dasharray="' + c.toFixed(1) + '" stroke-dashoffset="' + off.toFixed(1) + '"></circle>' +
        '</svg>'
      );
    },

    /* radar chart for the 10 acquisition dimensions */
    radar(entries) {
      const n = entries.length;
      const size = 300, cx = size / 2, cy = size / 2 + 6, R = 96;
      const pt = (i, frac) => {
        const a = -Math.PI / 2 + (2 * Math.PI * i) / n;
        return [cx + Math.cos(a) * R * frac, cy + Math.sin(a) * R * frac];
      };
