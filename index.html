      let rings = '';
      [0.25, 0.5, 0.75, 1].forEach((f) => {
        let d = '';
        for (let i = 0; i < n; i++) { const p = pt(i, f); d += (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1); }
        rings += '<path d="' + d + 'Z" class="radar-ring"></path>';
      });
      let axes = '', labels = '', poly = '';
      let d = '';
      entries.forEach((e, i) => {
        const p = pt(i, 1);
        axes += '<line x1="' + cx + '" y1="' + cy + '" x2="' + p[0].toFixed(1) + '" y2="' + p[1].toFixed(1) + '" class="radar-axis"></line>';
        const lp = pt(i, 1.22);
        labels += '<text x="' + lp[0].toFixed(1) + '" y="' + lp[1].toFixed(1) + '" class="radar-label' + (e.conf < 0.3 ? ' radar-weak' : '') + '" text-anchor="middle" dominant-baseline="middle">' + esc(e.label) + '</text>';
        const v = pt(i, Math.max(0.04, (e.score / 100) * (0.55 + 0.45 * e.conf)));
        d += (i ? 'L' : 'M') + v[0].toFixed(1) + ' ' + v[1].toFixed(1);
      });
      poly = '<path d="' + d + 'Z" class="radar-shape"></path>';
      return '<svg class="radar" viewBox="0 0 ' + size + ' ' + (size + 16) + '" role="img" aria-label="acquisition profile">' + rings + axes + poly + labels + '</svg>';
    },

    /* horizontal bar (vocabulary state funnel) */
    bar(label, value, max, cls) {
      const pct = max ? Math.round((value / max) * 100) : 0;
      return (
        '<div class="bar-row"><span class="bar-label">' + esc(label) + '</span>' +
        '<span class="bar-track"><span class="bar-fill ' + (cls || '') + '" style="width:' + pct + '%"></span></span>' +
        '<span class="bar-value">' + value + '</span></div>'
      );
    },

    /* picture option button (icon + target-language label) */
    optBtn(o, idx, opts) {
      opts = opts || {};
      return (
        '<button class="opt' + (opts.small ? ' opt-sm' : '') + '" data-idx="' + idx + '" type="button">' +
        (o.sc ? '<span class="opt-scene" aria-hidden="true">' + esc(o.sc) + '</span>' : '') +
        (o.img ? '<span class="opt-img" aria-hidden="true">' + esc(o.img) + '</span>' : '') +
        (o.t ? '<span class="opt-t">' + esc(o.t) + '</span>' : '') +
        (o.sub ? '<span class="opt-sub">' + esc(o.sub) + '</span>' : '') +
        '</button>'
      );
    },

    dots(idx, total) {
      let s = '<div class="dots" role="img" aria-label="' + (idx + 1) + ' / ' + total + '">';
      for (let i = 0; i < total; i++) s += '<span class="dot' + (i <= idx ? ' on' : '') + (i === idx ? ' cur' : '') + '"></span>';
      return s + '</div>';
    },

    toast(msg, kind) {
      let el = qs('#toast');
      if (!el) { el = document.createElement('div'); el.id = 'toast'; document.body.appendChild(el); }
      el.className = 'toast ' + (kind || '');
      el.textContent = msg;
      el.setAttribute('role', 'status');
      requestAnimationFrame(() => { el.classList.add('show'); });
      clearTimeout(el._t);
      el._t = setTimeout(() => { el.classList.remove('show'); }, 2200);
    },

    banner(id, html) {
      let b = qs('#banner-' + id);
      if (!html) { if (b) b.remove(); return; }
      if (!b) {
        b = document.createElement('div');
        b.id = 'banner-' + id;
        b.className = 'banner';
        const view = qs('#view');
        if (view && view.firstChild) view.insertBefore(b, view.firstChild);
        else if (view) view.appendChild(b);
        else document.body.appendChild(b);
      }
      b.innerHTML = html;
    },

    /* feedback flash over an activity */
    flash(kind, text) {
      const old = qs('#flash');
      if (old) old.remove();
      const f = document.createElement('div');
      f.id = 'flash';
      f.className = 'flash ' + kind;
      f.innerHTML = '<span class="flash-emoji">' + (kind === 'ok' ? '✨' : kind === 'no' ? '🤔' : '👋') + '</span><span>' + esc(text) + '</span>';
      qs('#view').appendChild(f);
      requestAnimationFrame(() => f.classList.add('show'));
      setTimeout(() => f.remove(), 900);
    },
  };

  Object.assign(UI, components);
})();

/* ==== ui/app.js ==== */
/* ============================================================
   POLYGLOT AI — application shell (v1.1)
   Five bottom tabs (mobile-first): Home · Lessons · Activities ·
   Review · You. Interface chrome speaks the learner's OWN language
   (profile.native); lesson content speaks the learning language
   (profile.target) — the two are independent.
   ============================================================ */
(function () {
  'use strict';
  const PG = (globalThis.PG = globalThis.PG || {});
  const U = PG.util;
  const UI = PG.ui;

  const STORE_KEY = 'polyglot-ai-v1';

  const app = {
    profile: null,
    screens: {},
    route: null,
    backStack: [],
    voiceReady: false,

    /* ---------- lifecycle ---------- */
    init() {
      PG.providers.init();
      PG.content.index();
      const saved = U.store.get(STORE_KEY);
      if (saved && !saved.error) {
        /* transparent migration: only the CURRENT format skips validation;
           older saved profiles (v1/v2) go through deserialize, which moves
           their flat learning state into the language it was made in (v3) */
        const res = saved.v === 3 ? { profile: saved } : PG.learner.deserialize(JSON.stringify(saved));
        this.profile = res.profile || null;
      }

      this.renderShell();
      document.body.classList.toggle('dark', !!(this.profile && this.profile.settings.dark));

      if (this.profile) { this.applyLang(); this.go('home', null, { root: true }); }
      else this.go('onboarding', null, { root: true });

      PG.providers.tts.onVoices(() => this.checkVoices());
      setTimeout(() => this.checkVoices(), 1200);

      /* optional account sync — inert unless configured AND signed in;
         the app is fully usable without an account and offline */
      if (PG.sync) {
        PG.sync.onChange(() => this.renderSyncChips());
        if (PG.sync.configured() && PG.sync.session()) {
          PG.sync.syncNow(this._syncDeps()).catch(() => {});
          window.addEventListener('online', () => {
            if (PG.sync.session()) PG.sync.syncNow(this._syncDeps()).catch(() => {});
          });
        }
      }
    },

    /* profile access for the sync module (kept DOM-free for tests) */
    _syncDeps() {
      return {
        getProfile: () => this.profile,
        /* remote won last-write-wins: adopt it wholesale, keep the
           remote's updatedAt (the winning write's clock), rerender */
        adoptProfile: (p) => {
          this.profile = p;
          U.store.set(STORE_KEY, p);
          this.applyLang();
          if (this.route) this.go(this.route.name, this.route.params, { root: true });
        },
      };
    },

    /* refresh every sync chip currently in the DOM (You tab, Settings) */
    renderSyncChips() {
      const info = PG.sync.info();
      document.querySelectorAll('[data-sync-chip]').forEach((el) => {
        const map = {
          synced: { cls: 'ok', icon: '☁️', key: 'sync.status.synced' },
          offline: { cls: 'bad', icon: '☁️', key: 'sync.status.offline' },
          error: { cls: 'bad', icon: '⚠️', key: 'sync.status.error' },
          syncing: { cls: 'wait', icon: '⏳', key: 'sync.status.syncing' },
        };
        const m = map[info.status] || null;
        if (!info.configured || !info.email || !m) { el.hidden = true; return; }
        el.hidden = false;
        el.className = 'sync-chip ' + m.cls;
        el.innerHTML = m.icon + ' ' + U.esc(PG.i18n.T(m.key)) +
          (info.status === 'synced' && info.lastSync
            ? ' <span class="sync-t">' + new Date(info.lastSync).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) + '</span>'
            : '');
      });
    },

    renderShell() {
      document.body.innerHTML =
        '<header id="topbar" class="topbar"></header>' +
        '<main id="view" class="view" tabindex="-1" aria-live="polite"></main>' +
        '<nav id="bottomnav" class="bottomnav" aria-label="main"></nav>' +
        '<div id="sheet" class="sheet-backdrop" hidden><div class="sheet" id="sheet-body" role="dialog" aria-modal="true"></div></div>';
      this.renderNav();
    },

    renderNav() {
      const nav = document.getElementById('bottomnav');
      if (!this.profile) { nav.style.display = 'none'; return; }
      nav.style.display = '';
      const tabs = [
        { act: 'home', icon: '🏠', key: 'tab.home' },
        { act: 'lessons', icon: '🎓', key: 'tab.lessons' },
        { act: 'activities', icon: '🎯', key: 'tab.activities' },
        { act: 'review', icon: '🔁', key: 'tab.review' },
        { act: 'you', icon: '👤', key: 'tab.you' },
      ];
      nav.innerHTML = tabs.map((it) =>
        '<button class="navbtn' + (this.route && this.route.name === it.act ? ' active' : '') + '" data-nav="' + it.act + '" aria-label="' + U.esc(PG.i18n.T(it.key)) + '">' +
        '<span class="nav-ico" aria-hidden="true">' + it.icon + '</span><span class="nav-lbl">' + U.esc(PG.i18n.T(it.key)) + '</span></button>'
      ).join('');
      UI.qsa('[data-nav]', nav).forEach((b) => {
        b.addEventListener('click', () => this.go(b.getAttribute('data-nav'), null, { root: true }));
      });
    },

    /* ---------- language & direction ---------- */
    uiLang() { return (this.profile && this.profile.native) || this._native || 'en'; },
    lessonLang() { return (this.profile && this.profile.target) || 'es'; },
    targetPack() { return PG.content.pack(this.lessonLang()); },
    applyLang() {
      const iface = this.uiLang();
      document.documentElement.lang = iface;
      document.body.dir = PG.i18n.isRtl(iface) ? 'rtl' : 'ltr';
      const pack = this.targetPack();
      if (pack) {
        document.body.dataset.lang = pack.code;
        document.body.style.setProperty('--accent', pack.accent || '#4f46e5');
        document.body.style.setProperty('--accent2', pack.accent2 || '#312e81');
      }
    },
    /* direction attribute for learning-language text inside lessons */
    targetDir() {
      const pack = this.targetPack();
      return pack && pack.rtl ? 'rtl' : 'ltr';
    },

    /* ---------- routing ---------- */
    go(name, params, opts) {
      opts = opts || {};
      if (this.route && !opts.root && this.route.name !== name) this.backStack.push(this.route);
      if (opts.root) this.backStack = [];
      this.route = { name, params: params || {} };
      const scr = this.screens[name];
      const view = document.getElementById('view');
      view.scrollTop = 0;
      this.closeSheet();
      if (scr) scr(view, this.route.params);
      else view.innerHTML = '<div class="pad">404</div>';
      this.renderNav();
      this.checkVoices();
    },
    goBack() {
      const prev = this.backStack.pop();
      if (prev) { this.route = prev; const scr = this.screens[prev.name]; if (scr) scr(document.getElementById('view'), prev.params); this.renderNav(); }
      else this.go('home', null, { root: true });
    },
    top(title, opts) {
      opts = opts || {};
      const t = document.getElementById('topbar');
      if (!this.profile || opts.hidden) { t.style.display = 'none'; return; }
      t.style.display = '';
      const p = this.profile;
      t.innerHTML =
        (opts.back ? '<button class="topbtn" id="topback" aria-label="' + U.esc(PG.i18n.T('common.back')) + '">←</button>' : '<span class="brand">🦜</span>') +
        '<div class="top-title">' + U.esc(title) + '</div>' +
        '<div class="top-chips">' +
        '<span class="chip" title="' + U.esc(PG.i18n.T('home.streak')) + '">🔥 ' + (p.streak || 0) + '</span>' +
        '<span class="chip" title="XP">✨ ' + (p.xp || 0) + '</span></div>';
      const b = document.getElementById('topback');
      if (b) b.addEventListener('click', () => this.goBack());
    },

    /* ---------- bottom sheet (notifications, language info) ---------- */
    openSheet(html, onMount) {
      const back = document.getElementById('sheet');
      const body = document.getElementById('sheet-body');
      body.innerHTML = html;
      back.hidden = false;
      back.onclick = (e) => { if (e.target === back) this.closeSheet(); };
      if (this._sheetKey) document.removeEventListener('keydown', this._sheetKey);
      this._sheetKey = (e) => { if (e.key === 'Escape') this.closeSheet(); };
      document.addEventListener('keydown', this._sheetKey);
      if (onMount) onMount(body);
    },
    closeSheet() {
      const back = document.getElementById('sheet');
      if (back) back.hidden = true;
      if (this._sheetKey) { document.removeEventListener('keydown', this._sheetKey); this._sheetKey = null; }
    },

    /* ---------- persistence ---------- */
    save() {
      if (!this.profile) return;
      clearTimeout(this._saveT);
      this._saveT = setTimeout(() => {
        this.profile.updatedAt = U.now();   /* local-write clock for LWW sync */
        U.store.set(STORE_KEY, this.profile);
        if (PG.sync) PG.sync.autoSync(this._syncDeps());
      }, 250);
    },

    /* ---------- speech ---------- */
    pack() { return this.targetPack(); },
    voice() {
      if (!this.profile) return null;
      const pack = this.targetPack();
      if (!pack) return null;
      const want = this.profile.settings.voice;
      const voices = PG.providers.tts.voicesFor(pack.langPrefixes);
      if (!voices.length) return null;
      if (want) { const v = voices.find((v) => v.voiceURI === want); if (v) return v; }
      return voices.find((v) => v.localService) || voices[0];
    },
    say(text, opts) {
      opts = opts || {};
      const pack = this.targetPack();
      if (!this.profile || !text || !pack) return Promise.resolve(false);
      return PG.providers.tts.speak(text, {
        lang: pack.bcp47,
        rate: (opts.rate != null ? opts.rate : 1) * (this.profile.settings.rate || 1),
        voice: this.voice(),
      });
    },
    listenOnce() {
      const pack = this.targetPack();
      return PG.providers.asr.listenOnce(pack ? pack.bcp47 : 'en-US');
    },
    checkVoices() {
      if (!this.profile || !document.getElementById('view')) return;
      const pack = this.targetPack();
      if (!pack) return;
      const has = PG.providers.tts.hasVoiceFor(pack.langPrefixes);
      UI.banner('voice', has || !PG.providers.tts.ready ? null :
        '<span>🔊 ' + U.esc(PG.i18n.T('banner.voiceMissing', { lang: pack.name })) + '</span>');
    },
  };

  PG.app = app;
  document.addEventListener('DOMContentLoaded', () => app.init());
})();

/* ==== ui/screens-onboarding.js ==== */
/* ============================================================
   POLYGLOT AI — onboarding (v1.1)
   1. Interface language (the learner's own language — 10 locales)
   2. Learning language (Verified / Draft / Planned, clearly labelled)
   3. Name + avatar
   4. Optional picture placement check (learning language content)
   Then straight to Home. Interface stays in the learner's language;
   lesson content is always the learning language.
   ============================================================ */
(function () {
  'use strict';
  const PG = (globalThis.PG = globalThis.PG || {});
  const U = PG.util;
  const UI = PG.ui;
  const app = PG.app;

  const INTERFACE_LOCALES = [
    { code: 'en', name: 'English', flag: '🇬🇧' },
    { code: 'es', name: 'Español', flag: '🇪🇸' },
    { code: 'fr', name: 'Français', flag: '🇫🇷' },
    { code: 'de', name: 'Deutsch', flag: '🇩🇪' },
    { code: 'pt', name: 'Português', flag: '🇧🇷' },
    { code: 'it', name: 'Italiano', flag: '🇮🇹' },
    { code: 'ru', name: 'Русский', flag: '🇷🇺' },
    { code: 'ar', name: 'العربية', flag: '🇸🇦' },
    { code: 'zh', name: '中文', flag: '🇨🇳' },
    { code: 'ja', name: '日本語', flag: '🇯🇵' },
  ];

  const AVATARS = ['🙂', '😀', '😎', '🤓', '🧑', '👩', '🧔', '👨', '🦊', '🐼', '🐱', '🦉'];

  const PLACEMENT_IDS = ['water', 'coffee', 'bread', 'cat', 'sun', 'book', 'phone', 'money'];

  const onboarding = {
    /* ---- 1. interface language ---- */
    welcome(view) {
      app._native = app._native || 'en';
      app.top('', { hidden: true });
      const t = (k, v) => PG.i18n.TL(app._native, k, v);
      view.innerHTML =
        '<div class="onb">' +
        '<div class="onb-hero"><span class="logo" aria-hidden="true">🦜</span><h1>Polyglot AI</h1>' +
        '<p class="onb-tag">' + U.esc(t('onb.welcome')) + '</p></div>' +
        '<h2 class="onb-h">' + U.esc(t('onb.pickInterface')) + '</h2>' +
        '<p class="onb-sub">' + U.esc(t('onb.interfaceHint')) + '</p>' +
        '<div class="lang-grid">' +
        INTERFACE_LOCALES.filter((l) => PG.i18n.has(l.code)).map((l) =>
          '<button class="lang-card" data-native="' + l.code + '"' + (app._native === l.code ? ' style="border-color:var(--accent)"' : '') + '><span class="lang-flag">' + l.flag + '</span><span>' + U.esc(l.name) + '</span></button>').join('') +
        '</div>' +
        '<div class="onb-actions"><button class="btn xl" id="ob-next">→ ' + U.esc(t('common.continue')) + '</button></div>' +
        '<div class="onb-foot"><button class="btn ghost" id="ob-import">📂 ' + U.esc(t('onb.restore')) + '</button>' +
        '<input type="file" id="ob-file" accept="application/json" hidden></div>' +
        '</div>';

      UI.qsa('[data-native]', view).forEach((b) => b.addEventListener('click', () => {
        app._native = b.getAttribute('data-native');
        document.body.dir = PG.i18n.isRtl(app._native) ? 'rtl' : 'ltr';
        onboarding.welcome(view);
      }));
      UI.qs('#ob-next', view).addEventListener('click', () => onboarding.pickLearning(view));

      const fileBtn = UI.qs('#ob-import', view), fileIn = UI.qs('#ob-file', view);
      fileBtn.addEventListener('click', () => fileIn.click());
      fileIn.addEventListener('change', () => {
        const f = fileIn.files && fileIn.files[0];
        if (!f) return;
        const r = new FileReader();
        r.onload = () => {
          const res = PG.learner.deserialize(String(r.result));
          if (res.error) { UI.toast(PG.i18n.TL(app._native, 'onb.importFail')); return; }
          app.profile = res.profile;
          app.save();
          app.applyLang();
          app.go('home', null, { root: true });
          UI.toast(PG.i18n.TL(app._native, 'onb.restored'));
        };
        r.readAsText(f);
      });
    },

    /* ---- 2. learning language (status-labelled) ---- */
    pickLearning(view) {
      const t = (k, v) => PG.i18n.TL(app._native, k, v);
      const st = PG.content.statuses();
      const card = (p) => {
        const badge = p.status === 'verified'
          ? '<span class="badge verified">✓ ' + U.esc(t('you.verified')) + '</span>'
          : '<span class="badge draft">◐ ' + U.esc(t('you.draft')) + '</span>';
        return '<button class="lang-card' + (onboarding._target === p.code ? ' picked' : '') + '" data-target="' + p.code + '">' +
          '<span class="lang-flag">' + p.flag + '</span><span class="lang-name">' + U.esc(p.nativeName || p.name) + '</span>' + badge + '</button>';
      };
      view.innerHTML =
        '<div class="onb">' +
        '<h2 class="onb-h">' + U.esc(t('onb.pickLearning')) + '</h2>' +
        '<p class="onb-sub">' + U.esc(t('onb.learningHint')) + '</p>' +
        '<h3 class="onb-h3">✓ ' + U.esc(t('you.verified')) + ' <span class="muted">(' + st.verified.length + ')</span></h3>' +
        '<div class="lang-grid">' + st.verified.map(card).join('') + '</div>' +
        '<h3 class="onb-h3">◐ ' + U.esc(t('you.draft')) + ' <span class="muted">(' + st.draft.length + ')</span></h3>' +
        '<p class="onb-note">' + U.esc(t('onb.draftNote')) + '</p>' +
        '<div class="lang-grid draft-grid">' + st.draft.map(card).join('') + '</div>' +
        '<h3 class="onb-h3">○ ' + U.esc(t('you.planned')) + ' <span class="muted">(' + st.planned.length + ')</span></h3>' +
        '<div class="lang-grid planned-grid">' + st.planned.map((p) =>
          '<span class="lang-card planned"><span class="lang-flag">' + p.flag + '</span><span>' + U.esc(p.name) + '</span><span class="badge planned">○ ' + U.esc(t('you.planned')) + '</span></span>').join('') + '</div>' +
        '<div class="onb-actions">' +
        '<button class="btn ghost" id="ob-back">← ' + U.esc(t('common.back')) + '</button>' +
        '<button class="btn xl" id="ob-next"' + (onboarding._target ? '' : ' disabled') + '>→ ' + U.esc(t('common.continue')) + '</button></div>' +
        '</div>';

      UI.qsa('[data-target]', view).forEach((b) => b.addEventListener('click', () => {
        onboarding._target = b.getAttribute('data-target');
        onboarding.pickLearning(view);
      }));
      UI.qs('#ob-back', view).addEventListener('click', () => onboarding.welcome(view));
      UI.qs('#ob-next', view).addEventListener('click', () => {
        if (!onboarding._target) return;
        /* pre-create the profile so applyLang can theme from the target pack */
        app._profileDraft = PG.learner.newProfile(onboarding._target, app._native);
        onboarding.nameAvatar(view);
      });
    },

    /* ---- 3. name + avatar ---- */
    nameAvatar(view) {
      const t = (k, v) => PG.i18n.TL(app._native, k, v);
      const p = app._profileDraft;
      view.innerHTML =
        '<div class="onb">' +
        '<h2 class="onb-h">' + U.esc(t('onb.yourProfile')) + '</h2>' +
        '<p class="onb-sub">' + U.esc(t('onb.profileHint')) + '</p>' +
        '<input class="name-input" id="ob-name" type="text" maxlength="40" placeholder="' + U.esc(t('onb.namePlaceholder')) + '" value="' + U.esc(p.name || '') + '">' +
        '<div class="avatar-grid">' +
        AVATARS.map((a) => '<button class="avatar-btn' + (p.avatar === a ? ' picked' : '') + '" data-avatar="' + a + '" aria-label="' + a + '">' + a + '</button>').join('') +
        '</div>' +
        '<div class="onb-actions">' +
        '<button class="btn ghost" id="ob-back">← ' + U.esc(t('common.back')) + '</button>' +
        '<button class="btn xl" id="ob-next">→ ' + U.esc(t('common.continue')) + '</button></div>' +
        '</div>';

      UI.qs('#ob-name', view).addEventListener('input', (e) => { p.name = e.target.value.slice(0, 40); });
      UI.qsa('[data-avatar]', view).forEach((b) => b.addEventListener('click', () => {
        p.avatar = b.getAttribute('data-avatar');
        onboarding.nameAvatar(view);
        const inp = UI.qs('#ob-name', view);
        inp.value = p.name || '';
        inp.focus();
      }));
      UI.qs('#ob-back', view).addEventListener('click', () => onboarding.pickLearning(view));
      UI.qs('#ob-next', view).addEventListener('click', () => {
        onboarding.placement(view, 0);
      });
    },

    /* ---- 4. placement check (learning-language content) ---- */
    placement(view, idx) {
      const t = (k, v) => PG.i18n.TL(app._native, k, v);
      const code = onboarding._target;
      const pack = PG.content.pack(code);
      const profile = app._profileDraft;
      const isJa = !!(pack && pack.romaji);

      if (idx === 0 && isJa) {
        /* romaji question first for languages with a romanisation */
        view.innerHTML =
          '<div class="onb center">' +
          '<h2 class="onb-h">' + U.esc(t('onb.script.title')) + '</h2>' +
          '<p class="onb-sub">' + U.esc(t('onb.script.body')) + '</p>' +
          '<div class="script-demo"><div class="kana" dir="' + (pack.rtl ? 'rtl' : 'ltr') + '">みず</div><div class="roma">mizu</div></div>' +
          '<div class="onb-actions">' +
          '<button class="btn" id="sc-on">' + U.esc(t('onb.script.both')) + '</button>' +
          '<button class="btn ghost" id="sc-off">' + U.esc(t('onb.script.native')) + '</button></div></div>';
        UI.qs('#sc-on', view).addEventListener('click', () => { profile.settings.romaji = true; onboarding.placement(view, 0); });
        UI.qs('#sc-off', view).addEventListener('click', () => { profile.settings.romaji = false; onboarding.placement(view, 0); });
        return;
      }

      if (idx >= PLACEMENT_IDS.length) { onboarding.finish(view); return; }
      const item = PG.content.item(code, PLACEMENT_IDS[idx]);
      if (!item) { onboarding.finish(view); return; }

      const opts = PG.input.options(profile, code, item.id, 4, { maxNew: 2 }).map((id) => ({ it: id }));
      const okIdx = opts.findIndex((o) => o.it === item.id);

      view.innerHTML =
        '<div class="onb run-wrap">' +
        '<p class="run-progress">' + (idx + 1) + ' / ' + PLACEMENT_IDS.length + '</p>' +
        '<h2 class="onb-h">' + U.esc(t('onb.placement.body')) + '</h2>' +
        '<div class="say-line" dir="' + (pack.rtl ? 'rtl' : 'ltr') + '"><button class="round-btn" id="pl-play" aria-label="' + U.esc(t('common.listen')) + '">🔊</button>' +
        '<span class="say-text">' + U.esc(item.t) + (item.r && profile.settings.romaji ? ' <span class="roma">(' + U.esc(item.r) + ')</span>' : '') + '</span></div>' +
        '<div class="opt-grid" id="pl-opts">' +
        opts.map((o, i) => {
          const it = PG.content.item(code, o.it);
          return UI.optBtn({ img: it.img, t: it.t, sub: it.r && profile.settings.romaji ? it.r : '' }, i);
        }).join('') + '</div>' +
        '<button class="btn ghost" id="pl-skip">' + U.esc(t('onb.placement.skip')) + '</button></div>';

      const play = () => PG.providers.tts.speak(item.t, { lang: pack.bcp47, rate: 0.85 });
      UI.qs('#pl-play', view).addEventListener('click', play);
      setTimeout(play, 350);

      UI.qsa('#pl-opts .opt', view).forEach((b) => b.addEventListener('click', () => {
        PG.check.run(profile, code, {
          opts, ok: okIdx, k: 'recognition', ctx: 'placement',
          dims: ['listening', 'vocab'], modality: 'interact',
        }, { idx: parseInt(b.getAttribute('data-idx'), 10), supportUsed: true });
        onboarding.placement(view, idx + 1);
      }));
      UI.qs('#pl-skip', view).addEventListener('click', () => onboarding.placement(view, PLACEMENT_IDS.length));
    },

    /* ---- done ---- */
    finish(view) {
      const t = (k, v) => PG.i18n.TL(app._native, k, v);
      const pack = PG.content.pack(onboarding._target);
      app.profile = app._profileDraft;
      delete app._profileDraft;
      app.save();
      app.applyLang();
      app.go('home', null, { root: true });
      UI.toast(t('home.welcomeToast', { lang: pack.nativeName || pack.name }));
    },
  };

  app.screens.onboarding = onboarding.welcome;
})();

/* ==== ui/screens-home.js ==== */
/* ============================================================
   POLYGLOT AI — Home tab (v1.1, interface language)
   Greeting + avatar + streak, notifications bell with badge, daily
   goals (insight · lesson · activity), insight of the day, current
   lesson card with Start, and activity shortcuts.
   ============================================================ */
(function () {
  'use strict';
  const PG = (globalThis.PG = globalThis.PG || {});
  const U = PG.util;
  const UI = PG.ui;
  const app = PG.app;
  const T = (k, v) => PG.i18n.T(k, v);

  const INSIGHT_COUNT = 8;

  function greetingKey() {
    const h = new Date().getHours();
    if (h < 6) return 'home.greet.night';
    if (h < 12) return 'home.greet.morning';
    if (h < 19) return 'home.greet.afternoon';
    return 'home.greet.evening';
  }

  function notifications(profile) {
    const list = [];
    const due = PG.progression.dueCount(profile);
    if (due > 0) list.push({ icon: '🔁', text: T('home.notif.due', { n: due }), action: 'review' });
    const next = PG.lessons.firstIncomplete(profile);
    if (next) list.push({ icon: '🎓', text: T('home.notif.lesson', { lesson: T(next.key) }), action: 'lessonRun', params: { id: next.id } });
    const goals = PG.learner.goalState(profile);
    const left = 3 - PG.learner.goalsDone(profile);
    if (left > 0) list.push({ icon: '🎯', text: T('home.notif.goals', { n: left }), action: null });
    else list.push({ icon: '🏆', text: T('home.goalsAll'), action: null });
    return list;
  }

  app.screens.home = function (view) {
    const profile = app.profile;
    const pack = app.targetPack();
    const goals = PG.learner.goalState(profile);
    const next = PG.lessons.firstIncomplete(profile);
    const prog = PG.progression.compute(profile);
    const notifs = notifications(profile);
    const unseenNotifs = profile.notifications.seenDay !== goals.day ? notifs.length : 0;

    const goalRow = (icon, label, done) =>
      '<div class="goal' + (done ? ' done' : '') + '"><span class="goal-ico">' + icon + '</span>' +
      '<span class="goal-lbl">' + U.esc(label) + '</span>' +
      '<span class="goal-mark">' + (done ? '✅' : '⬜') + '</span></div>';

    const statusBadge = pack.status === 'verified'
      ? '<span class="badge verified">✓ ' + U.esc(T('you.verified')) + '</span>'
      : '<span class="badge draft">◐ ' + U.esc(T('you.draft')) + '</span>';

    const insightIdx = (goals.day % INSIGHT_COUNT) + 1;

    view.innerHTML =
      '<div class="home">' +
      '<section class="home-head">' +
      '<div class="home-id"><span class="home-avatar" aria-hidden="true">' + U.esc(profile.avatar || '🙂') + '</span>' +
      '<div><div class="home-hi">' + U.esc(T(greetingKey())) + (profile.name ? ', ' + U.esc(profile.name) : '') + '</div>' +
      '<div class="home-lang">🎓 ' + U.esc(pack.nativeName || pack.name) + ' ' + statusBadge + '</div></div></div>' +
      '<div class="home-chips">' +
      '<span class="chip">🔥 ' + (profile.streak || 0) + '</span>' +
      '<button class="bell' + (unseenNotifs ? ' has-badge' : '') + '" id="bell" aria-label="' + U.esc(T('home.notifications')) + '">🔔' +
      (unseenNotifs ? '<span class="badge-dot">' + unseenNotifs + '</span>' : '') + '</button></div>' +
      '</section>' +

      '<section class="panel goals-panel">' +
      '<h3>🎯 ' + U.esc(T('home.goals')) + '</h3>' +
      goalRow('💡', T('home.goalInsight'), goals.insight) +
      goalRow('🎓', T('home.goalLesson'), goals.lesson) +
      goalRow('🎯', T('home.goalActivity'), goals.activity) +
      '</section>' +

      '<section class="panel insight-card">' +
      '<h3>💡 ' + U.esc(T('home.insightTitle')) + '</h3>' +
      '<p class="insight-text">' + U.esc(T('insight.' + insightIdx)) + '</p>' +
      (goals.insight ? '' : '<button class="btn ghost" id="insight-ok">✅ ' + U.esc(T('home.insightRead')) + '</button>') +
      '</section>' +

      (next
        ? '<section class="rec-card" id="current-lesson">' +
        '<div class="rec-head"><span class="rec-emoji">🎓</span>' +
        '<div><div class="rec-kicker">' + U.esc(T('home.currentLesson')) + ' · ' + U.esc(T('lessons.levelN', { n: next.levelIdx + 1 })) + '</div>' +
        '<div class="rec-title">' + U.esc(T(next.key)) + '</div>' +
        (next.breakthrough ? '<div class="rec-why">⭐ ' + U.esc(T('lessons.breakthrough')) + '</div>' : '') + '</div></div>' +
        '<button class="btn xl" id="lesson-start">▶ ' + U.esc(T('home.startLesson')) + '</button></section>'
        : '<section class="rec-card" id="current-lesson">' +
        '<div class="rec-head"><span class="rec-emoji">🏆</span>' +
        '<div><div class="rec-kicker">' + U.esc(T('lessons.allDone')) + '</div>' +
        '<div class="rec-title">' + U.esc(T('lessons.allDoneSub')) + '</div></div></div>' +
        '<button class="btn xl" id="lesson-start">🔁 ' + U.esc(T('tab.review')) + '</button></section>') +

      '<section class="panel">' +
      '<h3>🎯 ' + U.esc(T('home.explore')) + '</h3>' +
      '<div class="shortcut-row">' + PG.activities.DEFS.map((def) => {
        const open = PG.activities.status(profile, def, pack).open;
        return '<button class="shortcut' + (open ? '' : ' off') + '" data-act="' + def.id + '" aria-label="' + U.esc(T(def.titleKey)) + '">' +
          def.icon + '<span>' + U.esc(T(def.titleKey)) + '</span></button>';
      }).join('') + '</div>' +
      '<p class="panel-note">💡 ' + U.esc(T(prog.recommend.reasonKey, { dim: T('dims.' + prog.recommend.focusDim) })) + '</p>' +
      '</section>' +
      '</div>';

    /* bell + notifications sheet */
    UI.qs('#bell', view).addEventListener('click', () => {
      profile.notifications.seenDay = goals.day;
      app.save();
      app.openSheet(
        '<h3 class="sheet-title">🔔 ' + U.esc(T('home.notifications')) + '</h3>' +
        (notifs.length ? notifs.map((n) => '<div class="notif-row"><span>' + n.icon + '</span><span>' + U.esc(n.text) + '</span></div>').join('') : '<p class="panel-note">' + U.esc(T('home.noNotifications')) + '</p>'),
        (body) => {
          UI.qsa('.notif-row', body).forEach(() => { /* rows are informational */ });
        }
      );
      const btn = UI.qs('#bell', view);
      btn.classList.remove('has-badge');
      const dot = UI.qs('.badge-dot', btn);
      if (dot) dot.remove();
    });

    /* insight goal */
    const insightBtn = UI.qs('#insight-ok', view);
    if (insightBtn) insightBtn.addEventListener('click', () => {
      PG.learner.touchGoal(profile, 'insight');
      app.save();
      app.screens.home(view);
    });

    /* current lesson */
    UI.qs('#lesson-start', view).addEventListener('click', () => {
      if (next) app.go('lessonRun', { id: next.id });
      else app.go('review', null, { root: true });
    });

    /* shortcuts */
    UI.qsa('[data-act]', view).forEach((b) => b.addEventListener('click', () => {
      const def = PG.activities.DEFS.find((d) => d.id === b.getAttribute('data-act'));
      if (!def) return;
      const status = PG.activities.status(profile, def, pack);
      if (!status.open) { app.go('activities'); return; }
      const route = { sounds: 'soundsRun', vocab: 'vocabRun', numbers: 'numbersRun', ear: 'earRun', scenarios: 'scenarios', stories: 'stories', reading: 'readings', speak: 'speakRun' }[def.kind];
      if (route) app.go(route);
    }));
  };
})();

/* ==== ui/screens-lessons.js ==== */
/* ============================================================
   POLYGLOT AI — Lessons tab + lesson run (v1.1)
   Levels with themes and progress bars, ordered lessons with
   completion marks and locks (replay allowed). The lesson run is
   scene-based learning-language content with picture checks;
   chrome and instructions stay in the interface language.
   ============================================================ */
(function () {
  'use strict';
  const PG = (globalThis.PG = globalThis.PG || {});
  const U = PG.util;
  const UI = PG.ui;
  const app = PG.app;
  const T = (k, v) => PG.i18n.T(k, v);   // interface
  const L = (k, v) => PG.i18n.L(k, v);   // learning language (feedback)

  function lockOptions(root) {
    UI.qsa('.opt, .scene-tile', root).forEach((b) => { b.disabled = true; });
  }

  /* ============================ LESSONS TAB ============================ */
  app.screens.lessons = function (view) {
    const profile = app.profile;
    app.top(T('tab.lessons'), { back: false });

    view.innerHTML = '<div class="pad lessons-list">' +
      PG.lessons.LEVELS.map((lv, li) => {
        const p = PG.lessons.levelProgress(profile, li);
        const pct = Math.round(p.pct * 100);
        return '<div class="level-block">' +
          '<div class="level-head"><span class="level-num">' + (li + 1) + '</span>' +
          '<div class="level-title"><h3>' + U.esc(T(lv.themeKey)) + '</h3>' +
          '<div class="level-bar"><span style="width:' + pct + '%"></span></div>' +
          '<span class="level-count">' + p.done + ' / ' + p.total + '</span></div></div>' +
          lv.lessons.map((l, i) => {
            const done = !!PG.learner.actsFor(profile).lessons[l.id];
            const unlocked = PG.lessons.isUnlocked(profile, l.id);
            const icon = done ? '✅' : unlocked ? '▶' : '🔒';
            return '<button class="card lesson-card' + (l.breakthrough ? ' breakthrough' : '') + (unlocked ? '' : ' locked') + '" data-lesson="' + l.id + '">' +
              '<span class="lesson-state">' + icon + '</span>' +
              '<span class="card-body"><span class="card-title">' + (li + 1) + '.' + (i + 1) + ' ' + U.esc(T(l.key)) + (l.breakthrough ? ' ⭐' : '') + '</span>' +
              '<span class="card-sub">' + (done ? U.esc(T('lessons.completed')) : unlocked ? U.esc(T('lessons.start')) : U.esc(T('lessons.locked'))) + '</span></span>' +
              '</button>';
          }).join('') + '</div>';
      }).join('') + '</div>';

    UI.qsa('[data-lesson]', view).forEach((b) => b.addEventListener('click', () => {
      const id = b.getAttribute('data-lesson');
      if (!PG.lessons.isUnlocked(profile, id)) {
        UI.toast(T('lessons.lockedHint'));
        return;
      }
      app.go('lessonRun', { id });
    }));
  };

  /* ============================ LESSON RUN ============================ */
  app.screens.lessonRun = function (view, params) {
    const profile = app.profile, code = profile.target;
    const st = PG.eng.lesson.start(profile, code, params.id);
    const pack = PG.content.pack(code);

    const romajiOn = (it) => !!(profile.settings.romaji && it && it.r);
    const dir = pack && pack.rtl ? 'rtl' : 'ltr';

    const draw = () => {
      const v = PG.eng.lesson.present(st, profile);
      if (v.type === 'summary') {
        app.top(T(st.def.key), { back: true });
        const body =
          '<div class="word-grid">' + v.summary.newItems.map((it) =>
            '<div class="word-card"><span class="w-img">' + U.esc(it.img || '💬') + '</span>' +
            '<span class="w-t" dir="' + dir + '">' + U.esc(it.t) + '</span>' +
            (romajiOn(it) ? '<span class="w-sub">' + U.esc(it.r) + '</span>' : '') + '</div>').join('') + '</div>' +
          (v.summary.freeResponse ? '<p class="sum-note" dir="' + dir + '">💬 ' + U.esc(v.summary.freeResponse) + '</p>' : '');
        view.innerHTML =
          '<div class="run-wrap summary">' +
          '<div class="sum-emoji">' + (v.summary.score >= 0.7 ? '🎉' : '🌱') + '</div>' +
          '<h2 class="onb-h">' + U.esc(T('lessons.doneTitle')) + '</h2>' +
          '<div class="sum-stats">' +
          '<div class="stat"><span class="stat-v">' + Math.round(v.summary.score * 100) + '%</span><span class="stat-l">' + U.esc(T('scn.summary.accuracy')) + '</span></div>' +
          '<div class="stat"><span class="stat-v">' + v.summary.newItems.length + '</span><span class="stat-l">' + U.esc(T('scn.summary.newWords')) + '</span></div>' +
          '</div>' + body +
          '<div class="onb-actions"><button class="btn" id="lr-again">🔁 ' + U.esc(T('summary.again')) + '</button>' +
          '<button class="btn ghost" id="lr-next">→ ' + U.esc(T('lessons.next')) + '</button></div></div>';
        UI.qs('#lr-again', view).addEventListener('click', () => app.go('lessonRun', { id: st.def.id }));
        UI.qs('#lr-next', view).addEventListener('click', () => {
          const nxt = PG.lessons.firstIncomplete(profile);
          if (nxt) app.go('lessonRun', { id: nxt.id });
          else app.go('lessons', null, { root: true });
        });
        return;
      }

      app.top(T(st.def.key), { back: true });

      /* exposure card */
      if (v.type === 'expose') {
        view.innerHTML =
          '<div class="run-wrap">' +
          UI.dots(v.idx, v.total) +
          '<p class="check-prompt">' + U.esc(T('lr.look')) + '</p>' +
          '<div class="expose-card" dir="' + dir + '">' +
          '<span class="expose-img" aria-hidden="true">' + U.esc(v.item.img) + '</span>' +
          '<span class="expose-word">' + U.esc(v.item.t) + '</span>' +
          (v.romaji ? '<span class="roma">' + U.esc(v.item.r) + '</span>' : '') + '</div>' +
          '<div class="onb-actions"><button class="btn xl" id="lx-next">→ ' + U.esc(T('common.continue')) + '</button></div></div>';
        app.say(v.item.t, { rate: v.rate });
        UI.qs('#lx-next', view).addEventListener('click', () => {
          PG.eng.lesson.respond(st, profile, { advance: true });
          app.save();
          draw();
        });
        return;
      }

      /* picture check */
      if (v.type === 'check') {
        view.innerHTML =
          '<div class="run-wrap">' +
          UI.dots(v.idx, v.total) +
          '<p class="check-prompt">' + U.esc(v.support ? T('lr.choosePicSlow') : T('lr.choosePic')) + '</p>' +
          '<div class="opt-grid" id="opts">' +
          v.options.map((o, i) => {
            const it = PG.content.item(code, o.it);
            return UI.optBtn({ img: it.img, t: it.t, sub: profile.settings.romaji && it.r && !v.support ? it.r : '' }, i);
          }).join('') + '</div></div>';
        app.say(v.item.t, { rate: v.rate });
        UI.qsa('#opts .opt', view).forEach((b) => b.addEventListener('click', () => {
          lockOptions(view);
          PG.eng.lesson.respond(st, profile, { idx: parseInt(b.getAttribute('data-idx'), 10) });
          app.save();
          const kind = st.lastOutcome === 'ok' ? 'ok' : st.lastOutcome === 'support' ? 'ok-support' : 'no';
          UI.flash(kind === 'no' ? 'no' : 'ok', U.choice(kind === 'no' ? [L('fb.tryAgain1'), L('fb.tryAgain2')] : [L('fb.perfect1'), L('fb.good1')]));
          setTimeout(draw, kind === 'no' ? 900 : 650);
        }));
        return;
      }

      /* scene tableau: tap what you hear */
      if (v.type === 'scene') {
        view.innerHTML =
          '<div class="run-wrap">' +
          UI.dots(v.idx, v.total) +
          '<p class="check-prompt">' + U.esc(T('lr.tapScene')) + '</p>' +
          '<div class="scene-tableau">' +
          v.tableau.map((o, i) => {
            const it = PG.content.item(code, o.it);
            return '<button class="scene-tile" data-idx="' + i + '" aria-label="' + i + '"><span class="tile-emoji">' + U.esc(it.img || '💬') + '</span></button>';
          }).join('') + '</div>' +
          '<div class="listen-zone"><button class="big-play" id="sc-play" aria-label="' + U.esc(T('listen.play')) + '">🔊</button></div>' +
          '</div>';
        const play = () => app.say(v.sayText, { rate: v.rate });
        UI.qs('#sc-play', view).addEventListener('click', play);
        play();
        UI.qsa('.scene-tile', view).forEach((b) => b.addEventListener('click', () => {
          lockOptions(view);
          PG.eng.lesson.respond(st, profile, { idx: parseInt(b.getAttribute('data-idx'), 10) });
          app.save();
          const kind = st.lastOutcome === 'ok' ? 'ok' : st.lastOutcome === 'support' ? 'ok-support' : 'no';
          UI.flash(kind === 'no' ? 'no' : 'ok', U.choice(kind === 'no' ? [L('fb.tryAgain1')] : [L('fb.perfect1'), L('fb.perfect2')]));
          setTimeout(draw, kind === 'no' ? 900 : 650);
        }));
        return;
      }

      /* production step */
      if (v.type === 'say') {
        view.innerHTML =
          '<div class="run-wrap">' +
          UI.dots(v.idx, v.total) +
          '<p class="check-prompt">🎤 ' + U.esc(T('lr.sayIt')) + '</p>' +
          '<div class="word-hero"><span class="w-img">' + U.esc(v.item.img || '💬') + '</span></div>' +
          '<div class="say-line"><button class="round-btn" id="ls-play" aria-label="' + U.esc(T('common.listen')) + '">🔊</button>' +
          '<span class="say-text" dir="' + dir + '">' + U.esc(v.item.t) + (v.romaji ? ' <span class="roma">(' + U.esc(v.item.r) + ')</span>' : '') + '</span></div>' +
          /* the mic is an enhancement, never a requirement: self-assessment is
             always available so a blocked/unavailable microphone can never
             dead-end a lesson (same fix as the speaking and review runs) */
          (v.asr
            ? '<div class="mic-zone"><button class="mic-btn" id="mic" aria-label="' + U.esc(T('speak.mic')) + '">🎤</button><p class="mic-hint">' + U.esc(T('speak.micHint')) + '</p></div>'
            : '') +
          '<div class="self-fallback"><p class="mic-hint">' + U.esc(T('speak.selfHint')) + '</p>' +
            '<button class="btn" data-self="easy">😄 ' + U.esc(T('speak.self.easy')) + '</button>' +
            '<button class="btn" data-self="ok">🙂 ' + U.esc(T('speak.self.ok')) + '</button>' +
            '<button class="btn ghost" data-self="hard">😵 ' + U.esc(T('speak.self.hard')) + '</button></div>' +
          '</div>';
        const play = () => app.say(v.item.t, { rate: v.rate * 0.9 });
        UI.qs('#ls-play', view).addEventListener('click', play);
        play();
        const mic = UI.qs('#mic', view);
        if (mic) mic.addEventListener('click', async () => {
          mic.classList.add('listening'); mic.textContent = '👂';
          const res = await app.listenOnce();
          mic.classList.remove('listening'); mic.textContent = '🎤';
          if (res.error) { UI.toast(T('speak.micError')); return; }
          PG.eng.lesson.respond(st, profile, { said: res.transcript });
          app.save();
          const kind = st.lastOutcome === 'ok' ? 'ok' : st.lastOutcome === 'support' ? 'ok-support' : 'no';
          UI.flash(kind === 'no' ? 'no' : 'ok', kind === 'no' ? L('speak.fb.practice') : U.choice([L('speak.fb.great'), L('speak.fb.close')]));
          setTimeout(draw, kind === 'no' ? 1000 : 700);
        });
        UI.qsa('[data-self]', view).forEach((b) => b.addEventListener('click', () => {
          PG.eng.lesson.respond(st, profile, { self: b.getAttribute('data-self') });
          app.save();
          draw();
        }));
        return;
      }

      /* breakthrough free choice */
      if (v.type === 'free') {
        view.innerHTML =
          '<div class="run-wrap">' +
          UI.dots(v.idx, v.total) +
          '<p class="check-prompt">' + U.esc(T('lr.meet')) + '</p>' +
          '<div class="char-line"><span class="avatar big">' + v.charIcon + '</span></div>' +
          '<div class="opt-grid" id="opts">' +
          v.options.map((o, i) => {
            const it = PG.content.item(code, o.it);
            return UI.optBtn({ img: it.img || '💬', t: it.t }, i);
          }).join('') + '</div></div>';
        UI.qsa('#opts .opt', view).forEach((b) => b.addEventListener('click', () => {
          lockOptions(view);
          const idx = parseInt(b.getAttribute('data-idx'), 10);
          const it = PG.content.item(code, v.options[idx].it);
          PG.eng.lesson.respond(st, profile, { idx });
          app.save();
          UI.flash('ok', it ? it.t : '');
          setTimeout(draw, 900);
        }));
      }
    };

    draw();
  };
})();

/* ==== ui/screens-activities.js ==== */
/* ============================================================
   POLYGLOT AI — Activities tab + scenario/story/reading screens
   (v1.1)
   The Activities tab shows the personalised recommendation with
   its reason, then the eight activity cards with progress/status;
   locked cards explain exactly how to unlock them.
   ============================================================ */
(function () {
  'use strict';
  const PG = (globalThis.PG = globalThis.PG || {});
  const U = PG.util;
  const UI = PG.ui;
  const app = PG.app;
  const T = (k, v) => PG.i18n.T(k, v);   // interface language
  const L = (k, v) => PG.i18n.L(k, v);   // learning language (feedback)

  /* shared helpers */
  function lockOptions(root) {
    UI.qsa('.opt, .order-card', root).forEach((b) => { b.disabled = true; });
  }
  function feedbackFlash(kind, support) {
    const msgs = kind === 'ok' ? [L('fb.perfect1'), L('fb.perfect2'), L('fb.perfect3')] : kind === 'ok-support' ? [L('fb.good1'), L('fb.good2')] : [L('fb.tryAgain1'), L('fb.tryAgain2')];
    UI.flash(kind === 'no' ? 'no' : 'ok', U.choice(msgs) + (support ? ' 🐢' : ''));
  }
  function optItem(code, o) {
    if (o.it) {
      const it = PG.content.item(code, o.it);
      if (!it) return { t: '' };
      return { img: it.img, t: it.t, sub: app.profile.settings.romaji && it.r ? it.r : '' };
    }
    if (o.sc) return { sc: o.sc };
    return { t: o.t || '' };
  }
  function sayRow(text, id, rate) {
    return '<div class="say-line"><button class="round-btn" data-say="' + U.esc(id) + '" aria-label="' + U.esc(T('common.listen')) + '">🔊</button>' +
      '<button class="round-btn sm" data-slow="' + U.esc(id) + '" aria-label="' + U.esc(T('common.slower')) + '">🐢</button>' +
      '<span class="say-text" dir="' + app.targetDir() + '">' + U.esc(text) + '</span></div>';
  }
  function wireSay(view, text, rate) {
    UI.qsa('[data-say]', view).forEach((b) => b.addEventListener('click', () => app.say(text, { rate: rate || 1 })));
    UI.qsa('[data-slow]', view).forEach((b) => b.addEventListener('click', () => app.say(text, { rate: (rate || 1) * 0.72 })));
  }
  function summaryView(s, body, title) {
    return '<div class="run-wrap summary">' +
      '<div class="sum-emoji" aria-hidden="true">' + (s.accuracy >= 0.7 ? '🎉' : '🌱') + '</div>' +
      '<h2 class="onb-h">' + U.esc(title || T('scn.summary.title')) + '</h2>' +
      '<div class="sum-stats">' +
      '<div class="stat"><span class="stat-v">' + Math.round(s.accuracy * 100) + '%</span><span class="stat-l">' + U.esc(T('scn.summary.accuracy')) + '</span></div>' +
      (s.total != null ? '<div class="stat"><span class="stat-v">' + s.total + '</span><span class="stat-l">' + U.esc(T('scn.summary.rounds')) + '</span></div>' : '') +
      '</div>' + body +
      '<div class="onb-actions"><button class="btn" data-again>🔁 ' + U.esc(T('summary.again')) + '</button>' +
      '<button class="btn ghost" data-home>🏠 ' + U.esc(T('summary.home')) + '</button></div></div>';
  }
  function wireSummary(view, again) {
    UI.qs('[data-again]', view).addEventListener('click', again);
    UI.qs('[data-home]', view).addEventListener('click', () => app.go('home', null, { root: true }));
  }

  /* ============================ ACTIVITIES TAB ============================ */
  app.screens.activities = function (view) {
    const profile = app.profile, pack = app.targetPack();
    const prog = PG.progression.compute(profile);
    app.top(T('tab.activities'), { back: false });

    const ROUTES = { sounds: 'soundsRun', vocab: 'vocabRun', numbers: 'numbersRun', ear: 'earRun', scenarios: 'scenarios', story: 'stories', reading: 'readings', speak: 'speakRun' };

    /* recommendation */
    const rec = prog.recommend;
    const recIcon = { lessons: '🎓', review: '🔁' }[rec.activity] ||
      (PG.activities.DEFS.find((d) => d.id === rec.activity) || {}).icon || '🎯';
    const recTitle = rec.activity === 'lessons'
      ? (PG.lessons.firstIncomplete(profile) ? T(PG.lessons.firstIncomplete(profile).key) : T('tab.lessons'))
      : rec.activity === 'review' ? T('tab.review')
      : T((PG.activities.DEFS.find((d) => d.id === rec.activity) || { titleKey: 'tab.activities' }).titleKey);
    const recGo = rec.activity === 'lessons'
      ? () => app.go('lessonRun', { id: PG.lessons.firstIncomplete(profile).id })
      : rec.activity === 'review' ? () => app.go('review', null, { root: true })
      : () => app.go(ROUTES[rec.activity] || 'activities');

    view.innerHTML = '<div class="pad list">' +
      '<section class="rec-card">' +
      '<div class="rec-head"><span class="rec-emoji">' + recIcon + '</span>' +
      '<div><div class="rec-kicker">' + U.esc(T('home.recommended')) + '</div>' +
      '<div class="rec-title">' + U.esc(recTitle) + '</div>' +
      '<div class="rec-why">💡 ' + U.esc(T(rec.reasonKey, { dim: T('dims.' + rec.focusDim) })) + '</div></div></div>' +
      '<button class="btn xl" id="rec-go">▶ ' + U.esc(T('common.start')) + '</button></section>' +

      (pack.status === 'draft'
        ? '<section class="panel draft-banner"><h3>◐ ' + U.esc(pack.nativeName || pack.name) + ' — ' + U.esc(T('you.draft')) + '</h3>' +
        '<p class="panel-note">' + U.esc(T('act.draftBanner')) + '</p></section>'
        : '') +

      PG.activities.DEFS.map((def) => {
        const status = PG.activities.status(profile, def, pack);
        let sub;
        if (status.open) {
          sub = T(def.subKey);
        } else if (status.reason === 'lesson') {
          const ld = PG.lessons.byId(status.lessonId);
          sub = T('act.lockedLesson', { lesson: ld ? T(ld.key) : '' });
        } else if (status.reason === 'notVerified') {
          sub = T('act.lockedVerified');
        } else if (status.reason === 'noSounds') {
          sub = T('act.lockedSounds');
        } else if (status.reason === 'subscription') {
          sub = T('act.lockedSub');
        } else sub = '';
        return UI.card({
          act: def.id, icon: def.icon, title: T(def.titleKey), sub,
          locked: !status.open,
          badge: status.open ? '▶' : '🔒',
        });
      }).join('') + '</div>';

    UI.qs('#rec-go', view).addEventListener('click', recGo);
    UI.qsa('.card[data-act]', view).forEach((c) => c.addEventListener('click', () => {
      const def = PG.activities.DEFS.find((d) => d.id === c.getAttribute('data-act'));
      if (!def) return;
      const status = PG.activities.status(profile, def, pack);
      if (!status.open) {
        /* locked cards explain how to unlock, they are not dead ends */
        if (status.reason === 'lesson' && status.lessonId) { app.go('lessonRun', { id: status.lessonId }); return; }
        UI.toast(c.querySelector('.card-sub') ? c.querySelector('.card-sub').textContent : T('lessons.lockedHint'));
        return;
      }
      app.go(ROUTES[def.kind] || 'activities');
    }));
  };

  /* ============================ SCENARIO LIST ============================ */
  app.screens.scenarios = function (view) {
    const profile = app.profile, pack = app.targetPack();
    app.top(T('act.scenarios'), { back: true });
    view.innerHTML = '<div class="pad list">' +
      '<p class="list-sub">' + U.esc(T('play.subtitle')) + '</p>' +
      pack.scenarios.map((sc) => {
        const done = PG.learner.actsFor(profile).scn[sc.id] || 0;
        return UI.card({
          act: 'scn:' + sc.id, icon: sc.icon, title: sc.title, sub: sc.setting,
          badge: done ? T('play.times', { n: done }) : T('play.new'),
        });
      }).join('') + '</div>';
    UI.qsa('.card[data-act]', view).forEach((c) => c.addEventListener('click', () => {
      app.go('scn', { id: c.getAttribute('data-act').split(':')[1] });
    }));
  };

  /* ============================ SCENARIO RUN ============================ */
  app.screens.scn = function (view, params) {
    const profile = app.profile, code = profile.target;
    const st = PG.eng.scenario.start(profile, code, params.id);
    let lastSpoken = null;

    const draw = () => {
      const v = PG.eng.scenario.present(st, profile);
      if (v.type === 'summary') {
        app.top(st.sc.title, { back: true });
        const body =
          '<h3 class="sum-h">' + U.esc(T('scn.summary.newWords')) + '</h3>' +
          '<div class="word-grid">' +
          v.summary.newItems.map((it) =>
            '<div class="word-card"><span class="w-img">' + U.esc(it.img || '💬') + '</span><span class="w-t" dir="' + app.targetDir() + '">' + U.esc(it.t) + '</span>' +
            (it.r && profile.settings.romaji ? '<span class="w-sub">' + U.esc(it.r) + '</span>' : '') + '</div>').join('') +
          '</div>' +
          (v.summary.dueReviewed ? '<p class="sum-note">🔁 ' + U.esc(T('scn.summary.dueReviewed', { n: v.summary.dueReviewed })) + '</p>' : '');
        view.innerHTML = summaryView(v.summary, body);
        wireSummary(view, () => app.go('scn', { id: st.sc.id }, { root: false }));
        return;
      }

      app.top(st.sc.title, { back: true });
      if (v.type === 'after') {
        view.innerHTML =
          '<div class="run-wrap">' +
          '<div class="scene-banner" aria-hidden="true">' + U.esc(v.scene) + '</div>' +
          UI.dots(Math.max(0, v.idx - 1), v.total) +
          '<div class="char-line"><span class="avatar" aria-hidden="true">✨</span>' +
          '<div class="bubble" dir="' + app.targetDir() + '">' + U.esc(v.text) + '</div></div>' +
          '<div class="advance"><button class="btn xl" id="adv">→</button></div></div>';
        app.say(v.text);
        UI.qs('#adv', view).addEventListener('click', () => {
          PG.eng.scenario.respond(st, profile, { advance: true });
          app.save();
          draw();
        });
        return;
      }
      const optsHtml = v.options.map((o, i) => UI.optBtn(optItem(code, o), i, { small: v.options.length > 4 })).join('');
      view.innerHTML =
        '<div class="run-wrap">' +
        '<div class="scene-banner" aria-hidden="true">' + U.esc(v.scene) + '</div>' +
        UI.dots(v.idx, v.total) +
        '<div class="char-line"><span class="avatar" aria-hidden="true">' + U.esc(v.who ? v.who.icon : '🙂') + '</span>' +
        '<div class="bubble">' + sayRow(v.sayText, 'say', v.support ? 0.82 : 1) + '</div></div>' +
        (v.map ? mapView(v.map) : '') +
        (v.spoken
          ? '<div class="mic-zone"><button class="mic-btn" id="mic" aria-label="' + U.esc(T('speak.mic')) + '">🎤</button><p class="mic-hint">' + U.esc(T('speak.micHint')) + '</p></div>'
          : '<div class="opt-grid" id="opts">' + optsHtml + '</div>') +
        '</div>';

      wireSay(view, v.sayText, v.support ? 0.82 : 1);
      if (v.sayText !== lastSpoken) { lastSpoken = v.sayText; app.say(v.sayText, { rate: v.support ? 0.82 : 1 }); }

      if (v.spoken) {
        UI.qs('#mic', view).addEventListener('click', async () => {
          const btn = UI.qs('#mic', view);
          btn.classList.add('listening');
          btn.textContent = '…';
          const res = await app.listenOnce();
          btn.classList.remove('listening');
          btn.textContent = '🎤';
          if (res.error) { UI.toast(T('speak.micError')); return; }
          answer({ said: res.transcript });
        });
      } else {
        UI.qsa('#opts .opt', view).forEach((b) => b.addEventListener('click', () => {
          answer({ idx: parseInt(b.getAttribute('data-idx'), 10), ms: 0 });
        }));
      }
    };

    const answer = (response) => {
      lockOptions(view);
      PG.eng.scenario.respond(st, profile, response);
      app.save();
      const kind = st.lastOutcome === 'ok' ? 'ok' : st.lastOutcome === 'support' ? 'ok-support' : 'no';
      feedbackFlash(kind, st.lastOutcome === 'support');
      setTimeout(draw, kind === 'no' ? 900 : 650);
    };

    function mapView(m) {
      return '<div class="map" role="img" aria-label="map">' +
        m.grid.map((row) => '<div class="map-row">' + row.map((cell) => '<span class="map-cell">' + U.esc(cell) + '</span>').join('') + '</div>').join('') +
        '</div>';
    }

    draw();
  };

  /* ============================ STORY LIST ============================ */
  app.screens.stories = function (view) {
    const profile = app.profile, pack = app.targetPack();
    const unlocks = PG.progression.unlockState(profile);
    app.top(T('act.stories'), { back: true });
    view.innerHTML = '<div class="pad list">' +
      '<p class="list-sub">' + U.esc(pack.story.title) + ' — ' + U.esc(pack.story.hero.name) + ' ' + U.esc(pack.story.hero.icon) + '</p>' +
      pack.story.chapters.map((ch, i) => UI.card({
        act: 'ch:' + ch.id, icon: ch.icon, title: (i + 1) + '. ' + ch.title,
        sub: PG.learner.actsFor(profile).story[ch.id] ? T('story.chDone') : ch.sub || '',
        badge: PG.learner.actsFor(profile).story[ch.id] ? '✅' : null,
        locked: !unlocks.chapters[ch.id],
      })).join('') + '</div>';
    UI.qsa('.card[data-act]', view).forEach((c) => c.addEventListener('click', () => {
      if (c.classList.contains('locked')) { UI.toast(T('story.unlockHint')); return; }
      app.go('storyRun', { id: c.getAttribute('data-act').split(':')[1] });
    }));
  };

  /* ============================ STORY RUN ============================ */
  app.screens.storyRun = function (view, params) {
    const profile = app.profile, code = profile.target;
    const st = PG.eng.story.start(profile, code, params.id);
    let lastSpoken = null;

    const draw = () => {
      const v = PG.eng.story.present(st, profile);
      if (v.type === 'summary') {
        app.top(st.ch.title, { back: true });
        const body =
          '<p class="sum-note">📖 ' + U.esc(T('story.checksDone', { n: v.summary.checks })) + '</p>' +
          '<p class="sum-note">🏅 ' + U.esc(T('story.choicesDone', { n: v.summary.flags })) + '</p>';
        view.innerHTML = summaryView(v.summary, body, T('story.summary.title'));
        wireSummary(view, () => app.go('stories'));
        return;
      }

      app.top(st.ch.title, { back: true });

      if (v.type === 'panel') {
        view.innerHTML =
          '<div class="run-wrap">' +
          '<div class="scene-banner" aria-hidden="true">' + U.esc(v.scene) + '</div>' +
          UI.dots(v.idx, v.total) +
          '<div class="char-line">' +
          (v.who ? '<span class="avatar">' + U.esc(v.who.icon) + '</span>' : '<span class="avatar narrator">📖</span>') +
          '<div class="bubble" dir="' + app.targetDir() + '">' + U.esc(v.text) + '</div></div>' +
          '<div class="advance"><button class="btn xl" id="adv">' + (v.last ? '✅ ' + U.esc(T('common.finish')) : '→') + '</button></div>' +
          '</div>';
        if (v.text !== lastSpoken) { lastSpoken = v.text; app.say(v.text); }
        UI.qs('#adv', view).addEventListener('click', () => {
          PG.eng.story.respond(st, profile, { advance: true });
          app.save();
          draw();
        });
        return;
      }

      if (v.type === 'choice') {
        view.innerHTML =
          '<div class="run-wrap">' +
          '<div class="scene-banner" aria-hidden="true">' + U.esc(v.scene) + '</div>' +
          '<p class="choice-prompt" dir="' + app.targetDir() + '">' + U.esc(v.prompt) + '</p>' +
          '<div class="opt-grid">' +
          v.options.map((o) => '<button class="opt story-choice" data-opt="' + o.idx + '"><span class="opt-scene">' + U.esc(o.icon || '') + '</span><span class="opt-t" dir="' + app.targetDir() + '">' + U.esc(o.t) + '</span></button>').join('') +
          '</div></div>';
        UI.qsa('[data-opt]', view).forEach((b) => b.addEventListener('click', () => {
          PG.eng.story.respond(st, profile, { optIdx: parseInt(b.getAttribute('data-opt'), 10) });
          app.save();
          draw();
        }));
        return;
      }

      /* comprehension check */
      view.innerHTML =
        '<div class="run-wrap">' +
        '<div class="scene-banner" aria-hidden="true">' + U.esc(v.scene) + '</div>' +
        '<p class="check-prompt">🎯 ' + U.esc(T('story.checkPrompt')) + '</p>' +
        (v.sayText ? sayRow(v.sayText, 'say') : '') +
        '<div class="opt-grid" id="opts">' +
        v.options.map((o, i) => UI.optBtn(optItem(code, o), i)).join('') + '</div></div>';
      if (v.sayText && v.sayText !== lastSpoken) { lastSpoken = v.sayText; app.say(v.sayText); }

      UI.qsa('#opts .opt', view).forEach((b) => b.addEventListener('click', () => {
        lockOptions(view);
        PG.eng.story.respond(st, profile, { idx: parseInt(b.getAttribute('data-idx'), 10) });
        app.save();
        const kind = st.lastOutcome === 'ok' ? 'ok' : st.lastOutcome === 'support' ? 'ok-support' : 'no';
        feedbackFlash(kind === 'no' ? 'no' : 'ok', st.lastOutcome === 'support');
        setTimeout(draw, kind === 'no' ? 900 : 650);
      }));
    };

    draw();
  };

  /* ============================ READING LIST ============================ */
  app.screens.readings = function (view) {
    const profile = app.profile, pack = app.targetPack();
    const unlocks = PG.progression.unlockState(profile);
    app.top(T('act.reading'), { back: true });
    view.innerHTML = '<div class="pad list">' +
      '<p class="list-sub">' + U.esc(T('read.subtitle')) + '</p>' +
      pack.reading.map((t) => UI.card({
        act: 'tx:' + t.id, icon: t.icon || '📕', title: t.title,
        sub: PG.learner.actsFor(profile).read[t.id] ? '✅ ' + T('common.done') : T('play.new'),
        locked: !unlocks.reading[t.id],
      })).join('') + '</div>';
    UI.qsa('.card[data-act]', view).forEach((c) => c.addEventListener('click', () => {
      if (c.classList.contains('locked')) { UI.toast(T('story.unlockHint')); return; }
      app.go('readRun', { id: c.getAttribute('data-act').split(':')[1] });
    }));
  };
})();

/* ==== ui/screens-practice.js ==== */
/* ============================================================
   POLYGLOT AI — activity run screens (v1.1)
   Chrome/instructions speak the INTERFACE language (T); lesson
   content and in-lesson feedback speak the LEARNING language (L).
   Contains: listening/reading/speaking runs (adapted), the review
   run, one generic trial runner shared by Ear Training, Sounds,
   Numbers and Vocabulary, and the flashcards runner.
   ============================================================ */
(function () {
  'use strict';
  const PG = (globalThis.PG = globalThis.PG || {});
  const U = PG.util;
  const UI = PG.ui;
  const app = PG.app;
  const T = (k, v) => PG.i18n.T(k, v);   // interface language
  const L = (k, v) => PG.i18n.L(k, v);   // learning language (lesson content)

  function optItem(code, o) {
    if (o.it) {
      const it = PG.content.item(code, o.it);
      if (!it) return { t: '' };
      return { img: it.img, t: it.t, sub: app.profile.settings.romaji && it.r ? it.r : '' };
    }
    if (o.sc) return { sc: o.sc };
    return { t: o.t || '', sub: o.r || '' };
  }
  /* freeze options the moment an answer lands (double-click protection) */
  function lockOptions(root) {
    UI.qsa('.opt, .order-card', root).forEach((b) => { b.disabled = true; });
  }
  function flashFeedback(kind) {
    const msgs = kind === 'ok' ? [L('fb.perfect1'), L('fb.perfect2'), L('fb.perfect3')]
      : kind === 'ok-support' ? [L('fb.good1'), L('fb.good2')]
      : [L('fb.tryAgain1'), L('fb.tryAgain2')];
    UI.flash(kind === 'no' ? 'no' : 'ok', U.choice(msgs) + (kind === 'ok-support' ? ' 🐢' : ''));
  }
  function summaryView(s, body, againLabel, title) {
    return '<div class="run-wrap summary">' +
      '<div class="sum-emoji">' + (s.accuracy >= 0.7 ? '🎉' : '🌱') + '</div>' +
      '<h2 class="onb-h">' + U.esc(title || T('scn.summary.title')) + '</h2>' +
      '<div class="sum-stats"><div class="stat"><span class="stat-v">' + Math.round(s.accuracy * 100) + '%</span>' +
      '<span class="stat-l">' + U.esc(T('scn.summary.accuracy')) + '</span></div>' +
      (s.total != null ? '<div class="stat"><span class="stat-v">' + s.total + '</span><span class="stat-l">' + U.esc(T('scn.summary.rounds')) + '</span></div>' : '') +
      '</div>' + body +
      '<div class="onb-actions"><button class="btn" data-again>🔁 ' + U.esc(againLabel || T('summary.again')) + '</button>' +
      '<button class="btn ghost" data-home>🏠 ' + U.esc(T('summary.home')) + '</button></div></div>';
  }
  function wireSummary(view, again) {
    UI.qs('[data-again]', view).addEventListener('click', again);
    UI.qs('[data-home]', view).addEventListener('click', () => app.go('home', null, { root: true }));
  }

  /* ==================== GENERIC TRIAL RUNNER ====================
     Used by Ear Training, Sounds, Numbers and Vocabulary — engines
     expose start/present/respond with a common trial view. */
  function trialRunner(view, engine, startArgs, opts) {
    opts = opts || {};
    const profile = app.profile, code = profile.target;
    const st = engine.start.apply(engine, [profile, code].concat(startArgs || []));

    const draw = () => {
      const v = engine.present(st, profile);
      if (v.type === 'summary') {
        app.top(opts.title || '', { back: true });
        view.innerHTML = summaryView(v.summary, opts.summaryBody ? opts.summaryBody(v.summary) : '', opts.again || T('summary.again'));
        wireSummary(view, () => { app.go(opts.returnTo || 'activities'); });
        return;
      }
      app.top(opts.title || '', { back: true });
      view.innerHTML =
        '<div class="run-wrap">' +
        UI.dots(v.idx, v.total) +
        (opts.instruction ? '<p class="check-prompt">' + U.esc(opts.instruction) + '</p>' : '') +
        '<div class="listen-zone">' +
        '<button class="big-play" id="play" aria-label="' + U.esc(T('listen.play')) + '">' + (opts.playIcon || '🔊') + '</button>' +
        (v.icon ? '<div class="mode-icon">' + U.esc(v.icon) + '</div>' : '') +
        '<p class="mic-hint">' + U.esc(opts.hint || T('listen.hint')) + '</p>' +
        (v.showText ? '<div class="caption" dir="' + app.targetDir() + '">' + U.esc(v.sayText) + '</div>' : '') +
        (v.hint ? '<p class="mic-hint">(' + U.esc(v.hint) + ')</p>' : '') +
        '</div>' +
        '<div class="opt-grid" id="opts">' +
        v.options.map((o, i) => UI.optBtn(optItem(code, o), i)).join('') + '</div></div>';

      const play = () => app.say(v.sayText, { rate: v.rate });
      UI.qs('#play', view).addEventListener('click', () => {
        /* replays are honest evidence: the engine marks support */
        engine.respond(st, profile, { replay: true });
        play();
      });
      play();

      UI.qsa('#opts .opt', view).forEach((b) => b.addEventListener('click', () => {
        lockOptions(view);
        engine.respond(st, profile, { idx: parseInt(b.getAttribute('data-idx'), 10) });
        app.save();
        const kind = st.lastOutcome === 'ok' ? 'ok' : st.lastOutcome === 'support' ? 'ok-support' : 'no';
        flashFeedback(kind);
        setTimeout(draw, kind === 'no' ? 900 : 650);
      }));
    };
    draw();
  }

  app.screens.earRun = function (view) {
    trialRunner(view, PG.eng.ear, [], { title: T('act.ear'), playIcon: '👂', returnTo: 'activities' });
  };
  app.screens.soundsRun = function (view) {
    trialRunner(view, PG.eng.sounds, [], { title: T('act.sounds'), playIcon: '🔊', returnTo: 'activities' });
  };
  app.screens.numbersRun = function (view) {
    trialRunner(view, PG.eng.numbers, [], { title: T('act.numbers'), playIcon: '🔢', returnTo: 'activities' });
  };
  app.screens.vocabRun = function (view) {
    /* Vocabulary alternates exposure cards with checks — needs its own flow */
    const profile = app.profile, code = profile.target;
    const st = PG.eng.vocab.start(profile, code);
    const draw = () => {
      const v = PG.eng.vocab.present(st, profile);
      if (v.type === 'summary') {
        app.top(T('act.vocab'), { back: true });
        const body = '<div class="word-grid">' + (v.summary.newItems || []).map((it) =>
          '<div class="word-card"><span class="w-img">' + U.esc(it.img || '💬') + '</span><span class="w-t">' + U.esc(it.t) + '</span></div>').join('') + '</div>';
        view.innerHTML = summaryView(v.summary, body, T('summary.again'), T('act.vocab'));
        wireSummary(view, () => app.go('activities'));
        return;
      }
      app.top(T('act.vocab'), { back: true });
      if (v.type === 'expose') {
        view.innerHTML =
          '<div class="run-wrap">' +
          UI.dots(v.idx, v.total) +
          '<p class="check-prompt">' + U.esc(T('lr.look')) + '</p>' +
          '<div class="expose-card" dir="' + app.targetDir() + '">' +
          '<span class="expose-img" aria-hidden="true">' + U.esc(v.item.img) + '</span>' +
          '<span class="expose-word">' + U.esc(v.item.t) + '</span>' +
          (v.romaji && v.item.r ? '<span class="roma">' + U.esc(v.item.r) + '</span>' : '') + '</div>' +
          '<div class="onb-actions"><button class="btn xl" id="vx-next">→</button></div></div>';
        app.say(v.item.t, { rate: v.rate });
        UI.qs('#vx-next', view).addEventListener('click', () => {
          PG.eng.vocab.respond(st, profile, { advance: true });
          app.save();
          draw();
        });
        return;
      }
      view.innerHTML =
        '<div class="run-wrap">' +
        UI.dots(v.idx, v.total) +
        '<p class="check-prompt">' + U.esc(T('lr.choosePic')) + '</p>' +
        '<div class="opt-grid" id="opts">' +
        v.options.map((o, i) => UI.optBtn(optItem(code, o), i)).join('') + '</div></div>';
      app.say(v.sayText, { rate: v.rate });
      UI.qsa('#opts .opt', view).forEach((b) => b.addEventListener('click', () => {
        lockOptions(view);
        PG.eng.vocab.respond(st, profile, { idx: parseInt(b.getAttribute('data-idx'), 10) });
        app.save();
        const kind = st.lastOutcome === 'ok' ? 'ok' : st.lastOutcome === 'support' ? 'ok-support' : 'no';
        flashFeedback(kind);
        setTimeout(draw, kind === 'no' ? 900 : 650);
      }));
    };
    draw();
  };

  /* ============================ LISTENING RUN ============================ */
  app.screens.listenRun = function (view, params) {
    const profile = app.profile, code = profile.target;
    const st = PG.eng.listening.start(profile, code, params.id);
    const draw = () => {
      const v = PG.eng.listening.present(st, profile);
      if (v.type === 'summary') {
        app.top(st.set.title, { back: true });
        view.innerHTML = summaryView(v.summary, '');
        wireSummary(view, () => app.go('listenRun', { id: st.set.id }));
        return;
      }
      app.top(T('act.ear'), { back: true });
      view.innerHTML =
        '<div class="run-wrap">' +
        UI.dots(v.idx, v.total) +
        '<div class="listen-zone">' +
        '<button class="big-play" id="play" aria-label="' + U.esc(T('listen.play')) + '">🔊</button>' +
        '<p class="mic-hint">' + U.esc(T('listen.hint')) + '</p>' +
        (v.showText ? '<div class="caption" dir="' + app.targetDir() + '">' + U.esc(v.sayText) + '</div>' : '') +
        '</div>' +
        '<div class="opt-grid" id="opts">' +
        v.options.map((o, i) => UI.optBtn(optItem(code, o), i)).join('') + '</div></div>';

      const play = () => app.say(v.sayText, { rate: v.rate });
      UI.qs('#play', view).addEventListener('click', () => {
        PG.eng.listening.respond(st, profile, { replay: true });
        play();
      });
      play();

      UI.qsa('#opts .opt', view).forEach((b) => b.addEventListener('click', () => {
        lockOptions(view);
        PG.eng.listening.respond(st, profile, { idx: parseInt(b.getAttribute('data-idx'), 10) });
        app.save();
        const kind = st.lastOutcome === 'ok' ? 'ok' : st.lastOutcome === 'support' ? 'ok-support' : 'no';
        flashFeedback(kind);
        setTimeout(draw, kind === 'no' ? 900 : 650);
      }));
    };
    draw();
  };

  /* ============================ READING RUN ============================ */
  app.screens.readRun = function (view, params) {
    const profile = app.profile, code = profile.target;
    const st = PG.eng.reading.start(profile, code, params.id);

    const draw = () => {
      const v = PG.eng.reading.present(st, profile);
      if (v.type === 'summary') {
        app.top(st.tx.title, { back: true });
        view.innerHTML = summaryView(v.summary, '');
        wireSummary(view, () => app.go('readRun', { id: st.tx.id }));
        return;
      }
      app.top(st.tx.title, { back: true });

      if (v.type === 'line') {
        view.innerHTML =
          '<div class="run-wrap reading">' +
          '<div class="scene-banner sm" aria-hidden="true">' + U.esc(v.scene) + '</div>' +
          UI.dots(v.idx, v.total) +
          '<div class="read-line"><button class="round-btn" id="rl-play" aria-label="' + U.esc(T('common.listen')) + '">🔊</button>' +
          '<p class="read-text" dir="' + app.targetDir() + '">' + U.esc(v.text) + '</p></div>' +
          '<div class="advance"><button class="btn xl" id="adv">' + (v.last ? '✅ ' + U.esc(T('read.tasks')) : '→') + '</button></div></div>';
        UI.qs('#rl-play', view).addEventListener('click', () => app.say(v.text, { rate: 0.9 }));
        UI.qs('#adv', view).addEventListener('click', () => { PG.eng.reading.respond(st, profile, { advance: true }); app.save(); draw(); });
        return;
      }

      if (v.kind === 'order') {
        view.innerHTML =
          '<div class="run-wrap">' +
          '<p class="check-prompt">🔢 ' + U.esc(v.prompt || T('read.task.order')) + '</p>' +
          '<div class="order-slots" id="slots">' +
          v.cards.map((c, i) => {
            const pos = v.picked.indexOf(c.i);
            return '<button class="opt order-card' + (pos >= 0 ? ' picked' : '') + '" data-card="' + c.i + '">' +
              (pos >= 0 ? '<span class="ord-n">' + (pos + 1) + '</span>' : '') +
              '<span class="opt-scene">' + U.esc(c.sc || '') + '</span><span class="opt-t" dir="' + app.targetDir() + '">' + U.esc(c.t) + '</span></button>';
          }).join('') + '</div>' +
          '<div class="onb-actions"><button class="btn" id="ord-submit" ' + (v.picked.length === v.cards.length ? '' : 'disabled') + '>' + U.esc(T('common.check')) + '</button>' +
          (v.picked.length ? '<button class="btn ghost" id="ord-clear" aria-label="' + U.esc(T('common.undo')) + '">↩ ' + U.esc(T('common.undo')) + '</button>' : '') + '</div></div>';
        UI.qsa('[data-card]', view).forEach((b) => b.addEventListener('click', () => {
          if (b.disabled) return;
          PG.eng.reading.respond(st, profile, { pick: parseInt(b.getAttribute('data-card'), 10) });
          draw();
        }));
        const sub = UI.qs('#ord-submit', view);
        if (sub) sub.addEventListener('click', () => {
          lockOptions(view);
          const before = st.firstTry;
          PG.eng.reading.respond(st, profile, { submit: true });
          app.save();
          const ok = st.firstTry > before;
          UI.flash(ok ? 'ok' : 'no', ok ? L('fb.perfect1') : L('fb.tryAgain2'));
          setTimeout(draw, ok ? 650 : 1100);
        });
        const clr = UI.qs('#ord-clear', view);
        if (clr) clr.addEventListener('click', () => {
          while (st.orderPicked.length) PG.eng.reading.respond(st, profile, { unpick: st.orderPicked[0] });
          draw();
        });
        return;
      }

      view.innerHTML =
        '<div class="run-wrap">' +
        '<p class="check-prompt">🎯 ' + U.esc(v.prompt || T('read.task.match')) + '</p>' +
        (v.say ? '<div class="say-line"><button class="round-btn" id="tk-play" aria-label="' + U.esc(T('common.listen')) + '">🔊</button><span class="say-text" dir="' + app.targetDir() + '">' + U.esc(v.say) + '</span></div>' : '') +
        '<div class="opt-grid" id="opts">' +
        v.options.map((o, i) => UI.optBtn(optItem(code, o), i)).join('') + '</div></div>';
      const p = UI.qs('#tk-play', view);
      if (p) p.addEventListener('click', () => app.say(v.say));
      UI.qsa('#opts .opt', view).forEach((b) => b.addEventListener('click', () => {
        lockOptions(view);
        PG.eng.reading.respond(st, profile, { idx: parseInt(b.getAttribute('data-idx'), 10) });
        app.save();
        const kind = st.lastOutcome === 'ok' ? 'ok' : st.lastOutcome === 'support' ? 'ok-support' : 'no';
        flashFeedback(kind);
        setTimeout(draw, kind === 'no' ? 900 : 650);
      }));
    };
    draw();
  };

  /* ============================ SPEAKING ============================ */
  app.screens.speakRun = function (view) {
    const profile = app.profile;
    app.top(T('act.speaking'), { back: true });
    const asr = PG.providers.asr.supported;

    view.innerHTML =
      '<div class="run-wrap">' +
      '<div class="scene-banner">🎤</div>' +
      '<h2 class="onb-h">' + U.esc(T('act.speaking')) + '</h2>' +
      '<p class="onb-sub">' + U.esc(asr ? T('speak.privacy') : T('speak.noAsr')) + '</p>' +
      '<div class="onb-actions"><button class="btn xl" id="sp-start">▶ ' + U.esc(T('common.start')) + '</button></div></div>';

    UI.qs('#sp-start', view).addEventListener('click', () => {
      const st = PG.eng.speaking.start(profile, profile.target, asr);
      const draw = () => {
        const v = PG.eng.speaking.present(st, profile);
        if (v.type === 'summary') {
          const body = '<div class="word-grid">' + v.summary.items.map((r) =>
            '<div class="word-card"><span class="w-img">' + U.esc(r.it && r.it.img || '💬') + '</span>' +
            '<span class="w-t">' + U.esc(r.it ? r.it.t : '') + '</span><span class="w-sub">' + (r.ok ? '✅' : '🔁') + '</span></div>').join('') + '</div>';
          view.innerHTML = summaryView(v.summary, body, T('summary.again'), T('act.speaking'));
